name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest

      - name: Check dependencies and syntax
        run: |
          python -m pip check
          python -m compileall -q app tests

      # Tests use a throwaway SQLite database (see tests/conftest.py).
      # The old step loaded schema.sql into Postgres, but that file describes a
      # different schema (UUID ids, other tables) from the app's models, so it
      # failed before any test ran.
      - name: Run tests
        run: python -m pytest -q

  # Same tests against PostgreSQL, the database the live site uses. Catches
  # things SQLite lets through (foreign keys, column types, Postgres-only SQL).
  test-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: salon_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d salon_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r requirements.txt pytest
      - name: Run tests on PostgreSQL
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/salon_test
        run: python -m pytest -q
