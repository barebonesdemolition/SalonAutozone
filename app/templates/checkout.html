<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Checkout · SalonAutoZone</title>
<meta name="theme-color" content="#0e2a2b">
<link rel="icon" type="image/png" href="/static/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&display=swap" data-saz-font>
<link rel="stylesheet" href="/static/ui.css?v=6">
<link rel="stylesheet" href="/static/chrome.css?v=5">
<style>
.page-title { font-size: clamp(28px, 5vw, 40px); margin: 22px 0 16px; font-variation-settings: "wdth" 78; }
.co { display: grid; gap: 20px; }
@media (min-width: 900px) { .co { grid-template-columns: minmax(0, 1fr) 360px; align-items: start; } .co aside { position: sticky; top: calc(var(--header-h) + 16px); } }
.item { display: flex; justify-content: space-between; gap: 12px; padding: 8px 0; border-bottom: 1px solid var(--line); }
.item:last-of-type { border-bottom: 0; }
.row { display: flex; justify-content: space-between; padding: 6px 0; }
.row.total { border-top: 1px solid var(--line); margin-top: 6px; padding-top: 12px; font-size: 20px; font-weight: 800; color: var(--ink); }
.msg { margin-top: 10px; font-weight: 600; color: var(--bad); }
.pin-box { margin-top: 16px; padding: 14px; border: 1.5px dashed var(--line); border-radius: var(--r-md); background: var(--paper); }
.pin-box b { color: var(--ink); }
.pin-box .acts { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
#map { height: 280px; border-radius: var(--r-sm); margin-top: 10px; display: none; }
#map.on { display: block; }
.pin-state { font-weight: 700; margin-top: 8px; }
.pin-state.ok { color: var(--ok); }
</style>
</head>
<body>
<div id="site-header"></div>
<main class="wrap">
 <h1 class="page-title">Delivery details</h1>
 <div id="root"><div class="lcard skeleton"></div></div>
</main>
<script src="/static/cart.js?v=4"></script>
<script src="/static/site.js?v=5"></script>
<script>
(function () {
 'use strict';
 var root = document.getElementById('root');
 function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
 function fmt(n) { return Number(n || 0).toLocaleString('en-GB'); }
 function token() { try { return localStorage.getItem('token') || ''; } catch (e) { return ''; } }
 if (!token()) { location.replace('/login?next=' + encodeURIComponent(location.pathname + location.search)); return; }
 function user() { try { return JSON.parse(localStorage.getItem('userInfo') || '{}') || {}; } catch (e) { return {}; } }

 var items = (new URLSearchParams(location.search).get('items') || '').split(',').map(function (s) {
  var p = s.split(':'); return { part_id: Number(p[0]), qty: Math.max(1, Math.min(20, Number(p[1] || 1))) };
 }).filter(function (i) { return i.part_id > 0; });
 if (!items.length) { root.innerHTML = '<div class="box" style="text-align:center"><h2>Your cart is empty</h2><a class="btn btn-primary" style="margin-top:12px" href="/">Browse parts</a></div>'; return; }

 Promise.all(items.map(function (it) {
  return fetch('/api/parts/' + it.part_id).then(function (r) { return r.ok ? r.json() : null; }).catch(function () { return null; });
 })).then(function (parts) {
  var rows = [], total = 0, gone = 0;
  parts.forEach(function (p, i) {
   if (!p) { gone++; return; }
   var price = Number(p.price_sll || 0);
   rows.push({ part: p, qty: items[i].qty, price: price });
   total += price * items[i].qty;
  });
  if (!rows.length) { root.innerHTML = '<div class="notice notice-bad">These parts are no longer listed. <a href="/">Find others</a>.</div>'; return; }
  render(rows, total, gone);
 });

 function render(rows, total, gone) {
  var u = user();
  root.innerHTML = '<div class="co">' +
   '<form class="box" id="co-form" novalidate>' +
    (gone ? '<div class="notice notice-warn" style="margin-bottom:12px">' + gone + ' item' + (gone > 1 ? 's are' : ' is') + ' no longer listed and was left out.</div>' : '') +
    '<h2>Where should we deliver?</h2>' +
    '<label class="field"><span>Street address</span><input class="input" id="addr" maxlength="200" placeholder="12 Kissy Road, near the mosque" autocomplete="street-address"></label>' +
    '<label class="field"><span>Area or town</span><input class="input" id="area" maxlength="60" value="Freetown" autocomplete="address-level2"></label>' +
    '<label class="field"><span>Phone number for the driver</span><input class="input" id="phone" type="tel" maxlength="25" placeholder="+232 76 123456" autocomplete="tel" value="' + esc(u.phone || '') + '"></label>' +
    '<div class="pin-box"><b>Show the driver exactly where you are</b><p class="hint" style="margin:2px 0 0">Optional, but it helps when the address is hard to find. Uses a little mobile data for the map.</p>' +
     '<div class="acts"><button type="button" class="btn btn-ghost" id="pin-here">Use my current location</button><button type="button" class="btn btn-ghost" id="pin-map">Drop a pin on the map</button></div>' +
     '<div id="map" aria-label="Map: tap to move your pin"></div><div class="pin-state" id="pin-state" aria-live="polite"></div></div>' +
    '<button class="btn btn-primary btn-lg btn-block" style="margin-top:20px" type="submit" id="place">Place order</button>' +
    '<div class="msg" id="msg" aria-live="polite"></div>' +
    '<p class="hint">After you order, we contact you on this number to confirm payment. The delivery fee depends on the size of the parts and is shown on the next screen.</p>' +
   '</form>' +
   '<aside class="box"><h2>Your order</h2>' + rows.map(function (r) {
     return '<div class="item"><span>' + esc(r.part.name) + ' <span style="color:var(--muted)">× ' + r.qty + '</span></span><b>SLL ' + fmt(r.price * r.qty) + '</b></div>';
    }).join('') +
    '<div class="row total"><span>Parts</span><span>SLL ' + fmt(total) + '</span></div>' +
    '<a href="/cart" class="hint" style="display:inline-block">Edit cart</a>' +
   '</aside></div>';

  // ---- delivery pin (Leaflet + OpenStreetMap, loaded only if the buyer asks for it) ----
  var pin = null, map = null, marker = null;
  var FREETOWN = [8.4844, -13.2344];
  function pinState(text, ok) { var el = document.getElementById('pin-state'); el.textContent = text; el.className = 'pin-state' + (ok ? ' ok' : ''); }
  function setPin(lat, lng) {
   pin = { lat: Math.round(lat * 1e6) / 1e6, lng: Math.round(lng * 1e6) / 1e6 };
   if (map) {
    if (marker) marker.setLatLng([lat, lng]);
    else { marker = L.marker([lat, lng], { draggable: true }).addTo(map); marker.on('dragend', function () { var p = marker.getLatLng(); setPin(p.lat, p.lng); }); }
   }
   pinState('Pin set. The driver will get directions to it. Tap the map or drag the pin to adjust.', true);
  }
  function loadLeaflet() {
   if (window.L) return Promise.resolve();
   return new Promise(function (ok, fail) {
    var css = document.createElement('link'); css.rel = 'stylesheet'; css.href = 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css'; document.head.appendChild(css);
    var js = document.createElement('script'); js.src = 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js'; js.onload = ok; js.onerror = fail; document.head.appendChild(js);
   });
  }
  function openMap(center) {
   pinState('Loading the map…');
   return loadLeaflet().then(function () {
    var el = document.getElementById('map'); el.classList.add('on');
    if (!map) {
     map = L.map(el).setView(center || FREETOWN, center ? 17 : 13);
     L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19, attribution: '&copy; OpenStreetMap contributors' }).addTo(map);
     map.on('click', function (ev) { setPin(ev.latlng.lat, ev.latlng.lng); });
    } else if (center) map.setView(center, 17);
    if (pin) setPin(pin.lat, pin.lng); else pinState('Tap the map where the driver should come.');
   }).catch(function () {
    if (pin) pinState('Pin set from your location. (The map couldn\'t load to show it.)', true);
    else pinState('The map couldn\'t load. You can still use your current location, or skip this.');
   });
  }
  document.getElementById('pin-map').addEventListener('click', function () { openMap(pin ? [pin.lat, pin.lng] : null); });
  document.getElementById('pin-here').addEventListener('click', function () {
   if (!navigator.geolocation) { pinState('Your phone didn\'t share a location. Drop a pin on the map instead.'); return; }
   pinState('Finding you…');
   navigator.geolocation.getCurrentPosition(function (pos) {
    setPin(pos.coords.latitude, pos.coords.longitude);
    openMap([pos.coords.latitude, pos.coords.longitude]);
   }, function () { pinState('We couldn\'t get your location. Allow location access, or drop a pin on the map.'); }, { enableHighAccuracy: true, timeout: 15000 });
  });

  document.getElementById('co-form').addEventListener('submit', function (e) {
   e.preventDefault();
   var btn = document.getElementById('place'), msg = document.getElementById('msg');
   var addr = document.getElementById('addr').value.trim(), area = document.getElementById('area').value.trim(), phone = document.getElementById('phone').value.trim();
   msg.textContent = '';
   if (addr.length < 5) { msg.textContent = 'Enter your street address so the driver can find you.'; return; }
   if (area.length < 2) { msg.textContent = 'Enter your area or town.'; return; }
   if (phone.replace(/\D/g, '').length < 6) { msg.textContent = 'Enter a phone number the driver can call.'; return; }
   btn.disabled = true; btn.textContent = 'Placing order…';
   fetch('/api/shop/orders', {
    method: 'POST', headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + token() },
    body: JSON.stringify({ items: rows.map(function (r) { return { part_id: r.part.id, qty: r.qty }; }), delivery_address: addr, delivery_area: area, phone: phone, delivery_lat: pin ? pin.lat : null, delivery_lng: pin ? pin.lng : null })
   }).then(function (r) {
    return r.json().catch(function () { return {}; }).then(function (d) {
     if (r.status === 401) { location.href = '/login?next=' + encodeURIComponent(location.pathname + location.search); return; }
     if (!r.ok) throw new Error(typeof d.detail === 'string' ? d.detail : 'We couldn\'t place your order. Check the details and try again.');
     try { rows.forEach(function (row) { SAZCart.remove(row.part.id); }); } catch (err) {}
     location.href = '/orders?id=' + encodeURIComponent(d.id) + '&new=1';
    });
   }).catch(function (err) { btn.disabled = false; btn.textContent = 'Place order'; msg.textContent = err.message; });
  });
 }
})();
</script>
</body>
</html>
