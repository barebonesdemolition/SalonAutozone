<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My subscription · SalonAutoZone</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="icon" type="image/png" href="/static/logo.png">
<style>
* { box-sizing: border-box; }
body { margin:0; font-family: Inter, system-ui, sans-serif; background:#f8fafc; color:#0f172a; }
.top { display:flex; align-items:center; gap:12px; padding:14px clamp(16px,5vw,56px); background:#fff; border-bottom:1px solid #e2e8f0; }
.brand { display:flex; align-items:center; gap:10px; text-decoration:none; color:#0f172a; font-weight:800; font-size:17px; }
.brand img { height:44px; width:44px; border-radius:50%; }
.brand span { color:#0f766e; }
.wrap { max-width: 720px; margin: 0 auto; padding: 28px 16px 60px; }
h1 { font-size: 26px; margin: 0 0 6px; }
.sub { color:#64748b; font-size:14px; margin: 0 0 24px; }
.card { background:#fff; border:1px solid #e2e8f0; border-radius:14px; padding: 24px; margin-bottom: 20px; }
.current-plan { display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:12px; }
.current-plan h2 { margin: 0 0 4px; font-size: 20px; }
.badge { display:inline-flex; align-items:center; gap:4px; background:#d1fae5; color:#065f46; font-size:12px; font-weight:700; padding:4px 10px; border-radius:20px; }
.badge.pending { background:#fef3c7; color:#92400e; }
.badge.rejected { background:#fee2e2; color:#991b1b; }
.field { margin-bottom: 14px; }
label { display:block; font-size:12px; font-weight:700; color:#475569; margin-bottom:5px; text-transform:uppercase; letter-spacing:.04em; }
input, select, textarea { width:100%; padding: 11px 12px; border:1px solid #cbd5e1; border-radius:8px; font: inherit; }
input:focus, select:focus, textarea:focus { outline: 3px solid rgba(13,148,136,.2); border-color:#0d9488; }
textarea { resize: vertical; min-height: 70px; }
.btn { display:inline-flex; align-items:center; justify-content:center; padding: 12px 20px; border-radius:8px; background:#0f766e; color:#fff; font-weight:700; border: 0; cursor: pointer; font: inherit; }
.btn:hover { opacity: .9; }
.btn:disabled { opacity: .6; cursor: wait; }
.status { margin-top: 12px; font-size: 14px; min-height: 20px; }
.status.ok { color:#0f766e; font-weight:600; }
.status.err { color:#b91c1c; font-weight:600; }
.pmt-row { display:flex; justify-content:space-between; padding: 10px 0; border-bottom:1px solid #e2e8f0; font-size: 14px; }
.pmt-row:last-child { border-bottom: 0; }
.pmt-row .st { font-weight: 700; }
.st.pending { color:#92400e; }
.st.confirmed { color:#065f46; }
.st.rejected { color:#991b1b; }
.empty { color:#94a3b8; font-style:italic; padding: 12px 0; }
.note { background:#fffbeb; border:1px solid #fde68a; padding: 14px 16px; border-radius: 10px; color:#78350f; font-size: 14px; margin-bottom: 20px; }
</style>
</head>
<body>

<header class="top">
  <a class="brand" href="/">
    <img src="/static/logo.png" alt="SalonAutoZone">
    <em style="font-style:normal;">Salon<span>AutoZone</span></em>
  </a>
</header>

<div class="wrap" id="content">
  <div class="loading">Loading your subscription...</div>
</div>

<script>
(function() {
  var wrap = document.getElementById('content');
  var token = null;
  try { token = localStorage.getItem('token') || localStorage.getItem('access_token'); } catch(e) {}
  if (!token) { location.replace('/login?next=' + encodeURIComponent('/my-subscription')); return; }

  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
  function fmtPrice(sll) { if (sll === 0) return 'Free'; return 'SLL ' + Number(sll).toLocaleString('en-US', { maximumFractionDigits: 0 }); }
  function authHeaders() { return { 'Authorization': 'Bearer ' + token }; }

  var plansCache = [];

  Promise.all([
    fetch('/api/plans').then(function(r){ return r.json(); }),
    fetch('/api/subscriptions/my', { headers: authHeaders() }).then(function(r){ return r.json(); }),
  ])
    .then(function(results) {
      plansCache = results[0].plans || [];
      render(results[1]);
    })
    .catch(function(e) {
      wrap.innerHTML = '<div class="card"><p>Could not load. <a href="/">Home</a></div>';
    });

  function render(d) {
    if (!d.business) {
      wrap.innerHTML = '<div class="card"><h1>Subscription</h1><p>You need a business account to subscribe. <a href="/become-a-seller">Apply as a business</a>.</p></div>';
      return;
    }

    var html = '<h1>My subscription</h1>';
    html += '<p class="sub">Business: <strong>' + esc(d.business.name) + '</strong> · ' + esc(d.business.status) + '</p>';

    // Current subscription
    var sub = d.subscription;
    html += '<div class="card">';
    html += '  <div class="current-plan">';
    if (sub && sub.status === 'active') {
      html += '    <div><h2>' + esc(sub.plan_name) + ' <span class="badge">✓ Active</span></h2>';
      html += '      <p class="sub" style="margin:6px 0 0;">Expires ' + esc(String(sub.expires_at || '').slice(0,10)) + '</p></div>';
    } else if (sub && sub.status === 'pending') {
      html += '    <div><h2>' + esc(sub.plan_name) + ' <span class="badge pending">Pending approval</span></h2>';
      html += '      <p class="sub" style="margin:6px 0 0;">Waiting for admin to confirm your payment.</p></div>';
    } else {
      html += '    <div><h2>No active plan</h2>';
      html += '      <p class="sub" style="margin:6px 0 0;">Choose a plan below to get verified and increase your listings.</p></div>';
    }
    html += '    <a class="btn" href="/plans" style="text-decoration:none;">' + (sub && sub.status === 'active' ? 'Upgrade' : 'Choose a plan') + '</a>';
    html += '  </div>';
    html += '</div>';

    // Payment form (if a plan was selected via ?plan=ID or user picks below)
    var params = new URLSearchParams(location.search);
    var preselectedPlanId = parseInt(params.get('plan') || '0', 10);

    html += '<div class="card">';
    html += '  <h2 style="margin-top:0;">Submit an Orange Money payment</h2>';
    html += '  <p class="sub">Send the plan amount to our Orange Money number, then enter the reference number below. We&rsquo;ll verify and activate your plan.</p>';
    html += '  <div class="note">Orange Money number: <strong>+232 76 123 456</strong> (SalonAutoZone). Use the payment reference below when you send.</div>';
    html += '  <div class="field"><label for="plan">Plan</label><select id="plan">';
    plansCache.forEach(function(p) {
      html += '<option value="' + p.id + '" data-price="' + p.price_sll + '"' + (p.id === preselectedPlanId ? ' selected' : '') + '>' + esc(p.name) + ' — ' + fmtPrice(p.price_sll) + (p.price_sll > 0 ? '/month' : '') + '</option>';
    });
    html += '  </select></div>';
    html += '  <div class="field"><label for="amount">Amount (SLL)</label><input id="amount" type="number" min="0" step="1000"></div>';
    html += '  <div class="field"><label for="reference">Orange Money reference *</label><input id="reference" placeholder="e.g. 2026100712345678" required></div>';
    html += '  <div class="field"><label for="note">Note (optional)</label><textarea id="note" placeholder="Anything we should know?"></textarea></div>';
    html += '  <button class="btn" id="submit-btn">Submit payment</button>';
    html += '  <p class="status" id="status"></p>';
    html += '</div>';

    // Payment history
    html += '<div class="card"><h2 style="margin-top:0;">Recent payments</h2>';
    if (!d.pending_payments || d.pending_payments.length === 0) {
      html += '<div class="empty">No payments submitted yet.</div>';
    } else {
      d.pending_payments.forEach(function(p) {
        html += '<div class="pmt-row">';
        html += '  <div>Ref: <strong>' + esc(p.reference) + '</strong><br><span style="color:#64748b;font-size:12px;">' + esc(String(p.created_at).slice(0,10)) + '</span></div>';
        html += '  <div style="text-align:right;">' + fmtPrice(p.amount_sll) + '<br><span class="st ' + esc(p.status) + '">' + esc(p.status) + '</span></div>';
        html += '</div>';
      });
    }
    html += '</div>';

    wrap.innerHTML = html;
    wireEvents();
  }

  function wireEvents() {
    var planSel = document.getElementById('plan');
    var amtInp = document.getElementById('amount');
    function syncAmount() {
      var opt = planSel.options[planSel.selectedIndex];
      var price = parseInt(opt.getAttribute('data-price') || '0', 10);
      if (price > 0 && (!amtInp.value || amtInp.dataset.lastPlan !== planSel.value)) {
        amtInp.value = price;
        amtInp.dataset.lastPlan = planSel.value;
      }
    }
    planSel.addEventListener('change', syncAmount);
    syncAmount();

    var btn = document.getElementById('submit-btn');
    var status = document.getElementById('status');
    btn.addEventListener('click', async function() {
      var planId = parseInt(planSel.value, 10);
      var amount = parseInt(amtInp.value, 10);
      var reference = document.getElementById('reference').value.trim();
      var note = document.getElementById('note').value.trim() || null;

      if (!reference) { status.textContent = 'Reference is required'; status.className = 'status err'; return; }

      btn.disabled = true;
      status.textContent = 'Submitting...'; status.className = 'status';

      try {
        var r = await fetch('/api/subscriptions/pay', {
          method: 'POST',
          headers: Object.assign({ 'Content-Type': 'application/json' }, authHeaders()),
          body: JSON.stringify({ plan_id: planId, amount_sll: amount, reference: reference, note: note }),
        });
        var d = await r.json();
        if (!r.ok) throw new Error(d.detail || 'Could not submit');
        status.textContent = 'Payment submitted. Admin will confirm shortly.';
        status.className = 'status ok';
        setTimeout(function() { location.reload(); }, 1200);
      } catch (e) {
        status.textContent = e.message;
        status.className = 'status err';
        btn.disabled = false;
      }
    });
  }
})();
</script>
</body>
</html>
