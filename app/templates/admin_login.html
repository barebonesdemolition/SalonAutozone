<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Admin sign in · SalonAutoZone</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light;--ink:#0f172a;--muted:#64748b;--paper:#f8fafc;--surface:#fff;--line:#e2e8f0;--brand:#0f766e;--brand-dark:#0d9488;--amber:#e8a317;--danger:#b91c1c;--shadow:0 18px 60px rgba(15,23,42,.12)}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:linear-gradient(145deg,#e8f3ef 0%,var(--paper) 48%,#f8fafc 100%);color:var(--ink);font-family:Manrope,system-ui,sans-serif;display:grid;grid-template-rows:auto 1fr}a{color:inherit;text-decoration:none}.top{display:flex;justify-content:space-between;align-items:center;padding:18px clamp(16px,5vw,56px);border-bottom:1px solid rgba(15,23,42,.08)}.brand{font-weight:800;font-size:16px}.brand span{color:var(--brand)}.top a:last-child{font-size:13px;color:var(--muted);font-weight:700}.main{display:grid;place-items:center;padding:28px 16px}.login{width:min(100%,440px);background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:clamp(24px,5vw,40px);box-shadow:var(--shadow)}.eyebrow{color:var(--brand);text-transform:uppercase;font-size:11px;font-weight:800;letter-spacing:.08em}.login h1{font-size:28px;line-height:1.2;margin:9px 0}.sub{font-size:14px;color:var(--muted);margin:0 0 24px}.field{display:block;font-size:13px;font-weight:700;margin:0 0 7px}.key{width:100%;min-height:50px;padding:12px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink);font:inherit}.key:focus{outline:3px solid rgba(13,148,136,.18);border-color:var(--brand)}.submit{width:100%;min-height:50px;margin-top:14px;border:0;border-radius:8px;background:var(--brand);color:white;font:inherit;font-weight:800;cursor:pointer}.submit:hover{background:var(--brand-dark)}.submit:disabled{opacity:.65;cursor:wait}.status{min-height:24px;margin-top:12px;color:var(--danger);font-size:13px;font-weight:700}.foot{margin:12px 0 0;color:var(--muted);font-size:12px;line-height:1.6}.foot a{color:var(--brand);font-weight:700}:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
</style>
</head>
<body>
<header class="top"><a class="brand" href="/">Salon<span>AutoZone</span> · Admin</a><a href="/">Back to marketplace</a></header>
<main class="main"><section class="login" aria-labelledby="title"><p class="eyebrow">Restricted access</p><h1 id="title">Admin sign in</h1><p class="sub">Enter the admin access key configured for this deployment.</p><form id="admin-form"><label class="field" for="admin-key">Admin access key</label><input class="key" id="admin-key" name="key" type="password" autocomplete="current-password" required><button class="submit" id="submit" type="submit">Verify and continue</button><p class="status" id="status" role="status" aria-live="polite"></p></form><p class="foot">Admin access must be configured by the site operator. This key is kept for this browser tab only.</p></section></main>
<script>
(function () {
  var form = document.getElementById('admin-form');
  var input = document.getElementById('admin-key');
  var button = document.getElementById('submit');
  var status = document.getElementById('status');
  form.addEventListener('submit', async function (event) {
    event.preventDefault();
    button.disabled = true;
    status.textContent = 'Verifying admin access…';
    try {
      var response = await fetch('/api/admin/verify', {headers:{'X-Admin-Key':input.value}});
      if (!response.ok) throw new Error(response.status === 403 ? 'Invalid key or admin access is not configured.' : 'Admin verification failed (HTTP ' + response.status + ').');
      sessionStorage.setItem('adminKey', input.value);
      location.replace('/admin/dashboard');
    } catch (error) {
      status.textContent = error instanceof TypeError ? 'Could not reach the server. Check your connection and try again.' : (error.message || 'Could not verify access.');
      button.disabled = false;
      input.focus();
    }
  });
})();
</script>
</body>
</html>
