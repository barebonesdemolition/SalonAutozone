<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Admin sign in · SalonAutoZone</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0e2a2b">
<link rel="icon" type="image/png" href="/static/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&display=swap" data-saz-font>
<link rel="stylesheet" href="/static/ui.css?v=6">
<link rel="stylesheet" href="/static/chrome.css?v=5">
<style>
body { background: var(--ink); }
.shell { min-height: calc(100vh - var(--header-h)); display: flex; align-items: center; justify-content: center; padding: 32px 16px; }
.card { width: 100%; max-width: 400px; background: var(--card); border-radius: var(--r-lg); padding: 26px 22px; box-shadow: 0 24px 60px -24px rgba(0, 0, 0, .5); }
.eyebrow { display: inline-flex; font-size: 12px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; color: #8a5a00; background: var(--gold-50); padding: 3px 9px; border-radius: 999px; }
.card h1 { font-size: 28px; margin-top: 10px; }
.card .hint { font-size: 14px; }
.or { display: flex; align-items: center; gap: 10px; color: var(--muted); font-size: 13px; margin: 18px 0 4px; }
.or::before, .or::after { content: ""; flex: 1; height: 1px; background: var(--line); }
</style>
</head>
<body data-tabbar="off" data-footer="off">
<div id="site-header"></div>
<main class="shell">
 <section class="card" aria-labelledby="title">
  <span class="eyebrow">Admins only</span>
  <h1 id="title">Admin sign in</h1>
  <p class="hint">Use the admin key, or log in with an admin account.</p>
  <form id="f">
   <label class="field"><span>Admin key</span><input class="input" id="key" type="password" autocomplete="current-password" required></label>
   <button class="btn btn-primary btn-block" style="margin-top:14px" id="go" type="submit">Continue</button>
   <div id="msg" aria-live="polite"></div>
  </form>
  <div class="or">or</div>
  <a class="btn btn-ghost btn-block" href="/login?next=/admin/dashboard">Log in with an admin account</a>
  <p class="hint" style="margin-top:14px">The key is kept for this browser tab only and is forgotten when you close it.</p>
 </section>
</main>
<script src="/static/site.js?v=5"></script>
<script>
(function () {
 'use strict';
 var f = document.getElementById('f'), key = document.getElementById('key'), go = document.getElementById('go'), msg = document.getElementById('msg');
 function show(t) { msg.innerHTML = t ? '<div class="notice notice-bad" style="margin-top:12px"></div>' : ''; if (t) msg.firstChild.textContent = t; }
 var token = '';
 try { token = localStorage.getItem('token') || localStorage.getItem('access_token') || ''; } catch (e) {}
 // Already signed in with an admin account or key? Go straight in.
 var saved = '';
 try { saved = sessionStorage.getItem('adminKey') || ''; } catch (e) {}
 if (token || saved) {
  var h = {}; if (saved) h['X-Admin-Key'] = saved; if (token) h['Authorization'] = 'Bearer ' + token;
  fetch('/api/admin/verify', { headers: h }).then(function (r) { if (r.ok) location.replace('/admin/dashboard'); }).catch(function () {});
 }
 f.addEventListener('submit', function (e) {
  e.preventDefault();
  go.disabled = true; show('');
  fetch('/api/admin/verify', { headers: { 'X-Admin-Key': key.value } }).then(function (r) {
   if (!r.ok) throw new Error(r.status === 403 ? 'That key isn\'t right.' : 'We couldn\'t check the key. Try again.');
   try { sessionStorage.setItem('adminKey', key.value); } catch (er) {}
   location.replace('/admin/dashboard');
  }).catch(function (err) {
   show(err instanceof TypeError ? 'No connection. Check your internet and try again.' : err.message);
   go.disabled = false; key.select();
  });
 });
})();
</script>
</body>
</html>
