<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Businesses · SalonAutoZone</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="icon" type="image/png" href="/static/logo.png">
<style>
* { box-sizing: border-box; }
body { margin:0; font-family: Inter, system-ui, sans-serif; background:#f8fafc; color:#0f172a; }
.top { display:flex; align-items:center; gap:12px; padding:14px clamp(16px,5vw,56px); background:#fff; border-bottom:1px solid #e2e8f0; }
.brand { display:flex; align-items:center; gap:10px; text-decoration:none; color:#0f172a; font-weight:800; font-size:17px; }
.brand img { height:44px; width:44px; border-radius:50%; }
.brand span { color:#0f766e; }
.wrap { max-width: 1100px; margin: 0 auto; padding: 24px 16px 60px; }
h1 { font-size: 26px; margin: 0 0 6px; }
.sub { color:#64748b; font-size:14px; margin: 0 0 24px; }
.grid { display:grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap:16px; }
.card { background:#fff; border:1px solid #e2e8f0; border-radius:12px; padding:18px; text-decoration:none; color:inherit; display:flex; gap:14px; align-items:flex-start; transition: box-shadow .15s; }
.card:hover { box-shadow: 0 8px 24px rgba(15,23,42,.08); }
.card .logo { width:60px; height:60px; border-radius:50%; object-fit:cover; background:#e2e8f0; flex-shrink:0; }
.card .body { flex:1; min-width: 0; }
.card h3 { margin:0 0 4px; font-size:16px; display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
.badge { display:inline-flex; align-items:center; gap:3px; font-size:11px; font-weight:700; padding:2px 8px; border-radius:20px; }
.badge.verified { background:#d1fae5; color:#065f46; }
.badge.pending { background:#fef3c7; color:#92400e; }
.badge.rejected { background:#fee2e2; color:#991b1b; }
.card .meta { font-size:13px; color:#64748b; margin: 4px 0 0; }
.card .desc { font-size:13px; color:#475569; margin-top:6px; overflow: hidden; text-overflow: ellipsis; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.empty { color:#94a3b8; font-style:italic; padding: 40px; text-align:center; background:#fff; border:1px dashed #cbd5e1; border-radius: 12px; }
.loading { padding: 40px; text-align:center; color:#64748b; }
.counters { display:flex; gap:16px; margin-bottom: 24px; flex-wrap:wrap; }
.stat { background:#fff; border:1px solid #e2e8f0; border-radius:10px; padding: 12px 18px; }
.stat .n { font-size: 22px; font-weight:800; color:#0f766e; }
.stat .l { font-size: 12px; color:#64748b; text-transform:uppercase; letter-spacing:.05em; }
</style>
</head>
<body>

<header class="top">
  <a class="brand" href="/">
    <img src="/static/logo.png" alt="SalonAutoZone">
    <em style="font-style:normal;">Salon<span>AutoZone</span></em>
  </a>
</header>

<div class="wrap" id="content">
  <div class="loading">Loading businesses...</div>
</div>

<script>
(function() {
  var wrap = document.getElementById('content');

  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }

  function badge(status) {
    if (status === 'verified') return '<span class="badge verified">&#10003; Verified</span>';
    if (status === 'pending') return '<span class="badge pending">Pending</span>';
    if (status === 'rejected') return '<span class="badge rejected">Rejected</span>';
    return '';
  }

  fetch('/api/businesses/')
    .then(function(r) { return r.json(); })
    .then(function(d) {
      var list = d.businesses || [];
      var html = '';
      html += '<h1>Verified businesses in Sierra Leone</h1>';
      html += '<p class="sub">Browse dealers, parts stores, and importers. Only verified businesses show a green badge.</p>';
      html += '<div class="counters">';
      html += '  <div class="stat"><div class="n">' + (d.count || list.length || 0) + '</div><div class="l">Total</div></div>';
      html += '  <div class="stat"><div class="n">' + list.filter(function(b){return b.verified}).length + '</div><div class="l">Verified</div></div>';
      html += '</div>';

      if (list.length === 0) {
        html += '<div class="empty">No businesses yet.</div>';
      } else {
        html += '<div class="grid">';
        list.forEach(function(b) {
          var logo = b.logo_url || '/static/logo.png';
          var loc = [b.city, b.country].filter(Boolean).join(', ');
          html += '<a class="card" href="/store/' + esc(b.slug) + '">';
          html += '  <img class="logo" src="' + esc(logo) + '" alt="' + esc(b.name) + '">';
          html += '  <div class="body">';
          html += '    <h3>' + esc(b.name) + badge(b.status) + '</h3>';
          if (b.type_label) html += '    <div class="meta">' + esc(b.type_label) + '</div>';
          if (loc) html += '    <div class="meta">' + esc(loc) + '</div>';
          if (b.description) html += '    <div class="desc">' + esc(b.description) + '</div>';
          html += '  </div>';
          html += '</a>';
        });
        html += '</div>';
      }

      wrap.innerHTML = html;
    })
    .catch(function(e) {
      wrap.innerHTML = '<div class="empty">Could not load businesses.</div>';
    });
})();
</script>
</body>
</html>
