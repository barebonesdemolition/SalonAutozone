<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Verified businesses · SalonAutoZone</title>
<meta name="description" content="Verified parts stores, car dealerships, shippers and wholesalers selling in Sierra Leone.">
<meta name="theme-color" content="#0e2a2b">
<link rel="icon" type="image/png" sizes="64x64" href="/static/icon-64.png">
<link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
<link rel="manifest" href="/static/manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&display=swap" data-saz-font media="print" onload="this.media='all'">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&display=swap"></noscript>
<link rel="stylesheet" href="/static/ui.css?v=7">
<link rel="stylesheet" href="/static/chrome.css?v=5">
<style>
.lead { padding: 26px 0 4px; }
.lead h1 { font-size: clamp(28px, 6vw, 40px); }
.lead p { color: var(--muted); margin-top: 6px; font-size: 16px; }
.bar { display: grid; gap: 10px; margin: 18px 0 14px; }
.chips .chip[aria-pressed="true"] { background: var(--ink); color: #fff; border-color: var(--ink); }
.biz-grid { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); padding-bottom: 20px; }
.biz { display: flex; gap: 14px; background: var(--card); border: 1px solid var(--line); border-radius: var(--r-md); padding: 14px; text-decoration: none; color: inherit; }
.biz:hover { border-color: var(--teal); }
.logo { width: 56px; height: 56px; border-radius: 14px; flex-shrink: 0; background: var(--ink) center / cover no-repeat; color: var(--gold); font-weight: 800; font-size: 24px; display: flex; align-items: center; justify-content: center; font-variation-settings: "wdth" 80; }
.biz h2 { font-size: 18px; margin: 0; }
.biz .ok { color: var(--ok); font-size: 13px; font-weight: 800; }
.biz .meta { font-size: 14px; color: var(--muted); }
.biz p { font-size: 14px; margin-top: 4px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.cta { display: flex; gap: 16px; align-items: center; justify-content: space-between; flex-wrap: wrap; background: var(--ink); color: #fff; border-radius: var(--r-lg); padding: 20px; margin: 10px 0 48px; }
.cta h2 { color: #fff; font-size: 22px; }
.cta p { color: #a9c4c2; margin-top: 4px; }
</style>
</head>
<body>
<div id="site-header"></div>
<main class="wrap">
 <div class="lead"><h1>Verified businesses</h1><p>Parts stores, dealers and importers we have checked.</p></div>
 <div class="bar">
  <input class="input" id="q" type="search" placeholder="Search by name or town" aria-label="Search businesses">
  <div class="chips" id="types">
   <button class="chip" type="button" data-t="" aria-pressed="true">All</button>
   <button class="chip" type="button" data-t="store" aria-pressed="false">Parts stores</button>
   <button class="chip" type="button" data-t="dealership" aria-pressed="false">Car dealers</button>
   <button class="chip" type="button" data-t="shipper" aria-pressed="false">Shippers</button>
   <button class="chip" type="button" data-t="wholesaler" aria-pressed="false">Wholesalers</button>
  </div>
 </div>
 <div class="biz-grid" id="list"><div class="lcard skeleton" style="min-height:90px"></div><div class="lcard skeleton" style="min-height:90px"></div></div>
 <div class="cta"><div><h2>Run a parts store or dealership?</h2><p>Get a Verified badge and your own page.</p></div><a class="btn btn-gold" href="/become-a-seller">Apply as a business</a></div>
</main>
<script src="/static/site.js?v=7"></script>
<script>
(function () {
 'use strict';
 var list = document.getElementById('list'), q = document.getElementById('q'), all = [], type = '';
 function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
 function safeUrl(u) { u = String(u || '').trim(); return (/^https?:\/\//i.test(u) || /^\/(?!\/)/.test(u)) ? u : ''; }
 function paint() {
  var term = q.value.trim().toLowerCase();
  var rows = all.filter(function (b) {
   return (!type || b.business_type === type) && (!term || [b.name, b.city, b.country, b.description].join(' ').toLowerCase().indexOf(term) !== -1);
  });
  list.innerHTML = rows.length ? rows.map(function (b) {
   var u = safeUrl(b.logo_url);
   return '<a class="biz" href="/store/' + encodeURIComponent(b.slug) + '"><div class="logo"' + (u ? ' style="background-image:url(\'' + esc(window.SAZImg ? SAZImg(u, 120) : u) + '\')"' : '') + '>' + (u ? '' : esc((b.name || '?').charAt(0).toUpperCase())) + '</div>' +
    '<div><h2>' + esc(b.name) + '</h2><div class="meta"><span class="ok">✓ Verified</span> · ' + esc([b.type_label, b.city].filter(Boolean).join(', ')) + '</div>' + (b.description ? '<p>' + esc(b.description) + '</p>' : '') + '</div></a>';
  }).join('') : '<p class="hint" style="grid-column:1/-1">' + (all.length ? 'No businesses match that.' : 'No verified businesses yet.') + '</p>';
 }
 fetch('/api/businesses/').then(function (r) { if (!r.ok) throw 0; return r.json(); }).then(function (d) { all = d.businesses || []; paint(); })
  .catch(function () { list.innerHTML = '<div class="notice notice-bad" style="grid-column:1/-1">We couldn\'t load businesses. Please refresh.</div>'; });
 q.addEventListener('input', paint);
 document.getElementById('types').addEventListener('click', function (e) {
  var c = e.target.closest('.chip'); if (!c) return;
  type = c.dataset.t;
  this.querySelectorAll('.chip').forEach(function (x) { x.setAttribute('aria-pressed', String(x === c)); });
  paint();
 });
})();
</script>
</body>
</html>
