<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sell as a business · SalonAutoZone</title>
<meta name="description" content="Parts stores, dealerships, shippers and wholesalers: get a Verified badge and your own page on SalonAutoZone.">
<meta name="theme-color" content="#0e2a2b">
<link rel="icon" type="image/png" sizes="64x64" href="/static/icon-64.png">
<link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
<link rel="manifest" href="/static/manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&display=swap" data-saz-font media="print" onload="this.media='all'">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&display=swap"></noscript>
<link rel="stylesheet" href="/static/ui.css?v=7">
<link rel="stylesheet" href="/static/chrome.css?v=5">
<style>
.page { max-width: 760px; padding: 26px 16px 56px; }
.page h1 { font-size: clamp(28px, 6vw, 40px); }
.page .lead { color: var(--muted); font-size: 17px; margin: 6px 0 20px; }
.stack { display: grid; gap: 14px; }
.perks { display: grid; gap: 10px; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); margin-bottom: 20px; }
.perks div { background: var(--card); border: 1px solid var(--line); border-radius: var(--r-md); padding: 14px; }
.perks b { display: block; color: var(--ink); }
.perks span { font-size: 14px; color: var(--muted); }
.types { display: grid; gap: 10px; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); }
.type { text-align: left; background: var(--card); border: 1.5px solid var(--line); border-radius: var(--r-md); padding: 12px 14px; cursor: pointer; font: inherit; color: inherit; }
.type b { display: block; color: var(--ink); }
.type small { color: var(--muted); font-size: 13px; }
.type[aria-pressed="true"] { border-color: var(--teal); background: var(--teal-50); box-shadow: 0 0 0 3px var(--teal-50); }
.row2 { display: grid; gap: 0 12px; grid-template-columns: 1fr 1fr; }
@media (max-width: 520px) { .row2 { grid-template-columns: 1fr; } }
.logo-pick { display: flex; gap: 14px; align-items: center; }
.logo { width: 72px; height: 72px; border-radius: 16px; flex-shrink: 0; background: var(--ink) center / cover no-repeat; color: var(--gold); font-weight: 800; font-size: 30px; display: flex; align-items: center; justify-content: center; font-variation-settings: "wdth" 80; }
.head { display: flex; gap: 14px; align-items: center; }
.head h2 { font-size: 24px; margin: 0; }
.st { display: inline-flex; font-size: 13px; font-weight: 800; padding: 3px 9px; border-radius: 6px; margin-top: 4px; }
.st.ok { background: var(--ok-50); color: var(--ok); }
.st.wait { background: var(--gold-50); color: #8a5a00; }
.st.bad { background: var(--bad-50); color: var(--bad); }
.acts { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 14px; }
details.box summary { cursor: pointer; font-weight: 700; color: var(--ink); }
.tools { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); }
.tool { display: flex; flex-direction: column; gap: 4px; padding: 16px; border-radius: var(--r-lg); background: var(--ink); color: #fff; text-decoration: none; }
.tool:nth-child(2) { background: var(--card); color: var(--ink); border: 1.5px solid var(--line); }
.tool .ic { color: var(--gold); display: flex; }
.tool:nth-child(2) .ic { color: var(--teal); }
.tool b { font-size: 18px; color: inherit; }
.tool small { color: #a9c4c2; font-size: 14px; }
.tool:nth-child(2) small { color: var(--muted); }
</style>
</head>
<body>
<div id="site-header"></div>
<main class="wrap page" id="app"><div class="lcard skeleton" style="min-height:240px"></div></main>
<script src="/static/site.js?v=7"></script>
<script>
(function () {
 'use strict';
 var app = document.getElementById('app');
 var TYPES = [
  ['store', 'Local parts store', 'You stock parts in Sierra Leone'],
  ['dealership', 'Car dealership', 'You sell new or used cars'],
  ['shipper', 'Shipper / importer', 'You bring cars in from abroad'],
  ['wholesaler', 'Wholesaler (abroad)', 'You supply parts from outside Sierra Leone']
 ];
 var token = '', contact = {};
 try { token = localStorage.getItem('token') || localStorage.getItem('access_token') || ''; } catch (e) {}

 function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
 function safeUrl(u) { u = String(u || '').trim(); return (/^https:\/\//i.test(u) || /^\/(?!\/)/.test(u)) ? u : ''; }
 function toLogin() { try { localStorage.removeItem('token'); localStorage.removeItem('access_token'); } catch (e) {} location.href = '/login?next=' + encodeURIComponent(location.pathname); }
 function api(url, opts) {
  opts = opts || {};
  opts.headers = Object.assign(opts.body instanceof FormData ? {} : { 'Content-Type': 'application/json' }, token ? { 'Authorization': 'Bearer ' + token } : {}, opts.headers || {});
  return fetch(url, opts).then(function (r) {
   return r.json().catch(function () { return {}; }).then(function (d) {
    if (r.status === 401) { toLogin(); throw new Error('Please log in again.'); }
    if (!r.ok) { var m = d.detail; if (Array.isArray(m)) m = m.map(function (x) { return String(x.msg || '').replace(/^Value error, /, ''); }).join('. '); throw new Error(typeof m === 'string' ? m : 'Something went wrong. Please try again.'); }
    return d;
   });
  });
 }
 function logo(b) { var u = safeUrl(b.logo_url); return '<div class="logo"' + (u ? ' style="background-image:url(\'' + esc(window.SAZImg ? SAZImg(u, 160) : u) + '\')"' : '') + '>' + (u ? '' : esc((b.name || '?').charAt(0).toUpperCase())) + '</div>'; }
 var STATUS = { verified: ['ok', '✓ Verified'], pending: ['wait', 'Being checked'], rejected: ['bad', 'Not approved'], suspended: ['bad', 'Suspended'] };

 var perks = '<div class="perks"><div><b>Verified badge</b><span>Shown on your listings so buyers trust you.</span></div>' +
  '<div><b>Your own page</b><span>One link with everything you sell, to share on WhatsApp.</span></div>' +
  '<div><b>More listings</b><span>Plans for stores and dealers with lots of stock.</span></div></div>';

 fetch('/api/site/contact').then(function (r) { return r.ok ? r.json() : {}; }).catch(function () { return {}; }).then(function (c) {
  contact = c || {};
  if (!token) {
   app.innerHTML = '<h1>Sell as a business</h1><p class="lead">For parts stores, car dealerships, shippers and wholesalers.</p>' + perks +
    '<div class="box"><h2>Log in to apply</h2><p>Use your SalonAutoZone account, or create one first. It\'s free.</p><div class="acts"><a class="btn btn-primary" href="/login?next=/become-a-seller">Log in</a><a class="btn btn-ghost" href="/login?mode=register&next=/become-a-seller">Create account</a></div></div>';
   return;
  }
  load();
 });

 function load() {
  api('/api/businesses/mine').then(function (d) { if (d.business) showMine(d.business); else showForm(null); })
   .catch(function (e) { app.innerHTML = '<div class="notice notice-bad">' + esc(e.message) + '</div>'; });
 }

 function showMine(b) {
  var st = STATUS[b.status] || ['wait', b.status];
  var wa = contact.whatsapp ? 'https://wa.me/' + encodeURIComponent(contact.whatsapp) + '?text=' + encodeURIComponent('Hello, this is ' + b.name + ' on SalonAutoZone.') : '';
  var h = '<h1>Your business</h1><p class="lead">' + esc(b.type_label) + ', ' + esc(b.city) + '</p><div class="stack">' +
   '<div class="box"><div class="head">' + logo(b) + '<div><h2>' + esc(b.name) + '</h2><span class="st ' + st[0] + '">' + esc(st[1]) + '</span></div></div>';
  if (b.status === 'pending') h += '<p style="margin-top:12px">We\'re checking your details and will message you on WhatsApp at +' + esc(b.whatsapp) + '. This usually takes a day or two.</p>';
  if (b.status === 'verified') h += '<p style="margin-top:12px">Your Verified badge is on. Everything you list shows on your business page.</p>';
  if (b.status === 'rejected' || b.status === 'suspended') h += '<p style="margin-top:12px">Message us on WhatsApp to find out why and what to change.</p>';
  h += '<div class="acts">' +
   (b.status === 'verified' ? '<a class="btn btn-primary" href="/store/' + encodeURIComponent(b.slug) + '">See your page</a>' : '') +
   '<a class="btn btn-ghost" href="/sell">List one item</a><a class="btn btn-ghost" href="/my-subscription">Your plan</a>' +
   (wa ? '<a class="btn btn-wa" href="' + esc(wa) + '" target="_blank" rel="noopener noreferrer">Message us</a>' : '') + '</div></div>' +
   '<div class="tools"><a class="tool" href="/business/stock"><span class="ic"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="4"/></svg></span><b>Add stock with your camera</b><small>Photograph a shelf. We fill in each part for you.</small></a>' +
   '<a class="tool" href="/business/page"><span class="ic"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><circle cx="8" cy="10" r="1.3"/><circle cx="12" cy="7.5" r="1.3"/><circle cx="16" cy="10" r="1.3"/><path d="M12 21a2.5 2.5 0 0 1 0-5h2a3 3 0 0 0 3-3"/></svg></span><b>Personalise your page</b><small>Cover photo, colour, opening hours, address.</small></a></div>' +
   '<details class="box" id="edit"><summary>Edit business details</summary><div id="editform"></div></details></div>';
  app.innerHTML = h;
  document.getElementById('edit').addEventListener('toggle', function (e) {
   if (e.target.open && !document.getElementById('f')) form(document.getElementById('editform'), b);
  }, { once: false });
 }

 function showForm() {
  app.innerHTML = '<h1>Sell as a business</h1><p class="lead">Fill this in and we\'ll check your details, then switch on your Verified badge.</p>' + perks + '<div class="box" id="formbox"></div>';
  form(document.getElementById('formbox'), null);
 }

 function form(el, b) {
  var editing = !!b, chosen = b ? b.business_type : '', logoUrl = b ? (b.logo_url || '') : '';
  el.innerHTML = '<form id="f" novalidate>' +
   (editing ? '<p class="hint">Changing the name or WhatsApp number means we check your business again.</p>' :
    '<span class="lbl">What kind of business are you?</span><div class="types" id="types">' + TYPES.map(function (t) {
     return '<button type="button" class="type" data-t="' + t[0] + '" aria-pressed="false"><b>' + t[1] + '</b><small>' + t[2] + '</small></button>';
    }).join('') + '</div>') +
   '<label class="field"><span>Business name</span><input class="input" name="name" required minlength="2" maxlength="80" placeholder="e.g. Freetown Auto Parts"></label>' +
   '<div class="row2"><label class="field"><span>City</span><input class="input" name="city" required maxlength="80" placeholder="Freetown"></label>' +
   '<label class="field"><span>Country</span><input class="input" name="country" required maxlength="80" value="Sierra Leone"></label></div>' +
   '<label class="field"><span>WhatsApp number</span><input class="input" name="whatsapp" type="tel" required placeholder="076 123456"></label>' +
   '<label class="field"><span>Email (optional)</span><input class="input" name="email" type="email" maxlength="120"></label>' +
   '<label class="field"><span>About your business</span><textarea class="input" name="description" rows="4" maxlength="1000" placeholder="What you sell, how long you have traded, where to find you"></textarea></label>' +
   '<div class="field"><span class="lbl">Logo (optional)</span><div class="logo-pick"><div id="lp"></div><label class="btn btn-ghost">Choose picture<input type="file" accept="image/*" id="logofile" hidden></label></div></div>' +
   '<button class="btn btn-primary btn-block" style="margin-top:18px" type="submit">' + (editing ? 'Save changes' : 'Send application') + '</button>' +
   '<div id="msg" aria-live="polite" style="margin-top:10px"></div></form>';
  var f = document.getElementById('f'), msg = document.getElementById('msg');
  if (b) ['name', 'city', 'country', 'whatsapp', 'email', 'description'].forEach(function (k) { if (b[k] != null) f.elements[k].value = k === 'whatsapp' ? '+' + b[k] : b[k]; });
  function paintLogo() { document.getElementById('lp').innerHTML = logo({ name: f.elements.name.value || '?', logo_url: logoUrl }); }
  paintLogo();
  f.elements.name.addEventListener('input', function () { if (!logoUrl) paintLogo(); });
  var types = document.getElementById('types');
  if (types) types.addEventListener('click', function (e) {
   var t = e.target.closest('.type'); if (!t) return;
   chosen = t.dataset.t;
   types.querySelectorAll('.type').forEach(function (x) { x.setAttribute('aria-pressed', String(x === t)); });
  });
  document.getElementById('logofile').addEventListener('change', function (e) {
   var file = e.target.files[0]; if (!file) return;
   var fd = new FormData(); fd.append('file', file);
   msg.innerHTML = '<p class="hint">Uploading logo…</p>';
   api('/api/upload/', { method: 'POST', body: fd }).then(function (d) { logoUrl = d.url || ''; paintLogo(); msg.innerHTML = ''; })
    .catch(function (err) { msg.innerHTML = '<div class="notice notice-bad">' + esc(err.message) + '</div>'; });
  });
  f.addEventListener('submit', function (e) {
   e.preventDefault();
   if (!chosen) { msg.innerHTML = '<div class="notice notice-bad">Choose what kind of business you are.</div>'; return; }
   if (!f.reportValidity()) return;
   var p = { business_type: chosen, logo_url: logoUrl || null };
   ['name', 'city', 'country', 'whatsapp', 'email', 'description'].forEach(function (k) { var v = f.elements[k].value.trim(); p[k] = v || null; });
   var btn = f.querySelector('button[type=submit]'); btn.disabled = true;
   msg.innerHTML = '<p class="hint">Sending…</p>';
   api('/api/businesses/' + (editing ? 'mine' : 'apply'), { method: editing ? 'PUT' : 'POST', body: JSON.stringify(p) })
    .then(function () { window.scrollTo(0, 0); load(); })
    .catch(function (err) { msg.innerHTML = '<div class="notice notice-bad">' + esc(err.message) + '</div>'; btn.disabled = false; });
  });
 }
})();
</script>
</body>
</html>
