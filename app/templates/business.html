<!DOCTYPE html>
<html lang="en">
<head>
<link rel="icon" type="image/png" href="/static/logo.png">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Business · SalonAutoZone</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--t:#0f766e;--t2:#0b5f58;--n:#0a1729;--s50:#f8fafc;--s100:#f1f5f9;--s200:#e2e8f0;--s500:#64748b;--s600:#475569;--r:#dc2626;--g:#16a34a;--am:#b45309}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Inter,-apple-system,"Segoe UI",sans-serif;font-size:15px;line-height:1.5;color:#1e293b;background:var(--s50)}
a{color:inherit;text-decoration:none}button,input,select,textarea{font:inherit}
:focus-visible{outline:3px solid #5eead4;outline-offset:2px}
header{background:#fff;border-bottom:1px solid var(--s200);padding:14px 20px;display:flex;justify-content:space-between;align-items:center}
.logo{font-weight:800;font-size:18px;color:var(--n)}.logo span{color:var(--t)}
header a.back{font-size:14px;font-weight:600;color:var(--t)}
main{max-width:680px;margin:24px auto;padding:0 16px 48px}
.card{background:#fff;border:1px solid var(--s200);border-radius:16px;padding:24px;box-shadow:0 1px 3px rgba(15,23,42,.06)}
h1{font-size:24px;font-weight:800;color:var(--n);letter-spacing:-.02em;margin-bottom:6px}
.sub{color:var(--s500);margin-bottom:18px}
label{display:block;font-size:13px;font-weight:600;color:var(--s600);margin-top:14px}
input,select,textarea{display:block;width:100%;margin-top:6px;padding:12px;border:1.5px solid var(--s200);border-radius:10px;font-size:16px;background:#fff}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--t);box-shadow:0 0 0 4px rgba(15,118,110,.15)}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.types{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:6px}
.type{border:1.5px solid var(--s200);border-radius:12px;padding:12px;cursor:pointer;background:#fff;text-align:left}
.type b{display:block;font-size:14px;color:var(--n)}.type small{color:var(--s500);font-size:12px}
.type[aria-pressed=true]{border-color:var(--t);background:#f0fdfa}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--t);color:#fff;font-weight:700;padding:13px 20px;border-radius:10px;min-height:48px;border:0;cursor:pointer}
.btn:hover{background:var(--t2)}.btn:disabled{opacity:.6;cursor:wait}.btn.full{width:100%;margin-top:20px}
.btn.wa{background:#16a34a}
a.btn.public-link{display:inline-flex;justify-content:center;align-items:center;border-radius:8px;font-weight:600;text-decoration:none;background-color:rgb(15,118,110);color:rgb(255,255,255)}
.pill{display:inline-block;padding:4px 12px;border-radius:99px;font-size:12px;font-weight:700}
.pill.ok{background:#dcfce7;color:#166534}.pill.wait{background:#fef3c7;color:var(--am)}.pill.bad{background:#fee2e2;color:var(--r)}.pill.t{background:#ccfbf1;color:var(--t2)}
.msg{margin-top:14px;font-weight:600;text-align:center}
.hero{display:flex;gap:16px;align-items:center;margin-bottom:16px}
.logo-box{width:72px;height:72px;border-radius:16px;background:var(--t);color:#fff;font-weight:800;font-size:28px;display:flex;align-items:center;justify-content:center;overflow:hidden;flex-shrink:0}
.logo-box img{width:100%;height:100%;object-fit:cover}
.meta{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
.note{background:#f0fdfa;border:1px solid #99f6e4;color:var(--t2);padding:12px 14px;border-radius:10px;font-size:14px;margin-top:16px}
@media (max-width:560px){.row,.types{grid-template-columns:1fr}}
/* salon-logo-css */
.brand img.logo-img { height: 52px; width: 52px; border-radius: 50%; display: block; }
.brand em { font-style: normal; }
.brand em span { color: #0f766e; }
@media (max-width: 640px) {
  .brand img.logo-img { height: 42px; width: 42px; }
  .brand { font-size: 17px; }
}
</style>
</head>
<body>
<header><a class="logo" href="/"><img class="logo-img" src="/static/logo.png" alt="SalonAutoZone"><em>Salon<span>AutoZone</span></em></a><div><a class="back" href="/vin-tool">VIN Lookup</a> <a class="back" href="/">Back to marketplace</a></div></header>
<main><div class="card" id="root"><p>Loading...</p></div></main>

<script>
(function () {
 'use strict';
 var root = document.getElementById('root');
 var TYPES = [
 ['store', 'Local parts store', 'You stock parts in Sierra Leone'],
 ['dealership', 'Car dealership', 'You sell new or used cars'],
 ['shipper', 'Shipper / importer', 'You bring cars in from abroad'],
 ['wholesaler', 'Wholesaler (abroad)', 'You supply parts from outside Sierra Leone']
 ];
 var token = '';
 try { token = localStorage.getItem('token') || localStorage.getItem('access_token') || ''; } catch (e) {}

 function esc(s) { return s == null ? '' : String(s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
 function safeUrl(u) { u = String(u || '').trim(); return (u.indexOf('https://') === 0 || (u.charAt(0) === '/' && u.charAt(1) !== '/')) ? u : ''; }
 function api(url, opts) {
 opts = opts || {};
 opts.headers = Object.assign({ 'Content-Type': 'application/json' }, token ? { 'Authorization': 'Bearer ' + token } : {}, opts.headers || {});
 return fetch(url, opts).then(function (r) {
 return r.json().catch(function () { return {}; }).then(function (d) {
 if (!r.ok) {
 var detail = d.detail;
 if (Array.isArray(detail)) detail = detail.map(function (x) { return x.msg; }).join('. ');
 var error = new Error(typeof detail === 'string' ? detail : 'Something went wrong');
 error.status = r.status;
 throw error;
 }
 return d;
 });
 });
 }
 function returnToLogin() {
 try {
 localStorage.removeItem('token');
 localStorage.removeItem('access_token');
 } catch (e) {}
 window.location.href = '/login?next=' + encodeURIComponent(window.location.pathname);
 }
 function pill(st) {
 var map = { verified: ['ok', 'Verified'], pending: ['wait', 'Waiting for approval'], rejected: ['bad', 'Not approved'], suspended: ['bad', 'Suspended'] };
 var p = map[st] || ['wait', st];
 return '<span class="pill ' + p[0] + '">' + p[1] + '</span>';
 }
 function logoBox(b) {
 var u = safeUrl(b.logo_url);
 return '<div class="logo-box">' + (u ? '<img src="' + esc(u) + '" alt="">' : esc((b.name || '?').charAt(0).toUpperCase())) + '</div>';
 }

 // ---------- storefront ----------
 function showStore(slug) {
 api('/api/businesses/' + encodeURIComponent(slug)).then(function (b) {
 document.title = b.name + ' · SalonAutoZone';
 var contact = b.whatsapp
 ? '<a class="btn wa full" href="https://wa.me/' + encodeURIComponent(b.whatsapp) + '?text=' + encodeURIComponent('Hello ' + b.name + ', I found you on SalonAutoZone.') + '" target="_blank" rel="noopener noreferrer">Message on WhatsApp</a>'
 : '<div class="note">This business has not added a WhatsApp contact yet.</div>';
 root.innerHTML = '<div class="hero">' + logoBox(b) + '<div><h1>' + esc(b.name) + '</h1><div class="meta"><span class="pill ok">Verified</span><span class="pill t">' + esc(b.type_label) + '</span><span class="pill t">' + esc(b.city) + ', ' + esc(b.country) + '</span></div></div></div>' +
 (b.description ? '<p>' + esc(b.description) + '</p>' : '') +
 contact +
 '<div class="note">Listings from this business will appear here soon. Never pay a deposit before you have checked the seller and seen the item.</div>';
 }).catch(function () {
 root.innerHTML = '<h1>Business not found</h1><p class="sub">This page does not exist or has not been approved yet.</p><a class="btn" href="/">Back to marketplace</a>';
 });
 }

 // ---------- apply ----------
 function showApply() {
 if (!token) { window.location.href = '/login?next=/become-a-seller'; return; }
 api('/api/businesses/mine').then(function (d) {
 if (d.business) { showStatus(d.business); } else { showForm(); }
 }).catch(function (e) {
 if (e.status === 401) { returnToLogin(); return; }
 root.innerHTML = '<p class="msg" style="color:var(--r)">' + esc(e.message) + '</p>';
 });
 }
 function showStatus(b) {
 root.innerHTML = '<div class="hero">' + logoBox(b) + '<div><h1>' + esc(b.name) + '</h1><div class="meta">' + pill(b.status) + '<span class="pill t">' + esc(b.type_label) + '</span></div></div></div>' +
 (b.status === 'pending' ? '<div class="note">We received your application. We will check your details and contact you on WhatsApp (+' + esc(b.whatsapp) + ').</div>' : '') +
 (b.status === 'verified' ? '<a class="btn full public-link" href="/store/' + encodeURIComponent(b.slug) + '">View your public page</a>' : '') +
 ((b.status === 'rejected' || b.status === 'suspended') ? '<div class="note">Please contact us on WhatsApp to find out why and what to fix.</div>' : '');
 }
 function showForm() {
 var chosen = '';
 root.innerHTML = '<h1>Sell on SalonAutoZone as a business</h1><p class="sub">Stores, dealerships, shippers and wholesalers get a public page with a Verified badge once we have checked the details.</p>' +
 '<form id="f"><label>What kind of business are you?</label><div class="types" id="types">' +
 TYPES.map(function (t) { return '<button type="button" class="type" data-t="' + t[0] + '" aria-pressed="false"><b>' + t[1] + '</b><small>' + t[2] + '</small></button>'; }).join('') + '</div>' +
 '<label>Business name<input name="name" required minlength="2" maxlength="80" placeholder="e.g. Freetown Auto Parts"></label>' +
 '<div class="row"><label>Country<input name="country" required value="Sierra Leone"></label><label>City<input name="city" required placeholder="Freetown"></label></div>' +
 '<label>WhatsApp number<input name="whatsapp" type="tel" required placeholder="+232 76 123456"></label>' +
 '<label>Email (optional)<input name="email" type="email"></label>' +
 '<label>About your business<textarea name="description" rows="4" maxlength="1000" placeholder="What you sell, how long you have traded, where to find you"></textarea></label>' +
 '<button class="btn full" type="submit">Send application</button><div class="msg" id="msg" aria-live="polite"></div></form>';
 document.getElementById('types').addEventListener('click', function (e) {
 var b = e.target.closest('.type'); if (!b) return;
 chosen = b.dataset.t;
 document.querySelectorAll('.type').forEach(function (x) { x.setAttribute('aria-pressed', x === b); });
 });
 document.getElementById('f').addEventListener('submit', function (e) {
 e.preventDefault();
 var msg = document.getElementById('msg'), btn = e.target.querySelector('.btn');
 if (!chosen) { msg.style.color = 'var(--r)'; msg.textContent = 'Choose what kind of business you are.'; return; }
 var p = { business_type: chosen };
 new FormData(e.target).forEach(function (v, k) { if (v !== '') p[k] = v; });
 btn.disabled = true; msg.style.color = 'var(--t)'; msg.textContent = 'Sending...';
 api('/api/businesses/apply', { method: 'POST', body: JSON.stringify(p) })
 .then(function () { showApply(); })
 .catch(function (err) {
 if (err.status === 401) { returnToLogin(); return; }
 msg.style.color = 'var(--r)'; msg.textContent = err.message; btn.disabled = false;
 });
 });
 }

 var path = window.location.pathname;
 if (path.indexOf('/store/') === 0) showStore(decodeURIComponent(path.slice('/store/'.length)));
 else showApply();
})();
</script>
</body>
</html>
