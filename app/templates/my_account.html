<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>My Account – {{ app_name or 'SalonAutoZone' }}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --primary:#0f766e;--primary-hover:#0d9488;--primary-light:#ccfbf1;
  --navy:#0f172a;--slate:#1e293b;--text:#1e293b;--muted:#64748b;
  --border:#e2e8f0;--bg:#f8fafc;--surface:#fff;--success:#15803d;--danger:#b91c1c;
  --sh:0 1px 2px rgba(15,23,42,.04),0 4px 12px rgba(15,23,42,.06);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:Inter,-apple-system,sans-serif;font-size:15px;color:var(--text);background:var(--bg);-webkit-font-smoothing:antialiased;line-height:1.5}
a{color:inherit;text-decoration:none}
button,input,select,textarea{font:inherit}
button{cursor:pointer;border:0;background:none}
:focus-visible{outline:3px solid var(--primary-hover);outline-offset:2px}

.top{background:var(--navy);color:#94a3b8;padding:10px 24px;font-size:12px;display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px}
.top strong{color:#fff}.top a{color:#99f6e4;font-weight:700}
.brand{background:#fff;padding:14px 24px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;border-bottom:1px solid var(--border);position:sticky;top:0;z-index:50;box-shadow:var(--sh)}
.logo{font-size:18px;font-weight:800;color:var(--navy)}.logo span{color:var(--primary)}
.nav{display:flex;gap:14px;flex-wrap:wrap;align-items:center}
.nav a{font-size:14px;font-weight:600;color:#475569}.nav a:hover{color:var(--primary)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 18px;border-radius:8px;font-weight:700;font-size:14px;min-height:44px}
.btn-primary{background:var(--primary);color:#fff}.btn-primary:hover{background:var(--primary-hover)}
.btn-ghost{background:#f1f5f9;color:var(--text)}.btn-ghost:hover{background:#e2e8f0}
.btn-danger{background:#fef2f2;color:var(--danger)}

.wrap{max-width:1100px;margin:0 auto;padding:24px 20px 64px}
.hero{display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:16px;margin-bottom:24px}
.hero h1{font-size:26px;font-weight:800;color:var(--navy);letter-spacing:-.02em}
.hero p{color:var(--muted);margin-top:4px}

.tabs{display:flex;gap:6px;background:#f1f5f9;padding:4px;border-radius:10px;margin-bottom:20px;flex-wrap:wrap}
.tabs button{padding:10px 16px;border-radius:8px;font-weight:600;font-size:13px;color:var(--muted);min-height:42px}
.tabs button.active{background:var(--primary);color:#fff}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px}
.card{background:#fff;border:1px solid var(--border);border-radius:14px;padding:18px;box-shadow:var(--sh)}
.card h3{font-size:15px;font-weight:700;color:var(--navy);margin-bottom:6px}
.card .meta{font-size:13px;color:var(--muted)}
.card .price{font-size:18px;font-weight:800;color:var(--primary);margin:8px 0}
.card .acts{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.card .acts a,.card .acts button{flex:1;text-align:center;padding:9px;border-radius:8px;font-weight:700;font-size:12px;background:#f1f5f9;min-height:40px}

.panel{background:#fff;border:1px solid var(--border);border-radius:14px;padding:20px;box-shadow:var(--sh);margin-bottom:16px}
.panel h2{font-size:16px;font-weight:800;margin-bottom:14px;color:var(--navy)}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.lbl{display:block;font-size:13px;font-weight:600;color:#475569;margin-bottom:6px}
.inp{width:100%;padding:11px 12px;border:1.5px solid var(--border);border-radius:8px;min-height:44px}
.inp:focus{outline:0;border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-light)}
.empty{text-align:center;padding:40px 16px;color:var(--muted)}
.empty a{color:var(--primary);font-weight:700}
.badge{display:inline-block;padding:3px 10px;border-radius:99px;font-size:11px;font-weight:700;background:var(--primary-light);color:var(--primary)}
.badge.off{background:#f1f5f9;color:var(--muted)}
.toast{position:fixed;bottom:24px;left:50%;transform:translate(-50%,120px);background:var(--navy);color:#fff;padding:12px 20px;border-radius:10px;font-weight:600;z-index:99;transition:transform .25s;max-width:90vw}
.toast.show{transform:translate(-50%,0)}.toast.ok{background:var(--success)}.toast.err{background:var(--danger)}
.sk{height:120px;border-radius:12px;background:linear-gradient(90deg,#f1f5f9,#e2e8f0,#f1f5f9);background-size:200% 100%;animation:sk 1.2s infinite}
@keyframes sk{to{background-position:-200% 0}}
@media(max-width:700px){.row{grid-template-columns:1fr}.hero h1{font-size:22px}}

.bnav{display:none;position:fixed;bottom:0;left:0;right:0;z-index:200;background:#fff;border-top:1px solid var(--border);padding:6px 8px env(safe-area-inset-bottom,8px);box-shadow:0 -4px 16px rgba(15,23,42,.06)}
.bnav nav{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;max-width:500px;margin:0 auto}
.bnav a{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 4px;border-radius:10px;font-size:11px;font-weight:700;color:var(--muted);min-height:52px;justify-content:center}
.bnav a svg{width:22px;height:22px}
.bnav a.active,.bnav a:hover{color:var(--primary);background:var(--primary-light)}
@media(max-width:768px){
  .bnav{display:block}
  body{padding-bottom:calc(72px + env(safe-area-inset-bottom,0px))}
}

</style>
</head>
<body>
<div class="top">
  <strong>Salon AutoZone · Freetown</strong>
  <a href="tel:+23276123456">+232 76 123456</a>
</div>
<header class="brand">
  <a class="logo" href="/">Salon<span>AutoZone</span></a>
  <nav class="nav">
    <a href="/">Home</a>
    <a href="/vin-tool">VIN Lookup</a>
    <a href="/garage">My Garage</a>
    <a href="/">Sell</a>
    <button type="button" class="btn btn-ghost" id="btn-logout">Log out</button>
  </nav>
</header>

<main class="wrap">
  <div class="hero">
    <div>
      <h1>My account</h1>
      <p id="user-line">Loading your profile…</p>
    </div>
    <a class="btn btn-primary" href="/?action=list-car">+ List something</a>
  </div>

  <div class="tabs" role="tablist">
    <button type="button" class="active" data-tab="saved">Saved</button>
    <button type="button" data-tab="garage">Garage</button>
    <button type="button" data-tab="profile">Profile</button>
  </div>

  <section id="tab-saved">
    <div class="grid" id="saved-grid"><div class="sk"></div><div class="sk"></div></div>
  </section>

  <section id="tab-garage" hidden>
    <div class="panel">
      <h2>Add a vehicle to your garage</h2>
      <form id="garage-form">
        <div class="row">
          <div><label class="lbl">Make *</label><input class="inp" name="make" required placeholder="Toyota"></div>
          <div><label class="lbl">Model *</label><input class="inp" name="model" required placeholder="Corolla"></div>
        </div>
        <div class="row" style="margin-top:12px">
          <div><label class="lbl">Year *</label><input class="inp" name="year" type="number" min="1980" max="2030" required placeholder="2015"></div>
          <div><label class="lbl">Nickname</label><input class="inp" name="nickname" placeholder="My daily"></div>
        </div>
        <label style="display:flex;gap:8px;align-items:center;margin:14px 0;font-size:14px;font-weight:600">
          <input type="checkbox" name="is_primary"> Set as primary vehicle
        </label>
        <button type="submit" class="btn btn-primary">Save to garage</button>
      </form>
    </div>
    <div class="grid" id="garage-grid"></div>
  </section>

  <section id="tab-profile" hidden>
    <div class="panel">
      <h2>Profile</h2>
      <div id="profile-body"><div class="sk"></div></div>
    </div>
  </section>
</main>

<div class="toast" id="toast"></div>

<script>
(function () {
  function $(id) { return document.getElementById(id); }
  function toast(msg, ok) {
    var t = $('toast');
    t.textContent = msg;
    t.className = 'toast show ' + (ok ? 'ok' : 'err');
    setTimeout(function () { t.classList.remove('show'); }, 2800);
  }
  function token() {
    try { return localStorage.getItem('token') || localStorage.getItem('access_token') || ''; } catch (e) { return ''; }
  }
  function auth() {
    var t = token();
    return t ? { Authorization: 'Bearer ' + t } : {};
  }
  function goLogin() { location.href = '/login?next=' + encodeURIComponent(location.pathname); }

  if (!token()) { goLogin(); return; }

  // Tabs
  document.querySelectorAll('.tabs button').forEach(function (b) {
    b.addEventListener('click', function () {
      document.querySelectorAll('.tabs button').forEach(function (x) { x.classList.remove('active'); });
      b.classList.add('active');
      ['saved', 'garage', 'profile'].forEach(function (name) {
        var el = $('tab-' + name);
        if (el) el.hidden = name !== b.dataset.tab;
      });
      if (b.dataset.tab === 'garage') loadGarage();
      if (b.dataset.tab === 'profile') loadProfile();
    });
  });

  $('btn-logout').addEventListener('click', function () {
    try {
      localStorage.removeItem('token');
      localStorage.removeItem('access_token');
      localStorage.removeItem('userInfo');
    } catch (e) {}
    location.href = '/';
  });

  function fmt(n) {
    try { return Number(n).toLocaleString(); } catch (e) { return n; }
  }

  function loadSaved() {
    var grid = $('saved-grid');
    fetch('/api/my-account/saved', { headers: auth() })
      .then(function (r) {
        if (r.status === 401) { goLogin(); throw null; }
        return r.ok ? r.json() : { items: [] };
      })
      .then(function (d) {
        var items = d.items || d || [];
        if (!items.length) {
          grid.innerHTML = '<div class="empty">No saved listings yet.<br><a href="/">Browse cars &amp; parts</a></div>';
          return;
        }
        grid.innerHTML = items.map(function (i) {
          var href = (i.listing_type === 'vehicle' ? '/vehicle/' : '/part/') + i.listing_id;
          var price = i.listing_price_sll ? 'SLL ' + fmt(i.listing_price_sll) : '';
          return '<div class="card">' +
            '<h3>' + esc(i.listing_title || (i.listing_type + ' #' + i.listing_id)) + '</h3>' +
            '<div class="meta">' + esc(i.listing_type || '') + '</div>' +
            (price ? '<div class="price">' + price + '</div>' : '') +
            '<div class="acts"><a href="' + href + '">View</a>' +
            '<button type="button" data-unsave="' + i.id + '">Remove</button></div></div>';
        }).join('');
        grid.querySelectorAll('[data-unsave]').forEach(function (btn) {
          btn.addEventListener('click', function () {
            fetch('/api/my-account/saved/' + btn.dataset.unsave, { method: 'DELETE', headers: auth() })
              .then(function (r) {
                if (r.ok) { toast('Removed', true); loadSaved(); }
                else toast('Could not remove', false);
              });
          });
        });
      })
      .catch(function (e) { if (e !== null) grid.innerHTML = '<div class="empty">Could not load saved items.</div>'; });
  }

  function loadGarage() {
    var grid = $('garage-grid');
    grid.innerHTML = '<div class="sk"></div>';
    fetch('/api/garage/', { headers: auth() })
      .then(function (r) {
        if (r.status === 401) { goLogin(); throw null; }
        return r.ok ? r.json() : [];
      })
      .then(function (cars) {
        cars = cars || [];
        if (!cars.length) {
          grid.innerHTML = '<div class="empty">No vehicles in your garage yet. Add one above.</div>';
          return;
        }
        grid.innerHTML = cars.map(function (c) {
          return '<div class="card">' +
            '<h3>' + esc(c.year + ' ' + c.make + ' ' + c.model) + '</h3>' +
            '<div class="meta">' + esc(c.nickname || 'No nickname') +
            (c.is_primary ? ' · <span class="badge">Primary</span>' : '') + '</div>' +
            '<div class="acts">' +
            '<a href="/?make=' + encodeURIComponent(c.make) + '&model=' + encodeURIComponent(c.model) + '&year=' + c.year + '">Find parts</a>' +
            '<button type="button" data-del-garage="' + c.id + '">Remove</button></div></div>';
        }).join('');
        grid.querySelectorAll('[data-del-garage]').forEach(function (btn) {
          btn.addEventListener('click', function () {
            if (!confirm('Remove this vehicle from your garage?')) return;
            fetch('/api/garage/' + btn.dataset.delGarage, { method: 'DELETE', headers: auth() })
              .then(function (r) {
                if (r.ok) { toast('Removed', true); loadGarage(); }
                else toast('Could not remove', false);
              });
          });
        });
      })
      .catch(function (e) { if (e !== null) grid.innerHTML = '<div class="empty">Could not load garage.</div>'; });
  }

  $('garage-form').addEventListener('submit', function (e) {
    e.preventDefault();
    var fd = new FormData(e.target);
    var body = {
      make: fd.get('make'),
      model: fd.get('model'),
      year: parseInt(fd.get('year'), 10),
      nickname: fd.get('nickname') || null,
      is_primary: !!fd.get('is_primary')
    };
    fetch('/api/garage/', {
      method: 'POST',
      headers: Object.assign({ 'Content-Type': 'application/json' }, auth()),
      body: JSON.stringify(body)
    }).then(function (r) {
      if (r.status === 401) { goLogin(); return; }
      if (!r.ok) throw new Error('Could not save');
      toast('Vehicle saved', true);
      e.target.reset();
      loadGarage();
    }).catch(function () { toast('Could not save vehicle', false); });
  });

  function loadProfile() {
    var box = $('profile-body');
    var u = null;
    try { u = JSON.parse(localStorage.getItem('userInfo') || 'null'); } catch (e) {}
    fetch('/api/my-account/me', { headers: auth() })
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (d) {
        u = d || u || {};
        $('user-line').textContent = (u.full_name || u.name || u.phone || 'Member') + (u.email ? ' · ' + u.email : '');
        box.innerHTML =
          '<p><strong>Name</strong><br>' + esc(u.full_name || u.name || '—') + '</p>' +
          '<p style="margin-top:12px"><strong>Phone</strong><br>' + esc(u.phone || '—') + '</p>' +
          '<p style="margin-top:12px"><strong>Email</strong><br>' + esc(u.email || '—') + '</p>' +
          '<p style="margin-top:12px"><strong>Role</strong><br><span class="badge">' + esc(u.role || 'buyer') + '</span></p>';
      })
      .catch(function () {
        if (u) {
          $('user-line').textContent = u.full_name || u.phone || 'Member';
          box.innerHTML = '<p>Signed in. Profile details unavailable offline.</p>';
        } else box.innerHTML = '<p class="empty">Could not load profile.</p>';
      });
  }

  function esc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  loadSaved();
  loadProfile();
})();
</script>

<div class="bnav" role="navigation" aria-label="Main">
  <nav>
    <a href="/">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1v-9.5z"/></svg>
      Home
    </a>
    <a href="/garage">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 17h14v-5l-2-5H7l-2 5v5z"/><circle cx="7" cy="17" r="2"/><circle cx="17" cy="17" r="2"/></svg>
      Garage
    </a>
    <a href="/my-account" class="active">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21H5a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2h3l2-2h4l2 2h3a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2z"/><circle cx="12" cy="13" r="3"/></svg>
      Saved
    </a>
    <a href="/my-account" class="active">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21v-1a7 7 0 0 1 14 0v1"/></svg>
      Account
    </a>
  </nav>
</div>

</body>
</html>
