<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>My Account · SalonAutoZone</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%230b1e3a'/><text x='50' y='68' font-size='60' font-weight='900' text-anchor='middle' fill='%2300a8e8' font-family='Arial'>S</text></svg>">
<style>
:root{
  --navy-900:#0a1729;--navy-800:#0b1e3a;--navy-700:#12294d;--navy-600:#1a3a6b;
  --blue-500:#0091d5;--blue-400:#00a8e8;--blue-300:#4dc3f0;
  --amber-500:#ffb800;--amber-600:#f59e0b;
  --orange-500:#ff6b00;--orange-600:#e55a00;
  --green-500:#16a34a;--green-400:#22c55e;
  --red-500:#dc2626;--red-400:#ef4444;
  --slate-50:#f8fafc;--slate-100:#f1f5f9;--slate-200:#e2e8f0;--slate-300:#cbd5e1;
  --slate-400:#94a3b8;--slate-500:#64748b;--slate-600:#475569;--slate-700:#334155;
  --slate-800:#1e293b;--slate-900:#0f172a;
  --shadow-sm:0 1px 2px rgba(15,23,42,0.04),0 1px 3px rgba(15,23,42,0.06);
  --shadow-md:0 2px 4px rgba(15,23,42,0.04),0 4px 12px rgba(15,23,42,0.06);
  --shadow-lg:0 4px 8px rgba(15,23,42,0.06),0 12px 28px rgba(15,23,42,0.10);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;font-size:15px;line-height:1.5;color:var(--slate-800);background:var(--slate-50);-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;letter-spacing:-0.01em}
button,input,select,textarea{font-family:inherit;font-size:inherit}
button{cursor:pointer;border:none;background:none}
a{color:inherit;text-decoration:none}
.navbar{background:var(--navy-800);color:#fff;padding:14px 32px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px}
.logo{font-size:18px;font-weight:800;color:var(--blue-400);text-decoration:none;letter-spacing:-0.03em}
.logo span{color:var(--amber-500)}
.nav-links{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.navbar a{color:#fff;text-decoration:none;font-size:13px;font-weight:600;padding:9px 14px;border-radius:8px;background:rgba(255,255,255,0.08);transition:background 0.15s}
.navbar a:hover{background:rgba(255,255,255,0.18)}
.navbar a.logout{background:var(--red-500)}
.navbar a.logout:hover{background:#b91c1c}
.container{max-width:1200px;margin:24px auto;padding:0 20px}
.welcome{background:#fff;border-radius:16px;padding:24px 28px;box-shadow:var(--shadow-sm);margin-bottom:20px;border:1px solid var(--slate-200)}
.welcome h1{font-size:22px;color:var(--navy-800);font-weight:800;letter-spacing:-0.02em}
.welcome p{font-size:14px;color:var(--slate-500);margin-top:4px}
.stats-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px;margin-bottom:24px}
.stat-card{background:#fff;border-radius:14px;padding:18px;box-shadow:var(--shadow-sm);border-left:4px solid var(--blue-400);transition:transform 0.15s,box-shadow 0.15s;border-top:1px solid var(--slate-200);border-right:1px solid var(--slate-200);border-bottom:1px solid var(--slate-200)}
.stat-card:hover{transform:translateY(-2px);box-shadow:var(--shadow-md)}
.stat-label{font-size:10px;color:var(--slate-400);text-transform:uppercase;font-weight:700;letter-spacing:0.08em}
.stat-value{font-size:28px;color:var(--navy-800);font-weight:800;margin-top:6px;letter-spacing:-0.03em}
.tabs{display:flex;gap:6px;margin-bottom:18px;background:#fff;padding:6px;border-radius:12px;box-shadow:var(--shadow-sm);overflow-x:auto;scrollbar-width:none;border:1px solid var(--slate-200)}
.tabs::-webkit-scrollbar{display:none}
.tab{padding:12px 18px;background:transparent;border:none;border-radius:8px;font-weight:600;cursor:pointer;color:var(--slate-500);font-size:13px;white-space:nowrap;flex-shrink:0;font-family:inherit;min-height:44px;transition:all 0.15s}
.tab:hover{color:var(--navy-800)}
.tab.active{background:var(--navy-800);color:#fff}
.section{background:#fff;border-radius:16px;padding:24px;box-shadow:var(--shadow-sm);display:none;border:1px solid var(--slate-200)}
.section.active{display:block}
.section h2{color:var(--navy-800);font-size:20px;margin-bottom:20px;font-weight:800;letter-spacing:-0.02em}
.listing-card{display:flex;gap:16px;padding:16px;border-bottom:1px solid var(--slate-100);align-items:center;flex-wrap:wrap;transition:background 0.15s;border-radius:12px}
.listing-card:last-child{border-bottom:none}
.listing-card:hover{background:var(--slate-50)}
.listing-card.featured{border-left:4px solid var(--amber-500);background:linear-gradient(90deg,#fffbeb,#ffffff);padding-left:12px}
.listing-img{width:80px;height:80px;border-radius:12px;background:linear-gradient(135deg,var(--slate-100),var(--slate-200));display:flex;align-items:center;justify-content:center;font-size:34px;flex-shrink:0;overflow:hidden}
.listing-img img{width:100%;height:100%;object-fit:cover}
.listing-info{flex:1;min-width:0}
.listing-title{font-weight:700;color:var(--navy-800);font-size:15px;margin-bottom:6px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;letter-spacing:-0.01em}
.listing-price{color:var(--blue-500);font-size:17px;font-weight:800;margin-bottom:6px;letter-spacing:-0.02em}
.listing-meta{font-size:12px;color:var(--slate-500);display:flex;gap:8px;flex-wrap:wrap;margin-top:6px;align-items:center}
.badge{background:var(--slate-100);padding:4px 10px;border-radius:6px;font-size:11px;font-weight:700;display:inline-block;color:var(--slate-600)}
.badge-featured{background:var(--amber-500);color:var(--navy-900);font-weight:900;box-shadow:0 2px 6px rgba(255,184,0,0.35)}
.badge.sold{background:var(--green-400);color:#fff}
.badge.inquiry{background:#fef3c7;color:#92400e}
.actions{display:flex;gap:6px;flex-wrap:wrap}
.action-btn{padding:10px 16px;border:none;border-radius:8px;font-weight:700;cursor:pointer;font-size:12px;font-family:inherit;min-height:40px;transition:opacity 0.15s,transform 0.15s}
.action-btn:hover:not(:disabled){opacity:0.9;transform:translateY(-1px)}
.action-btn:disabled{opacity:0.5;cursor:wait}
.edit-btn{background:var(--blue-400);color:#fff}
.promote-btn{background:var(--amber-500);color:var(--navy-900);font-weight:800}
.unpromote-btn{background:#fef3c7;color:#92400e;font-weight:800}
.sold-btn{background:var(--green-400);color:#fff}
.delete-btn{background:#fef2f2;color:var(--red-500)}
.empty{text-align:center;padding:60px 20px;color:var(--slate-400);font-size:14px;line-height:1.6}
.empty-icon{font-size:56px;margin-bottom:16px;opacity:0.4}
.loading{text-align:center;padding:40px;color:var(--blue-400);font-weight:600;font-size:14px}
.error{text-align:center;padding:24px;color:var(--red-500);background:#fef2f2;border-radius:12px;font-size:14px}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(100px);background:var(--navy-800);color:#fff;padding:14px 24px;border-radius:10px;font-weight:600;font-size:14px;box-shadow:var(--shadow-lg);transition:transform 0.3s,opacity 0.3s;opacity:0;z-index:9999;pointer-events:none;max-width:90vw;text-align:center}
.toast.show{transform:translateX(-50%) translateY(0);opacity:1}
.toast.success{background:var(--green-500)}
.toast.error{background:var(--red-500)}
@media (max-width:768px){
  .navbar{padding:12px 16px;flex-direction:column}
  .nav-links{width:100%;justify-content:center}
  .container{margin:16px auto;padding:0 14px}
  .stats-row{grid-template-columns:repeat(2,1fr);gap:10px}
  .stat-value{font-size:22px}
  .listing-card{padding:14px;gap:12px}
  .listing-img{width:70px;height:70px}
  .actions{width:100%;margin-top:8px}
  .action-btn{flex:1}
}
</style>
</head>
<body>

<div class="navbar">
  <a href="/" class="logo">Salon<span>AutoZone</span></a>
  <div class="nav-links">
    <a href="/">🏠 Home</a>
    <a href="/garage">🚗 My Garage</a>
    <a href="#" class="logout" id="logoutBtn">Logout</a>
  </div>
</div>

<div class="container">
  <div class="welcome">
    <h1 id="greeting">Welcome back!</h1>
    <p id="user-info">Loading…</p>
  </div>

  <div class="stats-row">
    <div class="stat-card"><div class="stat-label">My Cars</div><div class="stat-value" id="stat-cars">—</div></div>
    <div class="stat-card" style="border-left-color:var(--green-400)"><div class="stat-label">Cars Sold</div><div class="stat-value" id="stat-sold">—</div></div>
    <div class="stat-card" style="border-left-color:#a855f7"><div class="stat-label">My Parts</div><div class="stat-value" id="stat-parts">—</div></div>
    <div class="stat-card" style="border-left-color:var(--amber-500)"><div class="stat-label">Featured</div><div class="stat-value" id="stat-featured">—</div></div>
    <div class="stat-card" style="border-left-color:var(--slate-400)"><div class="stat-label">Saved</div><div class="stat-value" id="stat-saved">—</div></div>
    <div class="stat-card" style="border-left-color:var(--red-500)"><div class="stat-label">Imports</div><div class="stat-value" id="stat-imports">—</div></div>
  </div>

  <div class="tabs">
    <button class="tab active" data-tab="cars">🚗 My Cars</button>
    <button class="tab" data-tab="parts">🔧 My Parts</button>
    <button class="tab" data-tab="saved">💾 Saved</button>
    <button class="tab" data-tab="inquiries">💬 Inquiries</button>
    <button class="tab" data-tab="imports">🌍 Imports</button>
  </div>

  <div id="section-cars" class="section active">
    <h2>My Car Listings</h2>
    <div id="cars-list"><div class="loading">Loading…</div></div>
  </div>

  <div id="section-parts" class="section">
    <h2>My Part Listings</h2>
    <div id="parts-list"><div class="loading">Loading…</div></div>
  </div>

  <div id="section-saved" class="section">
    <h2>💾 Saved Items</h2>
    <div id="saved-list"><div class="loading">Loading…</div></div>
  </div>

  <div id="section-inquiries" class="section">
    <h2>My Inquiries (Sent)</h2>
    <div id="inquiries-list"><div class="loading">Loading…</div></div>
  </div>

  <div id="section-imports" class="section">
    <h2>My Import Requests</h2>
    <div id="imports-list"><div class="loading">Loading…</div></div>
  </div>
</div>

<div id="toast" class="toast"></div>

<script>
(function () {
  'use strict';
  var TOKEN_KEY = 'token';
  var USER_KEY = 'userInfo';
  var token = '';
  try { token = localStorage.getItem(TOKEN_KEY) || ''; } catch (e) {}
  if (!token) { window.location.href = '/login?next=/my-account'; return; }

  function esc(s) {
    if (s === null || s === undefined) return '';
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function safeUrl(url) {
    if (!url) return '';
    var u = String(url).trim();
    if (/^https?:\/\//i.test(u) || /^data:image\//i.test(u) || /^\//.test(u)) return u;
    return '';
  }
  function timeAgo(iso) {
    if (!iso) return '';
    var diff = (Date.now() - new Date(iso).getTime()) / 1000;
    if (diff < 60) return 'just now';
    if (diff < 3600) return Math.floor(diff / 60) + 'm ago';
    if (diff < 86400) return Math.floor(diff / 3600) + 'h ago';
    if (diff < 604800) return Math.floor(diff / 86400) + 'd ago';
    return new Date(iso).toLocaleDateString();
  }
  function showToast(msg, type) {
    var t = document.getElementById('toast');
    t.innerText = msg;
    t.className = 'toast show ' + (type || '');
    clearTimeout(t._timer);
    t._timer = setTimeout(function () { t.className = 'toast'; }, 3000);
  }
  function authHeaders() { return { 'Authorization': 'Bearer ' + token }; }
  async function apiFetch(url, options) {
    var opts = options || {};
    opts.headers = Object.assign({}, opts.headers || {}, authHeaders());
    var res = await fetch(url, opts);
    if (res.status === 401) {
      try { localStorage.removeItem(TOKEN_KEY); localStorage.removeItem(USER_KEY); } catch (e) {}
      window.location.href = '/login?next=/my-account';
      throw new Error('Unauthorized');
    }
    if (!res.ok) {
      var err = await res.json().catch(function() { return {}; });
      throw new Error(err.detail || 'Request failed: ' + res.status);
    }
    return res.json();
  }
  function setBusy(btn, busy) { if (btn) btn.disabled = busy; }

  document.getElementById('logoutBtn').addEventListener('click', function (e) {
    e.preventDefault();
    try { localStorage.removeItem(TOKEN_KEY); localStorage.removeItem(USER_KEY); } catch (err) {}
    window.location.href = '/';
  });

  async function loadUser() {
    try {
      var u = await apiFetch('/api/auth/me');
      document.getElementById('greeting').textContent = 'Welcome back, ' + (u.full_name || 'User') + '!';
      var parts = [];
      if (u.email) parts.push(u.email);
      if (u.phone) parts.push(u.phone);
      document.getElementById('user-info').textContent = parts.join(' • ') || 'No contact info';
      try { localStorage.setItem(USER_KEY, JSON.stringify(u)); } catch (e) {}
    } catch (e) { console.warn('loadUser failed', e); }
  }

  async function loadStats() {
    try {
      var d = await apiFetch('/api/my-account/stats');
      document.getElementById('stat-cars').textContent = d.total_cars ?? 0;
      document.getElementById('stat-sold').textContent = d.cars_sold ?? 0;
      document.getElementById('stat-parts').textContent = d.total_parts ?? 0;
      document.getElementById('stat-featured').textContent = (d.featured_parts ?? 0) + (d.featured_cars ?? 0);
      document.getElementById('stat-saved').textContent = d.saved_items ?? 0;
      document.getElementById('stat-imports').textContent = d.total_import_requests ?? 0;
    } catch (e) { console.warn('loadStats failed', e); }
  }

  async function loadCars() {
    var el = document.getElementById('cars-list');
    el.innerHTML = '<div class="loading">Loading…</div>';
    try {
      var data = await apiFetch('/api/my-account/my-cars');
      if (!data.count || data.count === 0) {
        el.innerHTML = '<div class="empty"><div class="empty-icon">🚗</div>You haven\'t listed any cars yet.<br><br><a href="/?action=list-car" style="color:var(--blue-400);font-weight:700;">+ List Your First Car</a></div>';
        return;
      }
      el.innerHTML = data.vehicles.map(function (v) {
        var imgUrl = safeUrl(v.image_url);
        var imgHtml = imgUrl ? '<img src="' + esc(imgUrl) + '" alt="" loading="lazy" onerror="this.style.display=\'none\';this.parentNode.textContent=\'🚗\';">' : '🚗';
        var featuredBadge = v.is_featured ? ' <span class="badge badge-featured">⭐ FEATURED</span>' : '';
        var soldBadge = v.is_sold ? ' <span class="badge sold">SOLD</span>' : '';
        var inqBadge = (v.inquiry_count > 0) ? '<span class="badge inquiry">📩 ' + v.inquiry_count + '</span>' : '';
        var soldBtn = v.is_sold ? '' : '<button type="button" class="action-btn sold-btn" data-action="sold" data-id="' + v.id + '">✅ Sold</button>';
        var promoteBtn = v.is_featured ? '<button type="button" class="action-btn unpromote-btn" data-action="unpromote-car" data-id="' + v.id + '">⭐ Unfeature</button>' : '<button type="button" class="action-btn promote-btn" data-action="promote-car" data-id="' + v.id + '">⭐ Promote</button>';
        return '<div class="listing-card' + (v.is_featured ? ' featured' : '') + '">' +
          '<div class="listing-img">' + imgHtml + '</div>' +
          '<div class="listing-info">' +
            '<div class="listing-title">' + esc(v.title) + featuredBadge + soldBadge + '</div>' +
            '<div class="listing-price">SLL ' + Number(v.price_sll || 0).toLocaleString() + '</div>' +
            '<div class="listing-meta"><span class="badge">' + esc(v.year) + '</span><span class="badge">📍 ' + esc(v.location) + '</span>' + inqBadge + '<span class="badge">' + timeAgo(v.created_at) + '</span></div>' +
          '</div>' +
          '<div class="actions">' + promoteBtn + soldBtn +
            '<button type="button" class="action-btn edit-btn" data-action="edit-vehicle" data-id="' + v.id + '">✏️ Edit</button>' +
            '<button type="button" class="action-btn delete-btn" data-action="delete-car" data-id="' + v.id + '">🗑 Delete</button>' +
          '</div>' +
        '</div>';
      }).join('');
    } catch (e) { el.innerHTML = '<div class="error">Failed to load cars: ' + esc(e.message) + '</div>'; }
  }

  async function loadParts() {
    var el = document.getElementById('parts-list');
    el.innerHTML = '<div class="loading">Loading…</div>';
    try {
      var data = await apiFetch('/api/my-account/my-parts');
      if (!data.count || data.count === 0) {
        el.innerHTML = '<div class="empty"><div class="empty-icon">🔧</div>You haven\'t listed any parts yet.<br><br><a href="/?action=list-part" style="color:var(--blue-400);font-weight:700;">+ List Your First Part</a></div>';
        return;
      }
      el.innerHTML = data.parts.map(function (p) {
        var imgUrl = safeUrl(p.image_url);
        var imgHtml = imgUrl ? '<img src="' + esc(imgUrl) + '" alt="" loading="lazy" onerror="this.style.display=\'none\';this.parentNode.textContent=\'🔧\';">' : '🔧';
        var featuredBadge = p.is_featured ? ' <span class="badge badge-featured">⭐ FEATURED</span>' : '';
        var inqBadge = (p.inquiry_count > 0) ? '<span class="badge inquiry">📩 ' + p.inquiry_count + '</span>' : '';
        var promoteBtn = p.is_featured ? '<button type="button" class="action-btn unpromote-btn" data-action="unpromote-part" data-id="' + p.id + '">⭐ Unfeature</button>' : '<button type="button" class="action-btn promote-btn" data-action="promote-part" data-id="' + p.id + '">⭐ Promote</button>';
        return '<div class="listing-card' + (p.is_featured ? ' featured' : '') + '">' +
          '<div class="listing-img">' + imgHtml + '</div>' +
          '<div class="listing-info">' +
            '<div class="listing-title">' + esc(p.name) + featuredBadge + '</div>' +
            '<div class="listing-price">SLL ' + Number(p.price_sll || 0).toLocaleString() + '</div>' +
            '<div class="listing-meta"><span class="badge">' + esc(p.category) + '</span><span class="badge">📍 ' + esc(p.location) + '</span><span class="badge">Stock: ' + (p.stock_quantity ?? 0) + '</span>' + inqBadge + '</div>' +
          '</div>' +
          '<div class="actions">' + promoteBtn +
            '<button type="button" class="action-btn edit-btn" data-action="edit-part" data-id="' + p.id + '">✏️ Edit</button>' +
            '<button type="button" class="action-btn delete-btn" data-action="delete-part" data-id="' + p.id + '">🗑 Delete</button>' +
          '</div>' +
        '</div>';
      }).join('');
    } catch (e) { el.innerHTML = '<div class="error">Failed to load parts: ' + esc(e.message) + '</div>'; }
  }

  async function loadSaved() {
    var el = document.getElementById('saved-list');
    el.innerHTML = '<div class="loading">Loading…</div>';
    try {
      var data = await apiFetch('/api/my-account/saved');
      if (!data.count || data.count === 0) {
        el.innerHTML = '<div class="empty"><div class="empty-icon">💾</div>You haven\'t saved any items yet.<br><br><span style="color:var(--slate-500);">Save parts and cars you\'re interested in by clicking the <b>💾 Save</b> button on any listing card.</span></div>';
        return;
      }
      el.innerHTML = data.items.map(function (s) {
        var imgUrl = safeUrl(s.listing_image_url);
        var imgHtml = imgUrl ? '<img src="' + esc(imgUrl) + '" alt="" loading="lazy" onerror="this.style.display=\'none\';this.parentNode.textContent=\'💾\';">' : (s.listing_type === 'vehicle' ? '🚗' : '🔧');
        var href = s.listing_type === 'vehicle' ? '/vehicle/' + s.listing_id : '/part/' + s.listing_id;
        return '<div class="listing-card">' +
          '<div class="listing-img">' + imgHtml + '</div>' +
          '<div class="listing-info">' +
            '<div class="listing-title">' + esc(s.listing_title || '(listing #' + s.listing_id + ')') + '</div>' +
            (s.listing_price_sll ? '<div class="listing-price">SLL ' + Number(s.listing_price_sll).toLocaleString() + '</div>' : '') +
            '<div class="listing-meta"><span class="badge">' + esc(s.listing_type) + '</span><span class="badge">' + timeAgo(s.created_at) + '</span></div>' +
          '</div>' +
          '<div class="actions">' +
            '<button type="button" class="action-btn edit-btn" data-action="view-saved" data-href="' + href + '">👁 View</button>' +
            '<button type="button" class="action-btn delete-btn" data-action="unsave" data-id="' + s.id + '">🗑 Remove</button>' +
          '</div>' +
        '</div>';
      }).join('');
    } catch (e) { el.innerHTML = '<div class="error">Failed to load saved items: ' + esc(e.message) + '</div>'; }
  }

  async function loadInquiries() {
    var el = document.getElementById('inquiries-list');
    el.innerHTML = '<div class="loading">Loading…</div>';
    try {
      var data = await apiFetch('/api/my-account/my-inquiries');
      if (!data.count || data.count === 0) {
        el.innerHTML = '<div class="empty"><div class="empty-icon">💬</div>You haven\'t sent any inquiries yet.<br><br><a href="/" style="color:var(--blue-400);font-weight:700;">Browse listings →</a></div>';
        return;
      }
      el.innerHTML = data.inquiries.map(function (i) {
        var msg = i.buyer_message ? '<div style="font-size:13px;color:var(--slate-600);margin-top:6px;font-style:italic;">"' + esc(i.buyer_message) + '"</div>' : '';
        return '<div class="listing-card">' +
          '<div class="listing-img">' + (i.listing_type === 'vehicle' ? '🚗' : '🔧') + '</div>' +
          '<div class="listing-info">' +
            '<div class="listing-title">' + esc(i.listing_title || '(listing #' + i.listing_id + ')') + '</div>' +
            msg +
            '<div class="listing-meta"><span class="badge">' + esc(i.status) + '</span><span class="badge">' + timeAgo(i.created_at) + '</span></div>' +
          '</div>' +
        '</div>';
      }).join('');
    } catch (e) { el.innerHTML = '<div class="error">Failed to load inquiries: ' + esc(e.message) + '</div>'; }
  }

  async function loadImports() {
    var el = document.getElementById('imports-list');
    el.innerHTML = '<div class="loading">Loading…</div>';
    try {
      var data = await apiFetch('/api/my-account/my-import-requests');
      if (!data.count || data.count === 0) {
        el.innerHTML = '<div class="empty"><div class="empty-icon">🌍</div>You haven\'t requested any imports yet.<br><br><a href="/" style="color:var(--blue-400);font-weight:700;">Request a part →</a></div>';
        return;
      }
      el.innerHTML = data.requests.map(function (r) {
        var quoteHtml = '';
        if (r.quoted_price_sll) {
          quoteHtml = '<div style="background:#dcfce7;padding:12px;border-radius:8px;margin-top:10px;font-size:13px;font-weight:600;color:#166534;">💰 Quoted: SLL ' + Number(r.quoted_price_sll).toLocaleString() + '</div>';
        }
        return '<div class="listing-card">' +
          '<div class="listing-img">🌍</div>' +
          '<div class="listing-info">' +
            '<div class="listing-title">' + esc(r.part_name) + '</div>' +
            '<div style="font-size:13px;color:var(--slate-600);">' + esc(r.car_make) + ' ' + esc(r.car_model) + ' (' + esc(r.car_year) + ')</div>' +
            '<div class="listing-meta"><span class="badge">' + esc(r.status) + '</span><span class="badge">' + timeAgo(r.created_at) + '</span></div>' +
            quoteHtml +
          '</div>' +
        '</div>';
      }).join('');
    } catch (e) { el.innerHTML = '<div class="error">Failed to load imports: ' + esc(e.message) + '</div>'; }
  }

  async function markSold(id, btn) {
    if (!confirm('Mark this car as sold?')) return;
    setBusy(btn, true);
    try {
      await apiFetch('/api/vehicles/' + encodeURIComponent(id) + '/sold', { method: 'POST' });
      showToast('✅ Marked as sold', 'success');
      await Promise.all([loadCars(), loadStats()]);
    } catch (e) { showToast('❌ ' + e.message, 'error'); }
    finally { setBusy(btn, false); }
  }
  function editListing(type, id) {
    window.location.href = '/?action=' + (type === 'vehicle' ? 'edit-vehicle' : 'edit-part') + '&id=' + encodeURIComponent(id);
  }
  async function deleteCar(id, btn) {
    if (!confirm('Delete this car listing permanently?')) return;
    setBusy(btn, true);
    try {
      await apiFetch('/api/my-account/vehicle/' + encodeURIComponent(id), { method: 'DELETE' });
      showToast('🗑 Car deleted', 'success');
      await Promise.all([loadCars(), loadStats()]);
    } catch (e) { showToast('❌ ' + e.message, 'error'); }
    finally { setBusy(btn, false); }
  }
  async function deletePart(id, btn) {
    if (!confirm('Delete this part listing permanently?')) return;
    setBusy(btn, true);
    try {
      await apiFetch('/api/my-account/part/' + encodeURIComponent(id), { method: 'DELETE' });
      showToast('🗑 Part deleted', 'success');
      await Promise.all([loadParts(), loadStats()]);
    } catch (e) { showToast('❌ ' + e.message, 'error'); }
    finally { setBusy(btn, false); }
  }
  async function promotePart(id, btn) {
    var msg = '⭐ Feature this part listing for 7 days?\n\nPrice: SLL 150,000\nPay via Orange Money to: +232 76 123456\n\nAfter sending payment, click OK.';
    if (!confirm(msg)) return;
    setBusy(btn, true);
    try {
      await apiFetch('/api/parts/' + encodeURIComponent(id) + '/promote?days=7', { method: 'POST' });
      showToast('⭐ Listing featured for 7 days!', 'success');
      await Promise.all([loadParts(), loadStats()]);
    } catch (e) { showToast('❌ ' + e.message, 'error'); }
    finally { setBusy(btn, false); }
  }
  async function unpromotePart(id, btn) {
    if (!confirm('Remove featured status?')) return;
    setBusy(btn, true);
    try {
      await apiFetch('/api/parts/' + encodeURIComponent(id) + '/unpromote', { method: 'POST' });
      showToast('Featured status removed', 'success');
      await Promise.all([loadParts(), loadStats()]);
    } catch (e) { showToast('❌ ' + e.message, 'error'); }
    finally { setBusy(btn, false); }
  }
  async function promoteCar(id, btn) {
    var msg = '⭐ Feature this car listing for 7 days?\n\nPrice: SLL 150,000\nPay via Orange Money to: +232 76 123456\n\nAfter sending payment, click OK.';
    if (!confirm(msg)) return;
    setBusy(btn, true);
    try {
      await apiFetch('/api/vehicles/' + encodeURIComponent(id) + '/promote?days=7', { method: 'POST' });
      showToast('⭐ Listing featured for 7 days!', 'success');
      await Promise.all([loadCars(), loadStats()]);
    } catch (e) { showToast('❌ ' + e.message, 'error'); }
    finally { setBusy(btn, false); }
  }
  async function unpromoteCar(id, btn) {
    if (!confirm('Remove featured status?')) return;
    setBusy(btn, true);
    try {
      await apiFetch('/api/vehicles/' + encodeURIComponent(id) + '/unpromote', { method: 'POST' });
      showToast('Featured status removed', 'success');
      await Promise.all([loadCars(), loadStats()]);
    } catch (e) { showToast('❌ ' + e.message, 'error'); }
    finally { setBusy(btn, false); }
  }
  async function unsave(id, btn) {
    if (!confirm('Remove this item from your saved list?')) return;
    setBusy(btn, true);
    try {
      await apiFetch('/api/my-account/saved/' + encodeURIComponent(id), { method: 'DELETE' });
      showToast('🗑 Removed from saved', 'success');
      await Promise.all([loadSaved(), loadStats()]);
    } catch (e) { showToast('❌ ' + e.message, 'error'); }
    finally { setBusy(btn, false); }
  }

  document.addEventListener('click', function (e) {
    var btn = e.target.closest('[data-action]');
    if (!btn) return;
    e.preventDefault();
    e.stopPropagation();
    var action = btn.dataset.action;
    var id = btn.dataset.id;
    if (action === 'sold') markSold(id, btn);
    else if (action === 'edit-vehicle') editListing('vehicle', id);
    else if (action === 'edit-part') editListing('part', id);
    else if (action === 'delete-car') deleteCar(id, btn);
    else if (action === 'delete-part') deletePart(id, btn);
    else if (action === 'promote-part') promotePart(id, btn);
    else if (action === 'unpromote-part') unpromotePart(id, btn);
    else if (action === 'promote-car') promoteCar(id, btn);
    else if (action === 'unpromote-car') unpromoteCar(id, btn);
    else if (action === 'unsave') unsave(id, btn);
    else if (action === 'view-saved') window.location.href = btn.dataset.href;
  });

  var tabs = document.querySelectorAll('.tab');
  var sections = {
    cars: document.getElementById('section-cars'),
    parts: document.getElementById('section-parts'),
    saved: document.getElementById('section-saved'),
    inquiries: document.getElementById('section-inquiries'),
    imports: document.getElementById('section-imports')
  };
  function switchTab(tabName) {
    tabs.forEach(function (t) { t.classList.toggle('active', t.dataset.tab === tabName); });
    Object.keys(sections).forEach(function (key) { sections[key].classList.toggle('active', key === tabName); });
    if (tabName === 'cars') loadCars();
    else if (tabName === 'parts') loadParts();
    else if (tabName === 'saved') loadSaved();
    else if (tabName === 'inquiries') loadInquiries();
    else if (tabName === 'imports') loadImports();
  }
  tabs.forEach(function (t) { t.addEventListener('click', function () { switchTab(t.dataset.tab); }); });

  loadUser();
  loadStats();
  loadCars();
})();
</script>
</body>
</html>
