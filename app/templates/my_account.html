<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>My account · SalonAutoZone</title>
<meta name="theme-color" content="#0e2a2b">
<link rel="icon" type="image/png" sizes="64x64" href="/static/icon-64.png">
<link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
<link rel="manifest" href="/static/manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&display=swap" data-saz-font media="print" onload="this.media='all'">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&display=swap"></noscript>
<link rel="stylesheet" href="/static/ui.css?v=8">
<link rel="stylesheet" href="/static/chrome.css?v=5">
<style>
.acc-head { display: flex; flex-wrap: wrap; gap: 14px; align-items: center; justify-content: space-between; padding: 22px 0 6px; }
.acc-head h1 { font-size: clamp(28px, 5vw, 40px); font-variation-settings: "wdth" 78; }
.acc-head p { color: var(--muted); margin-top: 4px; }
.acc-head .acts { display: flex; gap: 8px; flex-wrap: wrap; }
.stats { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; margin: 16px 0; }
@media (min-width: 760px) { .stats { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
.stat { background: var(--card); border: 1px solid var(--line); border-radius: var(--r-md); padding: 14px 16px; }
.stat b { display: block; font-size: 28px; color: var(--ink); font-variation-settings: "wdth" 85; line-height: 1.1; }
.stat span { color: var(--muted); font-size: 14px; }
.biz { display: flex; gap: 12px; align-items: center; justify-content: space-between; flex-wrap: wrap; margin-bottom: 16px; }
.tabs { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; border-bottom: 1px solid var(--line); margin-bottom: 16px; }
.tabs::-webkit-scrollbar { display: none; }
.tabs button { flex-shrink: 0; border: 0; background: none; padding: 12px 14px; font-weight: 700; color: var(--muted); border-bottom: 3px solid transparent; margin-bottom: -1px; }
.tabs button[aria-selected="true"] { color: var(--ink); border-color: var(--teal); }
.tabs .n { display: inline-block; min-width: 20px; padding: 0 6px; margin-left: 4px; border-radius: 10px; background: var(--paper); font-size: 12px; }
.list { display: grid; gap: 10px; }
.item { display: grid; grid-template-columns: 64px minmax(0, 1fr); gap: 12px; align-items: center; padding: 12px; background: var(--card); border: 1px solid var(--line); border-radius: var(--r-md); }
.item.noimg { grid-template-columns: minmax(0, 1fr); }
.item .th { width: 64px; height: 64px; border-radius: var(--r-sm); background: var(--teal-50) center / cover no-repeat; }
.item a.t { font-weight: 700; color: var(--ink); text-decoration: none; }
.item .m { font-size: 14px; color: var(--muted); margin-top: 2px; }
.item .ops { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
.item .ops .btn { min-height: 36px; padding: 6px 12px; font-size: 14px; }
.tag { display: inline-block; font-size: 12px; font-weight: 800; padding: 2px 8px; border-radius: 6px; background: var(--teal-50); color: var(--teal-600); margin-right: 4px; }
.tag.gold { background: var(--gold-50); color: #7a4b00; }
.tag.off { background: var(--paper); color: var(--muted); }
.empty { text-align: center; padding: 40px 16px; background: var(--card); border: 1px solid var(--line); border-radius: var(--r-md); }
.empty h2 { font-size: 22px; }
.empty p { color: var(--muted); margin: 6px 0 16px; }
.msg { white-space: pre-line; margin-top: 6px; }
</style>
</head>
<body>
<div id="site-header"></div>
<main class="wrap">
 <div class="acc-head">
  <div><h1 id="hello">My account</h1><p id="who">Loading…</p></div>
  <div class="acts">
   <a class="btn btn-primary" href="/sell" data-saz-sell>Sell something</a>
   <a class="btn btn-ghost" href="/garage">My cars</a>
   <a class="btn btn-ghost" href="/account/password">Change password</a>
   <button type="button" class="btn btn-ghost" id="logout">Sign out</button>
  </div>
 </div>
 <div class="stats" id="stats"></div>
 <div id="biz"></div>
 <div class="tabs" role="tablist" id="tabs">
  <button role="tab" data-tab="orders" aria-selected="true">Orders</button>
  <button role="tab" data-tab="listings" aria-selected="false">My listings</button>
  <button role="tab" data-tab="sales" aria-selected="false">Sales</button>
  <button role="tab" data-tab="enquiries" aria-selected="false">Enquiries</button>
  <button role="tab" data-tab="saved" aria-selected="false">Saved</button>
  <button role="tab" data-tab="requests" aria-selected="false">Import requests</button>
 </div>
 <section id="panel" aria-live="polite"></section>
</main>
<script src="/static/site.js?v=10"></script>
<script>
(function () {
 'use strict';
 var token = '';
 try { token = localStorage.getItem('token') || localStorage.getItem('access_token') || ''; } catch (e) {}
 if (!token) { location.replace('/login?next=' + encodeURIComponent('/my-account')); return; }
 var $ = function (id) { return document.getElementById(id); };
 var panel = $('panel');
 function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
 function fmt(n) { return Number(n || 0).toLocaleString('en-GB'); }
 function plural(n, one, many) { return fmt(n) + ' ' + (Number(n) === 1 ? one : many); }
 function when(iso) { if (!iso) return ''; var d = new Date(iso); return isNaN(d) ? '' : d.toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' }); }
 function safeUrl(u) { u = String(u || '').trim(); return (/^https?:\/\//i.test(u) || /^\/(?!\/)/.test(u)) ? u : ''; }
 function signOut() { try { ['token', 'access_token', 'userInfo'].forEach(function (k) { localStorage.removeItem(k); }); } catch (e) {} location.href = '/'; }
 function api(url, opts) {
  opts = opts || {};
  opts.headers = Object.assign({ Authorization: 'Bearer ' + token }, opts.headers || {});
  return fetch(url, opts).then(function (r) {
   if (r.status === 401) { signOut(); throw null; }
   return r.json().catch(function () { return {}; }).then(function (d) { if (!r.ok) throw new Error(d.detail || 'Something went wrong'); return d; });
  });
 }
 function toast(msg, type) {
  var t = $('toast');
  if (!t) { t = document.createElement('div'); t.id = 'toast'; t.setAttribute('role', 'status'); document.body.appendChild(t); }
  t.className = 'toast ' + (type || ''); t.textContent = msg; void t.offsetWidth; t.classList.add('show');
  clearTimeout(t._t); t._t = setTimeout(function () { t.classList.remove('show'); }, 2600);
 }
 function empty(title, text, cta) { return '<div class="empty"><h2>' + title + '</h2><p>' + text + '</p>' + (cta || '') + '</div>'; }
 function item(o) {
  var img = safeUrl(window.SAZImg ? SAZImg(o.img, 160) : o.img);
  return '<div class="item' + (o.noimg ? ' noimg' : '') + '">' + (o.noimg ? '' : '<div class="th"' + (img ? ' style="background-image:url(\'' + esc(img) + '\')"' : '') + '></div>') +
   '<div><a class="t" href="' + esc(o.href || '#') + '">' + esc(o.title) + '</a><div class="m">' + o.meta + '</div>' + (o.extra || '') + (o.ops ? '<div class="ops">' + o.ops + '</div>' : '') + '</div></div>';
 }
 $('logout').addEventListener('click', signOut);

 // ---------- header + stats ----------
 api('/api/auth/me').then(function (u) {
  $('hello').textContent = 'Hi, ' + (String(u.full_name || '').split(' ')[0] || 'there');
  $('who').textContent = [u.phone, u.email].filter(Boolean).join(', ');
  try { localStorage.setItem('userInfo', JSON.stringify(u)); } catch (e) {}
  if (u.is_admin) $('biz').innerHTML = '<div class="box biz"><div><b>You\'re an admin</b><div class="hint" style="margin:0">Manage listings, payments and orders.</div></div><a class="btn btn-dark" href="/admin/dashboard">Open admin</a></div>';
 }).catch(function () {});
 api('/api/my-account/stats').then(function (s) {
  var tiles = [[s.total_parts + s.total_cars, 'Listings'], [s.total_inquiries_received, 'Enquiries received'], [s.saved_items, 'Saved'], [s.total_import_requests, 'Import requests']];
  $('stats').innerHTML = tiles.map(function (t) { return '<div class="stat"><b>' + fmt(t[0]) + '</b><span>' + t[1] + '</span></div>'; }).join('');
 }).catch(function () { $('stats').hidden = true; });
 api('/api/businesses/mine').then(function (d) {
  var b = d.business;
  if (!b) return;
  var label = b.status === 'verified' ? '<span class="tag">Verified</span>' : b.status === 'rejected' ? '<span class="tag off">Not approved</span>' : '<span class="tag gold">Waiting for approval</span>';
  $('biz').insertAdjacentHTML('beforeend', '<div class="box biz"><div><b>' + esc(b.name) + '</b> ' + label + '<div class="hint" style="margin:0">Your business page and plan</div></div><div style="display:flex;gap:8px;flex-wrap:wrap">' +
   (b.slug ? '<a class="btn btn-ghost" href="/store/' + encodeURIComponent(b.slug) + '">View page</a>' : '') + '<a class="btn btn-ghost" href="/my-subscription">Plan</a><a class="btn btn-ghost" href="/become-a-seller">Edit</a></div></div>');
 }).catch(function () {});

 // ---------- tabs ----------
 var loaders = {
  orders: function () {
   return api('/api/shop/orders').then(function (d) {
    var list = d.orders || [];
    if (!list.length) return empty('No orders yet', 'Parts you buy will show up here.', '<a class="btn btn-primary" href="/">Browse parts</a>');
    var L = { awaiting_payment: ['Waiting for payment', 'gold'], confirmed: ['Paid', ''], ready_for_pickup: ['Ready for pickup', ''], driver_assigned: ['Driver assigned', ''], out_for_delivery: ['On the way', ''], delivered: ['Delivered', ''], cancelled: ['Cancelled', 'off'] };
    return '<div class="list">' + list.map(function (o) {
     var s = L[o.status] || [o.status, ''];
     return item({ noimg: true, href: '/orders?id=' + o.id, title: 'Order ' + o.code, meta: '<span class="tag ' + s[1] + '">' + esc(s[0]) + '</span> Le ' + fmt((o.parts_total_sll || 0) + (o.delivery_fee_sll || 0)) + ', ' + esc(when(o.created_at)) });
    }).join('') + '</div>';
   });
  },
  listings: function () {
   return Promise.all([api('/api/my-account/my-parts'), api('/api/my-account/my-cars')]).then(function (r) {
    var parts = r[0].parts || [], cars = r[1].vehicles || [];
    if (!parts.length && !cars.length) return empty('You haven\'t listed anything yet', 'Listing a part or a car is free and takes two minutes.', '<a class="btn btn-primary" href="/sell" data-saz-sell>Sell something</a>');
    var h = '<div class="list">';
    h += parts.map(function (p) {
     return item({ img: p.image_url, href: '/part/' + p.id, title: p.name,
      meta: (p.is_featured ? '<span class="tag gold">Featured</span>' : '') + 'Le ' + fmt(p.price_sll) + ', ' + fmt(p.stock_quantity) + ' in stock, ' + plural(p.views, 'view', 'views') + ', ' + plural(p.inquiry_count, 'enquiry', 'enquiries'),
      ops: '<a class="btn btn-ghost" href="/part/' + p.id + '">View</a><button class="btn btn-ghost" data-del="part" data-id="' + p.id + '">Delete</button>' });
    }).join('');
    h += cars.map(function (v) {
     return item({ img: v.image_url, href: '/vehicle/' + v.id, title: v.title,
      meta: (v.is_sold ? '<span class="tag off">Sold</span>' : '') + (v.is_featured ? '<span class="tag gold">Featured</span>' : '') + 'Le ' + fmt(v.price_sll) + ', ' + plural(v.views, 'view', 'views') + ', ' + plural(v.inquiry_count, 'enquiry', 'enquiries'),
      ops: '<a class="btn btn-ghost" href="/vehicle/' + v.id + '">View</a>' + (v.is_sold ? '' : '<button class="btn btn-ghost" data-sold="' + v.id + '">Mark as sold</button>') + '<button class="btn btn-ghost" data-del="vehicle" data-id="' + v.id + '">Delete</button>' });
    }).join('');
    return h + '</div>';
   });
  },
  sales: function () {
   return Promise.all([api('/api/shop/seller/orders'), api('/api/businesses/mine/payments').catch(function () { return null; }), api('/api/shop/seller/fees').catch(function () { return null; }), api('/api/shop/seller/rider-payouts').catch(function () { return null; }), api('/api/shop/seller/payouts').catch(function () { return null; }), api('/api/analytics/seller/month').catch(function () { return null; })]).then(function (res) {
    var d = res[0], ps = res[1], fees = res[2], riders = (res[3] && res[3].payouts) || [], pay = res[4], stats = res[5];
    var list = d.orders || [];
    var top = (stats ? statsBox(stats) : '') + (ps ? payBox(ps) : '') + '<a class="notice notice-info" href="/alerts" style="display:block;margin-bottom:12px;text-decoration:none">🔔 <b>Turn on alerts</b> to hear about new orders and payments straight away.</a>';
    if (pay && (pay.coming_sll || pay.due_sll || (pay.recent_paid || []).length)) top = '<div class="box" style="margin-bottom:14px;display:grid;grid-template-columns:1fr 1fr;gap:10px">' +
     '<div><small class="hint">Waiting for delivery</small><b style="display:block;font-size:20px">Le ' + fmt(pay.coming_sll) + '</b></div>' +
     '<div><small class="hint">Delivered, we\'re sending it</small><b style="display:block;font-size:20px">Le ' + fmt(pay.due_sll) + '</b></div>' +
     ((pay.recent_paid || []).length ? '<div style="grid-column:1/-1;font-size:14px"><small class="hint">Last paid to you</small><br>' + pay.recent_paid.slice(0, 3).map(function (r) { return esc(r.code) + ': Le ' + fmt(r.amount_sll) + (r.reference ? ' (ref ' + esc(r.reference) + ')' : ''); }).join('<br>') + '</div>' : '') +
     (ps && !ps.pay_orange_money && !ps.pay_afrimoney ? '<div class="notice notice-bad" style="grid-column:1/-1">Add your mobile money number below so we can send you your money.</div>' : '') +
     '</div>' + top;
    if (fees && fees.owed_sll > 0) top = '<div class="notice notice-warn" style="margin-bottom:14px"><b>You owe SalonAutoZone Le ' + fmt(fees.owed_sll) + '</b> in fees for ' + plural(fees.orders, 'delivered order', 'delivered orders') + '.' + (fees.pay_to ? ' Send it with Orange Money to <b>' + esc(fees.pay_to) + '</b>, with your shop name as the reference.' : '') + '</div>' + top;
    if (riders.length) top = riders.map(function (p) {
     var ph = String(p.rider_phone || '').replace(/[^\d+]/g, '');
     return '<div class="notice notice-warn" style="margin-bottom:10px"><b>Pay the rider Le ' + fmt(p.amount_sll) + '</b> for order ' + esc(p.code) + '. The buyer has the parts. Send it to ' + esc(p.rider_name || 'the rider') + ' on ' + (ph ? '<a href="tel:' + esc(ph) + '">' + esc(p.rider_phone) + '</a>' : 'their phone') + '.' +
      '<div style="margin-top:8px"><button class="btn btn-primary" data-rider-paid="' + p.job_id + '">I\'ve paid the rider</button></div></div>';
    }).join('') + top;
    if (!list.length) return top + empty('No sales yet', 'When a buyer orders one of your parts it shows up here. Get the parts ready once the order says Paid.', '');
    var S = { awaiting_payment: ['Waiting for the buyer to pay', 'gold'], confirmed: ['Paid: get the parts ready', ''], ready_for_pickup: ['Ready: waiting for a driver', ''], driver_assigned: ['Driver on the way to you', ''], out_for_delivery: ['With the driver', ''], delivered: ['Delivered', ''], cancelled: ['Cancelled', 'off'] };
    return top + '<div class="list">' + list.map(function (o) {
     var s = S[o.status] || [o.status, ''];
     var items = (o.items || []).map(function (it) { return esc(it.title) + ' × ' + it.qty; }).join(', ');
     var p = o.payment, shop = o.pay_to === 'shop';
     var payLine = '';
     if (!shop && o.you_get_sll != null && ['awaiting_payment', 'cancelled'].indexOf(o.status) < 0) {
      payLine = '<br><span class="hint">You get Le ' + fmt(o.you_get_sll) + (o.commission_sll ? ' (Le ' + fmt(o.commission_sll) + ' SalonAutoZone commission)' : '') + '. ' +
       (o.shop_paid ? '<b style="color:var(--ok)">Sent to you.</b>' : o.status === 'delivered' ? 'Delivered: we\'re sending it to your mobile money.' : 'We send it once the buyer has the parts.') + '</span>';
     }
     if (shop) {
      payLine = '<br><span class="hint">Buyer pays you Le ' + fmt(o.total_to_receive_sll) + ' (parts + delivery). You pay the rider Le ' + fmt(o.driver_payout_sll) + ', SalonAutoZone fee Le ' + fmt(o.platform_fee_sll) + ', you keep Le ' + fmt(o.you_keep_sll) + '.</span>';
      if (p && p.status === 'submitted') payLine += '<div class="notice notice-warn" style="margin-top:8px"><b>Check your phone:</b> ' + esc(p.method_label) + ' from ' + esc(p.payer_phone || 'the buyer') + ', transaction ID <b>' + esc(p.reference) + '</b>, for Le ' + fmt(p.amount_sll) + '.</div>';
     }
     var payOps = (shop && p && p.status === 'submitted') ? '<button class="btn btn-primary" data-pay-ok="' + p.id + '">Money arrived</button><button class="btn btn-ghost" data-pay-no="' + p.id + '">Not on my phone</button>' : '';
     return item({ noimg: true, title: 'Order ' + o.code, href: '#',
      meta: '<span class="tag ' + s[1] + '">' + esc(s[0]) + '</span> Le ' + fmt(shop ? o.total_to_receive_sll : o.parts_total_sll) + ', ' + esc(when(o.created_at)),
      extra: '<p class="msg">' + items + (o.pickup_area ? '<br><span class="hint">Pickup from ' + esc(o.pickup_area) + '</span>' : '') + payLine + '</p>',
      ops: payOps + (o.status === 'confirmed' ? '<button class="btn btn-primary" data-ready="' + o.id + '">The parts are ready for pickup</button>' : '') +
       '<a class="btn btn-ghost" href="/receipt?id=' + encodeURIComponent(o.id) + '&copy=store">Sales slip</a>' });
    }).join('') + '</div>';
   });
  },
  enquiries: function () {
   return Promise.all([api('/api/my-account/received-inquiries'), api('/api/my-account/my-inquiries')]).then(function (r) {
    var got = r[0].inquiries || [], sent = r[1].inquiries || [];
    if (!got.length && !sent.length) return empty('No enquiries yet', 'Messages from buyers about your listings, and the ones you send, show up here.', '');
    var h = '';
    if (got.length) h += '<h2 style="font-size:20px;margin:4px 0 10px">From buyers</h2><div class="list">' + got.map(function (i) {
     var phone = String(i.buyer_phone || '').replace(/[^\d+]/g, '');
     return item({ noimg: true, href: (i.listing_type === 'part' ? '/part/' : '/vehicle/') + i.listing_id, title: i.listing_title || 'Your listing',
      meta: esc(i.buyer_name || 'A buyer') + ', ' + esc(when(i.created_at)), extra: i.buyer_message ? '<p class="msg">' + esc(i.buyer_message) + '</p>' : '',
      ops: phone ? '<a class="btn btn-wa" href="https://wa.me/' + esc(phone.replace(/^\+/, '')) + '" target="_blank" rel="noopener">Reply on WhatsApp</a><a class="btn btn-ghost" href="tel:' + esc(phone) + '">Call</a>' : '' });
    }).join('') + '</div>';
    if (sent.length) h += '<h2 style="font-size:20px;margin:20px 0 10px">You sent</h2><div class="list">' + sent.map(function (i) {
     return item({ noimg: true, href: (i.listing_type === 'part' ? '/part/' : '/vehicle/') + i.listing_id, title: i.listing_title || 'Listing', meta: esc(when(i.created_at)), extra: i.buyer_message ? '<p class="msg">' + esc(i.buyer_message) + '</p>' : '' });
    }).join('') + '</div>';
    return h;
   });
  },
  saved: function () {
   return api('/api/my-account/saved').then(function (d) {
    var list = d.items || [];
    if (!list.length) return empty('Nothing saved yet', 'Tap the heart on a part or car to keep it here.', '<a class="btn btn-primary" href="/">Browse</a>');
    return '<div class="list">' + list.map(function (s) {
     return item({ img: s.listing_image_url, href: (s.listing_type === 'part' ? '/part/' : '/vehicle/') + s.listing_id, title: s.listing_title || (s.listing_type === 'part' ? 'Part' : 'Car'),
      meta: s.listing_price_sll ? 'Le ' + fmt(s.listing_price_sll) : '', ops: '<button class="btn btn-ghost" data-unsave="' + s.id + '">Remove</button>' });
    }).join('') + '</div>';
   });
  },
  requests: function () {
   return api('/api/my-account/my-import-requests').then(function (d) {
    var list = d.requests || [];
    if (!list.length) return empty('No import requests', 'Can\'t find a part locally? We can source it from abroad.', '<a class="btn btn-primary" href="/?action=import">Order a part from abroad</a>');
    return '<div class="list">' + list.map(function (r) {
     var quote = r.quoted_price_sll ? 'Quoted Le ' + fmt(r.quoted_price_sll) + (r.estimated_days ? ', about ' + r.estimated_days + ' days' : '') : 'Waiting for a quote';
     return item({ noimg: true, title: r.part_name || 'Part', meta: esc([r.car_year, r.car_make, r.car_model].filter(Boolean).join(' ')) + ', ' + esc(when(r.created_at)),
      extra: '<p class="msg"><span class="tag ' + (r.quoted_price_sll ? '' : 'gold') + '">' + esc(r.status || 'open') + '</span>' + esc(quote) + '</p>' + (r.admin_notes ? '<p class="msg hint">' + esc(r.admin_notes) + '</p>' : '') });
    }).join('') + '</div>';
   });
  }
 };
 function statsBox(st) {
  var t = st.this_month, l = st.last_month;
  function cell(n, label, prev) {
   var diff = prev != null && prev > 0 ? Math.round((n - prev) / prev * 100) : null;
   return '<div><b style="display:block;font-size:22px">' + fmt(n) + '</b><small class="hint">' + label + (diff != null ? ' <span style="color:' + (diff >= 0 ? 'var(--ok)' : 'var(--bad)') + '">' + (diff >= 0 ? '+' : '') + diff + '%</span>' : '') + '</small></div>';
  }
  return '<div class="box" style="margin-bottom:14px"><h2 style="font-size:17px;margin:0 0 10px">Your shop in ' + esc(st.month) + '</h2>' +
   '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:12px">' +
   cell(t.views, 'views of your shop and parts', l.views) + cell(t.people, 'people', l.people) +
   cell(t.contacts, 'WhatsApp and call taps', l.contacts) + cell(t.orders, 'paid orders', l.orders) +
   '<div><b style="display:block;font-size:22px">Le ' + fmt(t.sales_sll) + '</b><small class="hint">sales</small></div></div>' +
   ((st.top_parts || []).length ? '<p class="hint" style="margin:10px 0 0">Most viewed: ' + st.top_parts.map(function (p) { return esc(p.name) + ' (' + p.views + ')'; }).join(', ') + '</p>' : '') +
   '<p class="hint" style="margin:6px 0 0">Compared with last month. Counted by SalonAutoZone; no outside trackers.</p></div>';
 }
 function payBox(ps) {
  var v = function (x) { return x == null ? '' : esc(x); };
  var pinTxt = ps.has_pin ? '<b style="color:var(--ok)">Shop location set.</b> <a href="https://www.openstreetmap.org/?mlat=' + ps.shop_lat + '&mlon=' + ps.shop_lng + '#map=17/' + ps.shop_lat + '/' + ps.shop_lng + '" target="_blank" rel="noopener noreferrer">Check it on the map</a>'
   : '<b style="color:#7a4b00">Not set yet.</b> Until you set it, buyers see a rough delivery price.';
  return '<details class="box" style="margin-bottom:14px"' + (ps.ready ? '' : ' open') + '><summary style="cursor:pointer;font-weight:800">Your payout number and shop location ' + (ps.ready ? '<span class="tag">Done</span>' : '<span class="tag gold">Set this up</span>') + '</summary>' +
   '<p class="hint" style="margin:8px 0">Buyers pay SalonAutoZone. Once the buyer has the parts, we pay the rider and send you your money (the parts price, less our commission) to the number below.</p>' +
   '<form id="payf" style="display:grid;gap:10px">' +
   '<label class="field"><span>Orange Money number we pay you on</span><input class="input" name="pay_orange_money" type="tel" value="' + v(ps.pay_orange_money) + '" placeholder="076 123 456"></label>' +
   '<label class="field"><span>Afrimoney number (optional)</span><input class="input" name="pay_afrimoney" type="tel" value="' + v(ps.pay_afrimoney) + '" placeholder="030 123 456"></label>' +
   '<div class="field"><span>Shop location (where riders collect)</span><p class="hint" style="margin:2px 0 6px">Delivery is priced by distance from your shop to the buyer, so buyers near you pay less. Stand inside your shop and tap the button.</p>' +
   '<p class="hint" id="pin-txt" style="margin:0 0 6px">' + pinTxt + '</p>' +
   '<input type="hidden" name="shop_lat" value="' + v(ps.shop_lat) + '"><input type="hidden" name="shop_lng" value="' + v(ps.shop_lng) + '">' +
   '<button class="btn btn-ghost" type="button" id="pin-shop">' + (ps.has_pin ? 'Update to where I am now' : 'Use my current location') + '</button></div>' +
   '<button class="btn btn-primary" type="submit">Save</button></form></details>';
 }
 var current = 'orders';
 function show(tab) {
  current = tab;
  document.querySelectorAll('#tabs button').forEach(function (b) { b.setAttribute('aria-selected', b.dataset.tab === tab); });
  try { history.replaceState(null, '', '/my-account?tab=' + tab); } catch (e) {}
  panel.innerHTML = '<div class="lcard skeleton" style="min-height:90px"></div>';
  loaders[tab]().then(function (h) { if (current === tab) panel.innerHTML = h; })
   .catch(function (e) { if (e && current === tab) panel.innerHTML = '<div class="notice notice-bad">We couldn\'t load this. Try again in a moment.</div>'; });
 }
 document.querySelectorAll('#tabs button').forEach(function (b) { b.addEventListener('click', function () { show(b.dataset.tab); }); });

 panel.addEventListener('submit', function (e) {
  if (e.target.id !== 'payf') return;
  e.preventDefault();
  var f = e.target, body = {};
  ['pay_orange_money', 'pay_afrimoney'].forEach(function (k) { body[k] = f[k].value.trim() || null; });
  if (f.shop_lat.value && f.shop_lng.value) { body.shop_lat = Number(f.shop_lat.value); body.shop_lng = Number(f.shop_lng.value); }
  if (!body.pay_orange_money && !body.pay_afrimoney) { toast('Add at least one mobile money number', 'error'); return; }
  api('/api/businesses/mine/payments', { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) })
   .then(function (d) { toast(d.has_pin ? 'Saved. Delivery from your shop is now priced by distance.' : 'Saved. Set your shop location too, so buyers get the right delivery price.', 'success'); show('sales'); })
   .catch(function (err) { if (err) toast(/object/i.test(err.message) ? 'Check the numbers (a Sierra Leone mobile number like 076 123 456) and that your location is in Sierra Leone.' : err.message, 'error'); });
 });

 panel.addEventListener('click', function (e) {
  var ps = e.target.closest('#pin-shop');
  if (ps) {
   var txt = document.getElementById('pin-txt'), f = document.getElementById('payf');
   if (!navigator.geolocation) { txt.textContent = 'Your phone can\'t share its location here.'; return; }
   ps.disabled = true; txt.textContent = 'Finding your location…';
   navigator.geolocation.getCurrentPosition(function (p) {
    f.shop_lat.value = Math.round(p.coords.latitude * 1e6) / 1e6; f.shop_lng.value = Math.round(p.coords.longitude * 1e6) / 1e6;
    ps.disabled = false;
    txt.innerHTML = '<b style="color:var(--ok)">Got it</b> (accurate to about ' + Math.round(p.coords.accuracy) + ' m). Tap Save.';
   }, function () { ps.disabled = false; txt.textContent = 'We couldn\'t get your location. Allow location access for this site and try again.'; }, { enableHighAccuracy: true, timeout: 20000 });
   return;
  }
  var rp = e.target.closest('[data-rider-paid]');
  if (rp) {
   var ref = prompt('Transaction ID of the payment to the rider (optional)', '');
   if (ref === null) return;
   rp.disabled = true;
   api('/api/shop/seller/rider-payouts/' + rp.dataset.riderPaid + '/paid', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ reference: ref.trim() || null }) })
    .then(function () { toast('Thanks. The rider can see they\'ve been paid.', 'success'); show('sales'); })
    .catch(function (err) { rp.disabled = false; if (err) toast(err.message, 'error'); });
   return;
  }
  var pok = e.target.closest('[data-pay-ok]'), pno = e.target.closest('[data-pay-no]');
  if (pok) {
   if (!confirm('Is the money on your phone, for the full amount?')) return;
   pok.disabled = true;
   api('/api/pay/seller/payments/' + pok.dataset.payOk + '/approve', { method: 'POST' }).then(function () { toast('Payment confirmed. Get the parts ready.', 'success'); show('sales'); })
    .catch(function (err) { pok.disabled = false; if (err) toast(err.message, 'error'); });
   return;
  }
  if (pno) {
   var why = prompt('What should we tell the buyer?', 'No payment with this transaction ID came to my phone.');
   if (!why || why.trim().length < 3) return;
   pno.disabled = true;
   api('/api/pay/seller/payments/' + pno.dataset.payNo + '/reject', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ reason: why.trim() }) })
    .then(function () { toast('The buyer will see your message and can try again.', 'success'); show('sales'); })
    .catch(function (err) { pno.disabled = false; if (err) toast(err.message, 'error'); });
   return;
  }
  var ready = e.target.closest('[data-ready]');
  if (ready) {
   ready.disabled = true;
   api('/api/shop/seller/orders/' + ready.dataset.ready + '/ready', { method: 'POST' }).then(function () { toast('Marked ready. A driver will collect the parts.', 'success'); show('sales'); })
    .catch(function (err) { ready.disabled = false; if (err) toast(err.message, 'error'); });
   return;
  }
  var del = e.target.closest('[data-del]'), sold = e.target.closest('[data-sold]'), uns = e.target.closest('[data-unsave]');
  if (del) {
   if (!confirm('Delete this listing? Buyers will no longer see it.')) return;
   del.disabled = true;
   api('/api/my-account/' + del.dataset.del + '/' + del.dataset.id, { method: 'DELETE' }).then(function () { toast('Listing deleted', 'success'); show('listings'); })
    .catch(function (err) { del.disabled = false; if (err) toast(err.message, 'error'); });
  } else if (sold) {
   sold.disabled = true;
   api('/api/vehicles/' + sold.dataset.sold + '/sold', { method: 'POST' }).then(function () { toast('Marked as sold', 'success'); show('listings'); })
    .catch(function (err) { sold.disabled = false; if (err) toast(err.message, 'error'); });
  } else if (uns) {
   uns.disabled = true;
   api('/api/my-account/saved/' + uns.dataset.unsave, { method: 'DELETE' }).then(function () { show('saved'); })
    .catch(function (err) { uns.disabled = false; if (err) toast(err.message, 'error'); });
  }
 });

 var start = new URLSearchParams(location.search).get('tab');
 show(loaders[start] ? start : 'orders');
})();
</script>
</body>
</html>
