<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Storefront · SalonAutoZone</title>
<link rel="icon" type="image/png" href="/static/logo.png">
<style>
* { box-sizing: border-box; }
body { margin:0; font-family: Inter, system-ui, sans-serif; background:#f8fafc; color:#0f172a; }
.top { display:flex; align-items:center; gap:12px; padding:14px clamp(16px,5vw,56px); background:#fff; border-bottom:1px solid #e2e8f0; }
.brand { display:flex; align-items:center; gap:10px; text-decoration:none; color:#0f172a; font-weight:800; font-size:17px; }
.brand img { height:44px; width:44px; border-radius:50%; }
.brand span { color:#0f766e; }
.wrap { max-width: 1100px; margin: 0 auto; padding: 24px 16px 60px; }
.hero { background:#fff; border:1px solid #e2e8f0; border-radius:16px; padding:26px; display:flex; gap:22px; align-items:center; flex-wrap:wrap; }
.hero img.logo { width:96px; height:96px; border-radius:50%; object-fit:cover; background:#e2e8f0; }
.hero .meta { flex:1; min-width: 240px; }
.hero h1 { margin:0 0 6px; font-size:26px; display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
.badge { display:inline-flex; align-items:center; gap:4px; background:#d1fae5; color:#065f46; font-size:12px; font-weight:700; padding:4px 10px; border-radius:20px; }
.badge.unverified { background:#fef3c7; color:#92400e; }
.hero .meta p { margin:4px 0; color:#64748b; font-size:14px; }
.actions { display:flex; gap:10px; flex-wrap:wrap; margin-top:12px; }
.btn { display:inline-flex; align-items:center; gap:6px; padding:10px 16px; border-radius:8px; background:#0f766e; color:#fff; text-decoration:none; font-weight:700; font-size:14px; border:0; cursor:pointer; }
.btn.ghost { background:#fff; color:#0f766e; border:1px solid #0f766e; }
.btn.wa { background:#25d366; }
.section { margin-top: 32px; }
.section h2 { font-size:20px; margin:0 0 14px; }
.grid { display:grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap:16px; }
.card { background:#fff; border:1px solid #e2e8f0; border-radius:12px; overflow:hidden; text-decoration:none; color:inherit; display:flex; flex-direction:column; transition: box-shadow .15s; }
.card:hover { box-shadow: 0 8px 24px rgba(15,23,42,.08); }
.card .img { width:100%; height:160px; background:#e2e8f0; object-fit:cover; display:block; }
.card .body { padding:14px; flex:1; display:flex; flex-direction:column; }
.card .title { font-weight:700; font-size:15px; margin:0 0 4px; }
.card .sub { color:#64748b; font-size:13px; margin:0 0 8px; }
.card .price { color:#0f766e; font-weight:800; font-size:16px; margin-top:auto; }
.about { background:#fff; border:1px solid #e2e8f0; border-radius:12px; padding:20px; line-height:1.6; color:#334155; white-space: pre-wrap; }
.empty { color:#94a3b8; font-style:italic; padding: 20px; text-align:center; background:#fff; border:1px dashed #cbd5e1; border-radius: 12px; }
.loading { padding: 40px; text-align:center; color:#64748b; }
</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&display=swap" data-saz-font>
<link rel="stylesheet" href="/static/chrome.css?v=4">
<link rel="stylesheet" href="/static/legacy.css?v=4">
</head>
<body>

<div id="site-header"></div>

<div class="wrap" id="content">
  <div class="loading">Loading storefront...</div>
</div>

<script>
(function() {
  var wrap = document.getElementById('content');
  var slug = location.pathname.split('/').filter(Boolean).pop();

  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
  function fmtPrice(sll) {
    if (sll == null) return '';
    return 'SLL ' + Number(sll).toLocaleString('en-US', { maximumFractionDigits: 0 });
  }

  fetch('/api/businesses/' + encodeURIComponent(slug))
    .then(function(r) { if (!r.ok) throw new Error('Not found'); return r.json(); })
    .then(function(b) {
      // Handle both response shapes:
      // 1. { business: {...}, vehicles: [...], vehicle_count: N }
      // 2. { id, slug, name, ..., listings: { vehicles: [...] } }  (app/businesses.py)
      var biz = b.business || b;
      var vehicles = (b.vehicles) || (b.listings && b.listings.vehicles) || [];
      var parts = (b.listings && b.listings.parts) || [];

      var status = biz.status || (biz.verified ? 'verified' : 'pending');
      var verified = status === 'verified';
      var logo = biz.logo_url || '/static/logo.png';
      var wa = biz.whatsapp ? 'https://wa.me/' + biz.whatsapp.replace(/[^0-9]/g,'') : null;
      var mail = biz.email ? 'mailto:' + biz.email : null;
      var typeLabel = biz.type_label || biz.business_type || biz.type || '';

      var html = '';
      html += '<div class="hero">';
      html += '  <img class="logo" src="' + esc(logo) + '" alt="' + esc(biz.name) + '">';
      html += '  <div class="meta">';
      html += '    <h1>' + esc(biz.name) + (verified
                ? ' <span class="badge">&#10003; Verified</span>'
                : ' <span class="badge unverified">Unverified</span>') + '</h1>';
      html += '    <p>' + esc([biz.city, biz.country].filter(Boolean).join(', ')) + '</p>';
      if (typeLabel) html += '    <p>' + esc(typeLabel) + (biz.subscription_tier ? ' &middot; ' + esc(biz.subscription_tier) : '') + '</p>';
      if (biz.created_at) html += '    <p>Member since ' + esc(String(biz.created_at).slice(0, 10)) + '</p>';
      html += '    <div class="actions">';
      if (wa) html += '<a class="btn wa" href="' + esc(wa) + '" target="_blank" rel="noopener">WhatsApp</a>';
      if (mail) html += '<a class="btn" href="' + esc(mail) + '">Email</a>';
      html += '      <a class="btn ghost" href="/businesses">Browse all businesses</a>';
      html += '    </div>';
      html += '  </div>';
      html += '</div>';

      if (biz.description) {
        html += '<div class="section"><h2>About</h2><div class="about">' + esc(biz.description) + '</div></div>';
      }

      html += '<div class="section">';
      html += '  <h2>Listings (' + vehicles.length + (parts.length ? ' vehicles, ' + parts.length + ' parts' : '') + ')</h2>';
      if (vehicles.length === 0 && parts.length === 0) {
        html += '  <div class="empty">No listings yet.</div>';
      } else {
        html += '  <div class="grid">';
        vehicles.forEach(function(v) {
          var img = v.image_url || '/static/silhouettes/generic.svg';
          html += '<a class="card" href="/vehicle/' + esc(v.id) + '">';
          html += '  <img class="img" src="' + esc(img) + '" alt="">';
          html += '  <div class="body">';
          html += '    <div class="title">' + esc(v.title) + '</div>';
          html += '    <div class="sub">' + esc([v.year, v.make, v.model].filter(Boolean).join(' ')) + '</div>';
          if (v.location) html += '    <div class="sub">' + esc(v.location) + '</div>';
          if (v.price_sll) html += '    <div class="price">' + esc(fmtPrice(v.price_sll)) + '</div>';
          html += '  </div>';
          html += '</a>';
        });
        html += '  </div>';
      }
      html += '</div>';

      wrap.innerHTML = html;
    })
    .catch(function(e) {
      wrap.innerHTML = '<div class="empty">Storefront not found. <a href="/">Back to home</a></div>';
    });
})();
</script>
<script src="/static/site.js?v=4"></script>
</body>
</html>
