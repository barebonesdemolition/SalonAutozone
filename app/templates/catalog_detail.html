<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Import a part · SalonAutoZone</title>
<meta name="theme-color" content="#0e2a2b">
<link rel="icon" type="image/png" sizes="64x64" href="/static/icon-64.png">
<link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
<link rel="manifest" href="/static/manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&display=swap" data-saz-font media="print" onload="this.media='all'">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&display=swap"></noscript>
<link rel="stylesheet" href="/static/ui.css?v=7">
<link rel="stylesheet" href="/static/chrome.css?v=5">
<style>
.page { max-width: 760px; padding-bottom: 56px; }
.tag { display: inline-flex; font-size: 13px; font-weight: 800; padding: 3px 10px; border-radius: 999px; background: var(--gold-50); color: #8a5a00; margin-top: 18px; }
.page h1 { font-size: clamp(28px, 6vw, 38px); margin-top: 8px; }
.pn { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 18px; color: var(--teal); margin-top: 4px; word-break: break-all; }
.grid2 { display: grid; gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: var(--r-md); overflow: hidden; grid-template-columns: 1fr 1fr; margin: 18px 0; }
.grid2 div { background: var(--card); padding: 12px 14px; }
.grid2 span { display: block; font-size: 13px; color: var(--muted); }
.grid2 b { color: var(--ink); }
.steps { margin: 8px 0 0; padding-left: 20px; display: grid; gap: 6px; }
.acts { display: grid; gap: 10px; margin-top: 18px; }
@media (min-width: 560px) { .acts { grid-template-columns: 1fr 1fr; } }
</style>
</head>
<body>
<div id="site-header"></div>
<main class="wrap page" id="app"><div class="lcard skeleton" style="margin-top:22px;min-height:220px"></div></main>
<script src="/static/site.js?v=7"></script>
<script>
(function () {
 'use strict';
 var app = document.getElementById('app');
 var id = location.pathname.split('/').pop();
 function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }

 Promise.all([
  fetch('/api/unified/catalog/' + encodeURIComponent(id)).then(function (r) { return r.ok ? r.json() : null; }),
  fetch('/api/site/contact').then(function (r) { return r.ok ? r.json() : {}; }).catch(function () { return {}; })
 ]).then(function (res) {
  var p = res[0], contact = res[1] || {};
  if (!p) { app.innerHTML = '<div style="padding:64px 0;text-align:center"><h1 style="font-size:28px">Part not found</h1><a class="btn btn-primary" style="margin-top:14px" href="/">Search parts</a></div>'; return; }
  var cat = p.category || 'Car part', fits = p.vehicle_compatibility || 'Ask us to check';
  document.title = cat + ' ' + (p.part_number || '') + ' · SalonAutoZone';
  var quote = '/?import=' + encodeURIComponent(p.part_number || '') + '&part=' + encodeURIComponent(cat) + '&vehicle=' + encodeURIComponent(p.vehicle_compatibility || '');
  var wa = contact.whatsapp ? 'https://wa.me/' + encodeURIComponent(contact.whatsapp) + '?text=' + encodeURIComponent('Hello, I want to import part ' + (p.part_number || '') + ' (' + cat + '). Can you send me a price?') : '';
  app.innerHTML = '<div class="crumbs"><a href="/">Home</a><span>›</span><span>Import a part</span></div>' +
   '<span class="tag">Ordered from abroad</span><h1>' + esc(cat) + '</h1><div class="pn">' + esc(p.part_number) + '</div>' +
   '<div class="grid2"><div><span>Fits</span><b>' + esc(fits) + '</b></div><div><span>Usual delivery time</span><b>7 to 14 days</b></div></div>' +
   '<div class="box"><h2>How importing works</h2><ol class="steps"><li>Ask for a price with your car details.</li><li>We check price and stock with the supplier and reply on WhatsApp, usually within a day.</li><li>You agree the price and pay.</li><li>We order the part and deliver it in Sierra Leone.</li></ol></div>' +
   '<div class="acts"><a class="btn btn-primary btn-lg" href="' + esc(quote) + '">Ask for a price</a>' +
   (wa ? '<a class="btn btn-wa btn-lg" href="' + esc(wa) + '" target="_blank" rel="noopener noreferrer">Ask on WhatsApp</a>' : '') + '</div>';
 }).catch(function () { app.innerHTML = '<div class="notice notice-bad" style="margin-top:22px">We couldn\'t load this part. Please refresh.</div>'; });
})();
</script>
</body>
</html>
