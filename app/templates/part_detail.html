<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Part · SalonAutoZone</title>
<meta name="theme-color" content="#0e2a2b">
<link rel="icon" type="image/png" href="/static/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&display=swap" data-saz-font>
<link rel="stylesheet" href="/static/ui.css?v=5">
<link rel="stylesheet" href="/static/chrome.css?v=4">
</head>
<body>
<svg style="display:none" xmlns="http://www.w3.org/2000/svg">
 <symbol id="i-part" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9 7 7M17 17l2.1 2.1M19.1 4.9 17 7M7 17l-2.1 2.1"/></symbol>
</svg>
<div id="site-header"></div>
<main class="wrap" id="app">
 <div class="detail"><div class="gallery lcard skeleton" style="border-radius:20px"></div><div class="lcard skeleton"></div></div>
</main>
<script src="/static/site.js?v=4"></script>
<script>
(function () {
 'use strict';
 var id = location.pathname.split('/').pop();
 var app = document.getElementById('app');
 function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
 function fmt(n) { return Number(n || 0).toLocaleString('en-GB'); }
 function safeUrl(u) { u = String(u || '').trim(); return (/^https?:\/\//i.test(u) || /^\/(?!\/)/.test(u)) ? u : ''; }
 function token() { try { return localStorage.getItem('token') || localStorage.getItem('access_token') || ''; } catch (e) { return ''; } }
 function auth() { var t = token(); return t ? { Authorization: 'Bearer ' + t } : {}; }
 function norm(s) { return String(s || '').trim().toLowerCase(); }
 function cap(s) { s = String(s || ''); return s.charAt(0).toUpperCase() + s.slice(1); }
 function toast(msg, type) {
  var t = document.getElementById('toast');
  if (!t) { t = document.createElement('div'); t.id = 'toast'; t.setAttribute('role', 'status'); document.body.appendChild(t); }
  t.className = 'toast ' + (type || ''); t.textContent = msg; void t.offsetWidth; t.classList.add('show');
  clearTimeout(t._t); t._t = setTimeout(function () { t.classList.remove('show'); }, 2600);
 }

 function notFound(msg) {
  app.innerHTML = '<div class="empty-state" style="padding:64px 0;text-align:center"><h1 style="font-size:28px">' + esc(msg) + '</h1><p class="muted" style="margin:8px 0 16px;color:var(--muted)">It may have been sold or removed.</p><a class="btn btn-primary" href="/">Browse parts</a></div>';
 }

 fetch('/api/parts/' + encodeURIComponent(id)).then(function (r) { return r.ok ? r.json() : null; }).then(function (p) {
  if (!p) return notFound('We couldn\'t find this part');
  var title = p.name || 'Part';
  document.title = title + ' · SalonAutoZone';
  var img = safeUrl(p.image_url || p.photo_url);
  var phone = String(p.contact_phone || '').replace(/[^\d+]/g, '');
  var wa = phone ? 'https://wa.me/' + phone.replace(/^\+/, '') + '?text=' + encodeURIComponent('Hi, is this still available? ' + title + ' on SalonAutoZone: ' + location.href) : '';
  var fits = [p.compatible_make, p.compatible_model].filter(Boolean).join(' ');
  var stock = Number(p.stock_quantity || 0);

  var facts = [['Condition', cap(p.condition)], ['Category', p.category], ['Fits', fits || 'Ask the seller'], ['In stock', stock ? stock + (stock === 1 ? ' left' : ' available') : 'Out of stock'], ['Location', p.location]]
   .filter(function (f) { return f[1]; });

  app.innerHTML =
   '<nav class="crumbs" aria-label="Breadcrumb"><a href="/">Parts</a><span>/</span>' + (p.category ? '<a href="/?cat=' + encodeURIComponent(p.category) + '">' + esc(p.category) + '</a><span>/</span>' : '') + '<span>' + esc(title) + '</span></nav>' +
   '<div class="detail">' +
     '<div class="gallery">' + (img ? '<img src="' + esc(img) + '" alt="' + esc(title) + '">' : '<svg aria-hidden="true"><use href="#i-part"/></svg>') + '</div>' +
    '<aside class="buybox">' +
     '<h1>' + esc(title) + '</h1>' +
     '<div><div class="big-price"><small>SLL</small>' + fmt(p.price_sll) + '</div>' + (p.price_usd ? '<div class="sub-price">About $' + fmt(p.price_usd) + '</div>' : '') + '</div>' +
     '<div class="box" id="fit-box"><h2>Will it fit?</h2><p id="fit-body" class="muted">Checking your car…</p></div>' +
     '<dl class="facts">' + facts.map(function (f) { return '<div><dt>' + esc(f[0]) + '</dt><dd>' + esc(f[1]) + '</dd></div>'; }).join('') + '</dl>' +
     '<div class="cta-row">' +
      '<button type="button" class="btn btn-primary btn-lg wide" id="btn-cart"' + (stock ? '' : ' disabled') + '>' + (stock ? 'Add to cart' : 'Out of stock') + '</button>' +
      (wa ? '<a class="btn btn-wa btn-lg wide" href="' + esc(wa) + '" target="_blank" rel="noopener">Ask the seller on WhatsApp</a>' : '') +
      '<button type="button" class="btn btn-ghost" id="btn-save">Save</button>' +
      '<button type="button" class="btn btn-ghost" id="btn-share">Share</button>' +
     '</div>' +
     '<p class="hint">Pay on delivery or by mobile money at checkout. Always check the part number with the seller before you pay.</p>' +
    '</aside>' +
    '<div class="more">' +
     (p.description ? '<section class="box"><h2>About this part</h2><p style="white-space:pre-line">' + esc(p.description) + '</p></section>' : '') +
    '</div>' +
   '</div>' +
   '<h2 class="section-title" id="similar-title" hidden>More ' + esc(p.category || 'parts') + '</h2><div class="listing-grid" id="similar"></div>';

  document.body.insertAdjacentHTML('beforeend',
   '<div class="sticky-cta"><span class="price-mini">SLL ' + fmt(p.price_sll) + '</span>' +
   (wa ? '<a class="btn btn-wa" href="' + esc(wa) + '" target="_blank" rel="noopener" aria-label="WhatsApp the seller">WhatsApp</a>' : '') +
   '<button type="button" class="btn btn-primary" id="btn-cart-2"' + (stock ? '' : ' disabled') + '>Add to cart</button></div>');
  document.body.classList.add('has-sticky-cta');

  // ---- fit check ----
  var fitBody = document.getElementById('fit-body');
  function checkFit(cars) {
   var make = norm(p.compatible_make), model = norm(p.compatible_model);
   if (!make && !model) { fitBody.innerHTML = 'The seller didn\'t say which cars this fits. Ask them before you buy.'; return; }
   if (!cars || !cars.length) {
    fitBody.innerHTML = 'Listed for <b>' + esc(fits) + '</b>. <a href="/">Add your car</a> to check it against yours.'; return;
   }
   var hits = cars.filter(function (c) {
    var cm = norm(c.make), cmo = norm(c.model);
    if (make && make !== 'any' && cm && cm.indexOf(make) < 0 && make.indexOf(cm) < 0) return false;
    if (model && cmo && cmo.indexOf(model) < 0 && model.indexOf(cmo) < 0) return false;
    return true;
   });
   if (hits.length) {
    fitBody.className = '';
    fitBody.innerHTML = '<span class="fit-yes">Likely fits your ' + esc(hits.map(function (c) { return [c.year, c.make, c.model].join(' '); }).join(', ')) + '</span><br><span class="hint">Confirm with the seller before you buy.</span>';
   } else {
    fitBody.className = '';
    fitBody.innerHTML = '<span class="fit-no">Listed for ' + esc(fits) + ', which doesn\'t match your car.</span> <a href="/garage">Manage my cars</a>';
   }
  }
  var local = null;
  try { local = JSON.parse(localStorage.getItem('fitmentVehicle') || 'null'); } catch (e) {}
  if (token()) {
   fetch('/api/garage/', { headers: auth() }).then(function (r) { return r.ok ? r.json() : []; })
    .then(function (cars) { checkFit(cars && cars.length ? cars : (local && local.make ? [local] : [])); })
    .catch(function () { checkFit(local && local.make ? [local] : []); });
  } else checkFit(local && local.make ? [local] : []);

  // ---- actions ----
  function addToCart() {
   try {
    var cart = JSON.parse(localStorage.getItem('saz_cart') || '[]');
    var existing = cart.find(function (x) { return x.part_id === Number(id); });
    if (existing) existing.qty = Math.min(20, stock || 20, existing.qty + 1);
    else cart.push({ part_id: Number(id), qty: 1, name: title, price_sll: Number(p.price_sll || 0), image_url: p.image_url || null });
    localStorage.setItem('saz_cart', JSON.stringify(cart));
    document.dispatchEvent(new CustomEvent('saz-cart-change', { detail: cart }));
    toast('Added to cart', 'success');
   } catch (e) { toast('Could not add to cart', 'error'); }
  }
  document.getElementById('btn-cart').onclick = addToCart;
  document.getElementById('btn-cart-2').onclick = addToCart;
  document.getElementById('btn-share').onclick = function () {
   var text = title + ' · SLL ' + fmt(p.price_sll);
   if (navigator.share) { navigator.share({ title: title, text: text, url: location.href }).catch(function () {}); return; }
   window.open('https://wa.me/?text=' + encodeURIComponent(text + '\n' + location.href), '_blank', 'noopener');
  };
  document.getElementById('btn-save').onclick = function () {
   var b = this;
   if (!token()) { location.href = '/login?next=' + encodeURIComponent(location.pathname); return; }
   fetch('/api/my-account/saved', { method: 'POST', headers: Object.assign({ 'Content-Type': 'application/json' }, auth()), body: JSON.stringify({ listing_type: 'part', listing_id: Number(id) }) })
    .then(function (r) {
     if (r.status === 401) { location.href = '/login?next=' + encodeURIComponent(location.pathname); return; }
     if (r.ok) { b.textContent = 'Saved'; toast('Saved', 'success'); } else toast('Could not save', 'error');
    });
  };
  fetch('/api/parts/' + encodeURIComponent(id) + '/view', { method: 'POST' }).catch(function () {});

  // ---- similar parts ----
  if (p.category) {
   fetch('/api/unified/parts?category=' + encodeURIComponent(p.category)).then(function (r) { return r.ok ? r.json() : null; }).then(function (d) {
    var list = ((d && d.local_parts) || []).filter(function (x) { return String(x.id) !== String(id); }).slice(0, 4);
    if (!list.length) return;
    document.getElementById('similar-title').hidden = false;
    document.getElementById('similar').innerHTML = list.map(function (x) {
     var u = safeUrl(x.image_url);
     return '<a class="lcard" href="/part/' + encodeURIComponent(x.id) + '">' +
      (u ? '<div class="ph" style="background-image:url(\'' + esc(u) + '\')"></div>' : '<div class="ph"><svg aria-hidden="true"><use href="#i-part"/></svg></div>') +
      '<div class="bd"><div class="price"><small>SLL</small>' + fmt(x.price_sll) + '</div><div class="ttl">' + esc(x.name) + '</div><div class="meta">' + (x.location ? '<span class="loc">' + esc(x.location) + '</span>' : '') + '</div></div></a>';
    }).join('');
   }).catch(function () {});
  }
 }).catch(function () { notFound('We couldn\'t load this part'); });
})();
</script>
</body>
</html>
