<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Supplier catalogue · SalonAdmin</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0e2a2b">
<link rel="icon" type="image/png" sizes="64x64" href="/static/icon-64.png">
<link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
<link rel="manifest" href="/static/manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&display=swap" data-saz-font media="print" onload="this.media='all'">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&display=swap"></noscript>
<link rel="stylesheet" href="/static/ui.css?v=6">
<link rel="stylesheet" href="/static/chrome.css?v=5">
<style>
.page { max-width: 860px; padding: 22px 16px 56px; }
.page h1 { font-size: clamp(26px, 6vw, 34px); }
.back { display: inline-block; font-size: 14px; color: var(--muted); text-decoration: none; margin-bottom: 8px; }
.back:hover { color: var(--teal); }
.lead { color: var(--muted); margin: 4px 0 18px; }
.stack { display: grid; gap: 14px; }
.nums { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: var(--r-md); overflow: hidden; }
.nums div { background: var(--card); padding: 14px; }
.nums b { display: block; font-size: 26px; color: var(--ink); font-variation-settings: "wdth" 85; }
.nums span { font-size: 13px; color: var(--muted); }
.drop { display: flex; flex-direction: column; align-items: center; gap: 6px; text-align: center; border: 2px dashed var(--line); border-radius: var(--r-md); padding: 28px 16px; cursor: pointer; background: var(--paper); }
.drop:hover, .drop.over { border-color: var(--teal); background: var(--teal-50); }
.drop b { color: var(--ink); font-size: 17px; }
.drop svg { width: 34px; height: 34px; color: var(--teal); }
.file { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-top: 12px; font-weight: 600; }
.mode { display: grid; gap: 8px; margin-top: 14px; }
.mode label { display: flex; gap: 10px; align-items: flex-start; border: 1.5px solid var(--line); border-radius: var(--r-md); padding: 10px 12px; cursor: pointer; }
.mode label:has(input:checked) { border-color: var(--teal); background: var(--teal-50); }
.mode input { margin-top: 4px; accent-color: var(--teal); }
.mode b { display: block; color: var(--ink); }
.mode small { color: var(--muted); }
.fmt { font-family: ui-monospace, Menlo, monospace; font-size: 13px; background: var(--paper); border: 1px solid var(--line); border-radius: var(--r-sm); padding: 10px 12px; overflow-x: auto; white-space: pre; margin-top: 8px; }
.cats { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
.cats .chip { min-height: 34px; }
.cats .chip span { color: var(--muted); font-weight: 600; }
.cats .chip[aria-pressed="true"] { background: var(--ink); color: #fff; border-color: var(--ink); }
.cats .chip[aria-pressed="true"] span { color: #a9c4c2; }
.rows { margin-top: 10px; }
.row { display: flex; justify-content: space-between; gap: 12px; padding: 10px 0; border-top: 1px solid var(--line); text-decoration: none; color: inherit; }
.row:first-child { border-top: 0; }
.row:hover b { color: var(--teal); }
.row b { font-family: ui-monospace, Menlo, monospace; color: var(--ink); }
.row span { color: var(--muted); font-size: 14px; text-align: right; }
</style>
</head>
<body data-tabbar="off">
<div id="site-header"></div>
<main class="wrap page">
 <a class="back" href="/admin/dashboard">← Admin dashboard</a>
 <h1>Supplier catalogue</h1>
 <p class="lead">Parts your suppliers can send from abroad. Buyers find them in search and ask you for a price.</p>
 <div id="app" class="stack"></div>
</main>
<script src="/static/site.js?v=6"></script>
<script>
(function () {
 'use strict';
 var app = document.getElementById('app');
 var key = '', token = '';
 try { key = sessionStorage.getItem('adminKey') || ''; token = localStorage.getItem('token') || localStorage.getItem('access_token') || ''; } catch (e) {}
 function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
 function fmt(n) { return Number(n || 0).toLocaleString('en-GB'); }
 function headers() { var h = {}; if (key) h['X-Admin-Key'] = key; if (token) h['Authorization'] = 'Bearer ' + token; return h; }
 function getJSON(u) { return fetch(u).then(function (r) { return r.ok ? r.json() : null; }).catch(function () { return null; }); }

 if (!key && !token) {
  app.innerHTML = '<div class="box"><h2>Admins only</h2><p>Log in to the admin dashboard first.</p><a class="btn btn-primary" style="margin-top:12px" href="/admin/login">Admin log in</a></div>';
  return;
 }

 app.innerHTML =
  '<div class="nums"><div><b id="s-total">–</b><span>parts</span></div><div><b id="s-cats">–</b><span>categories</span></div><div><b id="s-veh">–</b><span>vehicles</span></div></div>' +
  '<div class="box"><h2>Import a file</h2>' +
  '<label class="drop" id="drop"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 16V4M7 9l5-5 5 5"/><path d="M4 16v3a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-3"/></svg>' +
  '<b>Choose a CSV file</b><span class="hint" style="margin:0">or drop it here. Save from Excel or Google Sheets as .csv</span><input type="file" id="file" accept=".csv,text/csv" hidden></label>' +
  '<div class="file" id="fname" hidden></div>' +
  '<div class="mode"><label><input type="radio" name="mode" value="add" checked><span><b>Add new parts</b><small>Keeps what\'s there. Part numbers already in the catalogue are skipped.</small></span></label>' +
  '<label><input type="radio" name="mode" value="replace"><span><b>Replace the whole catalogue</b><small>Deletes every part first. Use when the supplier sends a full new list.</small></span></label></div>' +
  '<button class="btn btn-primary btn-block" style="margin-top:14px" id="go" type="button" disabled>Import</button><div id="res"></div>' +
  '<details style="margin-top:14px"><summary class="hint" style="cursor:pointer">What should the file look like?</summary>' +
  '<p class="hint">A category name on its own line, then one part per line: part number, vehicle, brand, price in SLL. Up to three brand and price pairs per line.</p>' +
  '<div class="fmt">Brake pads\nPart Number,Vehicle,Brand,Price SLL,Price CAD\n04465-02220,Toyota Corolla 2007-2013,Akebono,450000,25</div></details></div>' +
  '<div class="box"><h2>In the catalogue</h2><input class="input" id="q" type="search" placeholder="Search part number, car or brand" style="margin-top:6px"><div class="cats" id="cats"></div><div class="rows" id="rows"></div></div>';

 var file = null, drop = document.getElementById('drop'), go = document.getElementById('go'), res = document.getElementById('res');
 function pick(f) {
  res.innerHTML = '';
  if (!f) return;
  if (!/\.csv$/i.test(f.name)) { file = null; go.disabled = true; res.innerHTML = '<div class="notice notice-bad" style="margin-top:12px">That\'s not a .csv file. In Excel use File, Save as, CSV.</div>'; return; }
  file = f; go.disabled = false;
  var el = document.getElementById('fname'); el.hidden = false;
  el.innerHTML = '<span>' + esc(f.name) + '</span><span class="hint" style="margin:0">' + (f.size / 1024).toFixed(1) + ' KB</span>';
 }
 document.getElementById('file').addEventListener('change', function (e) { pick(e.target.files[0]); });
 ['dragenter', 'dragover'].forEach(function (t) { drop.addEventListener(t, function (e) { e.preventDefault(); drop.classList.add('over'); }); });
 ['dragleave', 'drop'].forEach(function (t) { drop.addEventListener(t, function (e) { e.preventDefault(); drop.classList.remove('over'); }); });
 drop.addEventListener('drop', function (e) { pick(e.dataTransfer.files[0]); });

 go.addEventListener('click', function () {
  if (!file) return;
  var replace = document.querySelector('input[name=mode]:checked').value === 'replace';
  if (replace && go.dataset.sure !== '1') { go.dataset.sure = '1'; go.textContent = 'Tap again to delete the old catalogue and import'; go.classList.add('btn-dark'); return; }
  go.disabled = true; go.textContent = 'Importing…';
  var fd = new FormData(); fd.append('file', file);
  fetch('/api/catalog/upload?replace=' + replace, { method: 'POST', headers: headers(), body: fd })
   .then(function (r) { return r.json().catch(function () { return {}; }).then(function (d) { if (r.status === 401 || r.status === 403) throw new Error('Your admin login has ended. Log in again from the admin dashboard.'); if (!r.ok) throw new Error(typeof d.detail === 'string' ? d.detail : 'The import failed.'); return d; }); })
   .then(function (d) {
    res.innerHTML = '<div class="notice notice-ok" style="margin-top:12px"><b>' + fmt(d.imported) + ' part' + (d.imported === 1 ? '' : 's') + ' added.</b>' + (d.skipped ? ' ' + fmt(d.skipped) + ' already in the catalogue were skipped.' : '') + '</div>';
    file = null; document.getElementById('file').value = ''; document.getElementById('fname').hidden = true;
    load();
   })
   .catch(function (e) { res.innerHTML = '<div class="notice notice-bad" style="margin-top:12px">' + esc(e.message) + '</div>'; })
   .then(function () { go.textContent = 'Import'; go.dataset.sure = ''; go.classList.remove('btn-dark'); go.disabled = !file; });
 });

 var cat = '', rows = document.getElementById('rows'), q = document.getElementById('q'), t = null;
 function show(items) {
  rows.innerHTML = items && items.length ? items.map(function (i) {
   return '<a class="row" href="/catalog/' + i.id + '" target="_blank" rel="noopener"><b>' + esc(i.part_number) + '</b><span>' + esc([i.category, i.vehicle_compatibility].filter(Boolean).join(' · ')) + '</span></a>';
  }).join('') : '<p class="hint">Nothing here yet.</p>';
 }
 function list() {
  var term = q.value.trim();
  if (term) getJSON('/api/catalog/search?limit=50&q=' + encodeURIComponent(term)).then(function (d) { show(d && d.items); });
  else getJSON('/api/catalog/all?limit=50' + (cat ? '&category=' + encodeURIComponent(cat) : '')).then(function (d) { show(d && d.items); });
 }
 q.addEventListener('input', function () { clearTimeout(t); t = setTimeout(list, 250); });
 document.getElementById('cats').addEventListener('click', function (e) {
  var c = e.target.closest('.chip'); if (!c) return;
  cat = cat === c.dataset.c ? '' : c.dataset.c; q.value = '';
  this.querySelectorAll('.chip').forEach(function (x) { x.setAttribute('aria-pressed', String(x.dataset.c === cat)); });
  list();
 });
 function load() {
  getJSON('/api/catalog/stats').then(function (s) {
   if (!s) return;
   document.getElementById('s-total').textContent = fmt(s.total_parts);
   document.getElementById('s-cats').textContent = fmt(s.categories);
   document.getElementById('s-veh').textContent = fmt(s.vehicles);
  });
  getJSON('/api/catalog/categories').then(function (d) {
   var cs = (d && d.categories) || [];
   document.getElementById('cats').innerHTML = cs.map(function (c) { return '<button class="chip" type="button" data-c="' + esc(c.name) + '" aria-pressed="' + (c.name === cat) + '">' + esc(c.name) + ' <span>' + fmt(c.count) + '</span></button>'; }).join('');
  });
  list();
 }
 load();
})();
</script>
</body>
</html>
