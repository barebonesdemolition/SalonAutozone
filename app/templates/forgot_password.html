<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Forgot password · SalonAutoZone</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0e2a2b">
<link rel="icon" type="image/png" sizes="64x64" href="/static/icon-64.png">
<link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
<link rel="manifest" href="/static/manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&display=swap" data-saz-font media="print" onload="this.media='all'">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&display=swap"></noscript>
<link rel="stylesheet" href="/static/ui.css?v=7">
<link rel="stylesheet" href="/static/chrome.css?v=5">
<style>
.shell { display: flex; justify-content: center; padding: 28px 16px 56px; }
.card { width: 100%; max-width: 420px; }
.card h1 { font-size: 30px; font-variation-settings: "wdth" 78; }
.card .sub { color: var(--muted); margin-top: 6px; }
.steps { margin: 16px 0 0; padding-left: 20px; display: grid; gap: 6px; color: var(--text); }
.back { display: inline-block; margin-top: 18px; font-weight: 700; text-decoration: none; }
</style>
</head>
<body data-footer="off">
<div id="site-header"></div>
<main class="shell"><div class="card" id="app">
<h1>Forgot your password?</h1>
<p class="sub">Tell us the phone number or email on your account. We'll send you a link on WhatsApp to choose a new password.</p>
<form id="f" novalidate>
 <label class="field"><span>Phone or email</span><input class="input" id="who" required autocomplete="username" placeholder="+232 76 123456"></label>
 <button class="btn btn-primary btn-lg btn-block" style="margin-top:18px" type="submit" id="go">Send me a reset link</button>
 <div id="msg" aria-live="polite"></div>
</form>
<a class="back" href="/login">← Back to sign in</a>
</div></main>
<script src="/static/site.js?v=7"></script>
<script>
(function () {
 'use strict';

 function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
 function say(el, text, kind) { el.innerHTML = text ? '<div class="notice notice-' + (kind || 'bad') + '" style="margin-top:12px"></div>' : ''; if (text) el.firstChild.textContent = text; }
 function post(url, body, token) {
  var h = { 'Content-Type': 'application/json' }; if (token) h.Authorization = 'Bearer ' + token;
  return fetch(url, { method: 'POST', headers: h, body: JSON.stringify(body) }).then(function (r) {
   return r.json().catch(function () { return {}; }).then(function (d) {
    if (!r.ok) { var m = d.detail; if (Array.isArray(m)) m = 'Please check what you typed. Passwords need at least 8 characters.'; var e = new Error(typeof m === 'string' ? m : 'Something went wrong. Please try again.'); e.status = r.status; throw e; }
    return d;
   });
  }, function () { throw new Error('No connection. Check your internet and try again.'); });
 }
 function saveLogin(d) {
  try { localStorage.setItem('token', d.access_token); localStorage.setItem('access_token', d.access_token); if (d.user) localStorage.setItem('userInfo', JSON.stringify(d.user)); } catch (e) {}
 }

 var f = document.getElementById('f'), who = document.getElementById('who'), msg = document.getElementById('msg'), go = document.getElementById('go');
 try { var pre = sessionStorage.getItem('forgotWho'); if (pre) { who.value = pre; sessionStorage.removeItem('forgotWho'); } } catch (e) {}
 f.addEventListener('submit', function (e) {
  e.preventDefault();
  var v = who.value.trim();
  if (v.length < 3) return say(msg, 'Enter the phone number or email you signed up with.');
  go.disabled = true; say(msg, '');
  post('/api/auth/forgot', { identity: v }).then(function (d) {
   var wa = d.whatsapp ? 'https://wa.me/' + encodeURIComponent(d.whatsapp) + '?text=' + encodeURIComponent('Hello, I forgot my SalonAutoZone password. My account is ' + v + '.') : '';
   document.getElementById('app').innerHTML = '<h1>We\'ve got your request</h1>' +
    '<p class="sub">If there\'s an account for <b>' + esc(v) + '</b>, our team will send a reset link to its WhatsApp number, usually within a few hours.</p>' +
    '<ol class="steps"><li>Open the link we send you.</li><li>Choose a new password.</li><li>You\'re signed in straight away.</li></ol>' +
    (wa ? '<p class="sub" style="margin-top:18px">In a hurry? Message us and we\'ll do it now.</p><a class="btn btn-wa btn-lg btn-block" style="margin-top:10px" target="_blank" rel="noopener noreferrer" href="' + esc(wa) + '">Message us on WhatsApp</a>' : '') +
    '<a class="back" href="/login">← Back to sign in</a>';
  }).catch(function (err) { say(msg, err.message); go.disabled = false; });
 });

})();
</script>
</body>
</html>
