<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Deliver with SalonAutoZone</title>
<meta name="description" content="Deliver car parts across Sierra Leone with your okada or van and get paid for every delivery.">
<meta name="theme-color" content="#0e2a2b">
<link rel="icon" type="image/png" sizes="64x64" href="/static/icon-64.png">
<link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
<link rel="manifest" href="/static/manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&display=swap" data-saz-font media="print" onload="this.media='all'">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&display=swap"></noscript>
<link rel="stylesheet" href="/static/ui.css?v=8">
<link rel="stylesheet" href="/static/chrome.css?v=5">
<style>
.page { max-width: 560px; padding: 22px 16px 56px; }
.page h1 { font-size: clamp(28px, 7vw, 38px); }
.lead { color: var(--muted); font-size: 16px; margin: 4px 0 18px; }
.stack { display: grid; gap: 14px; }
.perks { display: grid; gap: 10px; grid-template-columns: repeat(3, 1fr); margin-bottom: 18px; }
.perks div { background: var(--card); border: 1px solid var(--line); border-radius: var(--r-md); padding: 12px; }
.perks b { display: block; color: var(--ink); font-size: 15px; }
.perks span { font-size: 13px; color: var(--muted); }
@media (max-width: 460px) { .perks { grid-template-columns: 1fr; } }
.vt { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.vt button { text-align: left; background: var(--card); border: 1.5px solid var(--line); border-radius: var(--r-md); padding: 12px 14px; font: inherit; color: inherit; cursor: pointer; }
.vt button b { display: block; color: var(--ink); }
.vt button small { color: var(--muted); font-size: 13px; }
.vt button[aria-pressed="true"] { border-color: var(--teal); background: var(--teal-50); box-shadow: 0 0 0 3px var(--teal-50); }
.st { display: inline-flex; font-size: 13px; font-weight: 800; padding: 3px 9px; border-radius: 6px; }
.st.ok { background: var(--ok-50); color: var(--ok); }
.st.wait { background: var(--gold-50); color: #8a5a00; }
.st.bad { background: var(--bad-50); color: var(--bad); }
.facts-list { display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; margin-top: 12px; font-size: 15px; }
.facts-list dt { color: var(--muted); }
.facts-list dd { margin: 0; font-weight: 600; color: var(--ink); }
.online { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 16px; border-radius: var(--r-md); background: var(--ink); color: #fff; margin-top: 14px; }
.online b { display: block; font-size: 17px; }
.online small { color: #a9c4c2; }
.dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; background: #6b7f7e; margin-right: 6px; }
.on .dot { background: #3ddc84; box-shadow: 0 0 0 4px rgba(61, 220, 132, .25); }
.switch { position: relative; width: 56px; height: 32px; border-radius: 999px; border: 0; background: #3b5556; cursor: pointer; flex-shrink: 0; }
.switch::after { content: ""; position: absolute; top: 4px; left: 4px; width: 24px; height: 24px; border-radius: 50%; background: #fff; transition: left .15s; }
.switch[aria-checked="true"] { background: #1f9d55; }
.switch[aria-checked="true"]::after { left: 28px; }
.nums { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: var(--r-md); overflow: hidden; }
.nums div { background: var(--card); padding: 12px; text-align: center; }
.nums b { display: block; font-size: 22px; color: var(--ink); font-variation-settings: "wdth" 85; }
.nums span { font-size: 13px; color: var(--muted); }
.job { border: 1px solid var(--line); border-radius: var(--r-md); padding: 14px; background: var(--card); }
.job + .job { margin-top: 10px; }
.job .top { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.job .code { font-family: ui-monospace, Menlo, monospace; font-weight: 700; color: var(--ink); }
.job .pay { font-weight: 800; font-size: 20px; color: var(--ok); font-variation-settings: "wdth" 85; }
.route { display: grid; gap: 4px; margin: 10px 0 12px; font-size: 15px; }
.route small { color: var(--muted); font-weight: 600; font-size: 13px; }
.leg { border-left: 3px solid var(--line); padding: 2px 0 2px 12px; margin-top: 10px; }
.leg.go { border-color: var(--teal); }
.leg small { display: block; color: var(--muted); font-weight: 700; font-size: 12px; text-transform: uppercase; letter-spacing: .04em; }
.leg b { color: var(--ink); }
.who { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-top: 8px; }
.who span { flex: 1 1 100%; font-size: 14px; color: var(--muted); }
.who .btn { min-height: 40px; padding: 8px 14px; }
.items { margin: 6px 0 0; padding-left: 18px; font-size: 14px; }
.pin { display: inline-block; font-size: 12px; font-weight: 800; padding: 2px 7px; border-radius: 6px; background: var(--gold-50); color: #7a4b00; }
.code-in { font-size: 24px; letter-spacing: .3em; text-align: center; font-family: ui-monospace, Menlo, monospace; }
.acts { display: grid; gap: 8px; margin-top: 12px; }
.empty { text-align: center; color: var(--muted); padding: 14px 0; font-size: 15px; }
.scan { border: 1.5px dashed var(--line); border-radius: var(--r-md); padding: 12px; margin-top: 8px; background: var(--paper); }
.scan.has { border-style: solid; border-color: var(--teal); }
.scan-top { display: flex; gap: 12px; align-items: center; margin-bottom: 10px; }
.scan-top b { display: block; color: var(--ink); }
.scan-top small { color: var(--muted); font-size: 13px; }
.scan-ph { width: 72px; height: 52px; flex-shrink: 0; border-radius: 8px; background: var(--teal-50) center / cover no-repeat; }
.scan-btn { gap: 8px; }
.scan-btn svg { color: var(--gold); }
.scan-st .notice { margin-top: 10px; }
.row2 { display: grid; gap: 0 12px; grid-template-columns: 1fr 1fr; }
@media (max-width: 460px) { .row2 { grid-template-columns: 1fr; } }
.spin { display: inline-block; width: 14px; height: 14px; border: 2px solid currentColor; border-right-color: transparent; border-radius: 50%; vertical-align: -2px; animation: sp .8s linear infinite; }
@keyframes sp { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div id="site-header"></div>
<main class="wrap page">
 <h1>Deliver with us</h1>
 <p class="lead">Deliver car parts with your okada or van and get paid for every drop.</p>
 <div id="app" class="stack"><div class="lcard skeleton" style="min-height:200px"></div></div>
</main>
<script src="/static/site.js?v=9"></script>
<script>
(function () {
 'use strict';
 var app = document.getElementById('app');
 var LABEL = { bike: 'Okada', van: 'Van' };
 var token = '', me = null, timer = null, flash = '';
 try { token = localStorage.getItem('token') || localStorage.getItem('access_token') || ''; } catch (e) {}

 function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
 function fmt(n) { return Number(n || 0).toLocaleString('en-GB'); }
 function toLogin() { try { localStorage.removeItem('token'); localStorage.removeItem('access_token'); } catch (e) {} location.href = '/login?next=' + encodeURIComponent(location.pathname); }
 function api(url, opts) {
  opts = opts || {};
  opts.headers = Object.assign(opts.body && !(opts.body instanceof FormData) ? { 'Content-Type': 'application/json' } : {}, { 'Authorization': 'Bearer ' + token });
  return fetch(url, opts).then(function (r) {
   return r.json().catch(function () { return {}; }).then(function (d) {
    if (r.status === 401) { toLogin(); throw new Error('Please log in again.'); }
    if (!r.ok) { var m = d.detail; if (Array.isArray(m)) m = m.map(function (x) { return String(x.msg || '').replace(/^Value error, /, ''); }).join('. '); var e = new Error(typeof m === 'string' ? m : 'Something went wrong. Please try again.'); e.status = r.status; throw e; }
    return d;
   });
  });
 }
 function say(el, text, kind) { if (el) el.innerHTML = text ? '<div class="notice notice-' + (kind || 'bad') + '" style="margin-top:10px">' + esc(text) + '</div>' : ''; }

 var perks = '<div class="perks"><div><b>Paid per drop</b><span>You see the pay before you accept.</span></div><div><b>Your hours</b><span>Go online when you want jobs.</span></div><div><b>Near you</b><span>Jobs match your okada or van.</span></div></div>';

 if (!token) {
  app.innerHTML = perks + '<div class="box"><h2>Log in to apply</h2><p>You need a SalonAutoZone account. It\'s free.</p>' +
   '<div class="acts" style="grid-template-columns:1fr 1fr"><a class="btn btn-primary" href="/login?next=/drive">Log in</a><a class="btn btn-ghost" href="/login?mode=register&next=/drive">Create account</a></div></div>';
  return;
 }

 api('/api/drivers/me').then(showStatus).catch(function (e) {
  if (e.status === 404) { showForm(null); return; }
  app.innerHTML = '<div class="notice notice-bad">' + esc(e.message) + '</div>';
 });

 function showStatus(d) {
  me = d;
  var st = { verified: ['ok', 'Approved'], pending: ['wait', 'Being checked'], rejected: ['bad', 'Not approved'], suspended: ['bad', 'Suspended'] }[d.status] || ['wait', d.status];
  var msg = {
   pending: 'We\'re checking your details and will message you on WhatsApp.',
   rejected: 'Your application wasn\'t approved. You can fix the details and apply again.',
   suspended: 'Your account is paused. Please message us on WhatsApp.'
  }[d.status] || '';
  var h = '<div class="box"><div style="display:flex;justify-content:space-between;align-items:center;gap:10px"><h2 style="margin:0">' + esc(LABEL[d.vehicle_type] || d.vehicle_type) + ' driver</h2><span class="st ' + st[0] + '">' + esc(st[1]) + '</span></div>' +
   (msg ? '<p style="margin-top:8px">' + esc(msg) + '</p>' : '') +
   (d.rejection_note ? '<div class="notice notice-bad" style="margin-top:10px">Reason: ' + esc(d.rejection_note) + '</div>' : '') +
   '<dl class="facts-list"><dt>Registration</dt><dd>' + esc(d.plate_number || '-') + '</dd><dt>City</dt><dd>' + esc(d.city || '-') + '</dd><dt>Phone</dt><dd>' + esc(d.phone || '-') + '</dd></dl>';
  if (d.status === 'verified') {
   h += '<div class="online' + (d.is_online ? ' on' : '') + '"><div><b><span class="dot"></span>' + (d.is_online ? 'You\'re online' : 'You\'re offline') + '</b><small>' + (d.is_online ? 'New jobs show below.' : 'Go online to see jobs.') + '</small></div>' +
    '<button class="switch" id="sw" role="switch" aria-checked="' + !!d.is_online + '" aria-label="Online"></button></div><div id="swmsg"></div>';
  }
  if (d.status === 'rejected') h += '<button class="btn btn-ghost btn-block" style="margin-top:14px" id="again" type="button">Fix details and apply again</button>';
  h += '</div>';
  if (d.status === 'verified') {
   h += '<a class="notice notice-info" href="/alerts" style="display:block;margin-bottom:12px;text-decoration:none">🔔 <b>Turn on alerts</b> to get a pop-up on your phone for new jobs near you.</a>' +
    '<section><h2 class="section-title" style="margin-top:6px">Your delivery</h2><div id="mine"><div class="lcard skeleton" style="min-height:120px"></div></div></section>' +
    '<section><h2 class="section-title" style="margin-top:6px">Jobs near you</h2><div id="open"></div></section>' +
    '<div class="nums"><div><b id="earned">0</b><span>Le earned</span></div><div><b id="waiting">0</b><span>Le still to be paid</span></div><div><b id="count">0</b><span>deliveries</span></div></div>' +
    '<div id="paylist" style="margin-top:12px"></div>';
  }
  app.innerHTML = h;
  var again = document.getElementById('again');
  if (again) again.addEventListener('click', function () { showForm(d); });
  if (d.status !== 'verified') return;
  document.getElementById('sw').addEventListener('click', function () {
   var sw = this; sw.disabled = true;
   api('/api/drivers/me/online?online=' + (!d.is_online), { method: 'POST' })
    .then(function () { d.is_online = !d.is_online; showStatus(d); })
    .catch(function (e) { sw.disabled = false; say(document.getElementById('swmsg'), e.message); });
  });
  refresh();
  clearInterval(timer);
  timer = setInterval(function () { if (!document.hidden) refresh(); }, 15000);
 }

 function refresh() { loadMine(); loadOpen(); loadEarnings(); }

 function loadOpen() {
  var el = document.getElementById('open'); if (!el) return;
  if (!me.is_online) { el.innerHTML = '<div class="box empty">Go online to see jobs.</div>'; return; }
  api('/api/shop/driver/jobs?scope=open').then(function (d) {
   if (!d.jobs || !d.jobs.length) { el.innerHTML = '<div class="box empty">No jobs right now. This page checks again every 15 seconds.</div>'; return; }
   el.innerHTML = d.jobs.map(function (j) {
    return '<div class="job"><div class="top"><span class="code">' + esc(j.code) + '</span><span class="pay">Le ' + fmt(j.payout_sll) + '</span></div>' +
     '<div class="hint" style="margin:4px 0 8px">Paid to you after the buyer receives the parts' + (j.paid_by_shop ? ', by the shop' : '') + '.</div>' +
     '<div class="route"><div><small>Collect in</small> <b>' + esc(j.pickup_area || '-') + '</b></div><div><small>Deliver to</small> <b>' + esc(j.delivery_area || '-') + '</b></div>' + (j.distance_km ? '<div><small>Distance</small> <b>about ' + Math.round(j.distance_km) + ' km</b></div>' : '') + '</div>' +
     '<button class="btn btn-primary btn-block" data-accept="' + j.id + '" type="button">Accept job</button><div data-msg="' + j.id + '"></div></div>';
   }).join('');
  }).catch(function (e) { el.innerHTML = '<div class="box empty">' + esc(e.status === 403 ? 'Go online to see jobs.' : 'We couldn\'t load jobs.') + '</div>'; });
 }

 app.addEventListener('click', function (e) {
  var b = e.target.closest('[data-accept]'); if (!b) return;
  var id = b.dataset.accept; b.disabled = true; b.textContent = 'Accepting…';
  api('/api/shop/driver/jobs/' + id + '/accept', { method: 'POST' }).then(refresh).then(function () { window.scrollTo({ top: 0, behavior: 'smooth' }); })
   .catch(function (err) { b.disabled = false; b.textContent = 'Accept job'; say(app.querySelector('[data-msg="' + id + '"]'), err.message); });
 });

 function person(label, name, phone) {
  var d = String(phone || '').replace(/[^\d+]/g, '');
  if (!d) return '';
  return '<div class="who"><span>' + label + ': <b style="color:var(--ink)">' + esc(name || '-') + '</b></span>' +
   '<a class="btn btn-ghost" href="tel:' + esc(d) + '">Call</a><a class="btn btn-wa" href="https://wa.me/' + esc(d.replace(/^\+/, '')) + '" target="_blank" rel="noopener noreferrer">WhatsApp</a></div>';
 }

 function loadMine() {
  var el = document.getElementById('mine'); if (!el) return;
  api('/api/shop/driver/jobs?scope=mine').then(function (d) {
   if (!d.jobs || !d.jobs.length) {
    el.innerHTML = (flash ? '<div class="notice notice-ok" style="margin-bottom:10px">' + esc(flash) + '</div>' : '') + '<div class="box empty">No delivery yet. Accept a job below.</div>';
    flash = '';
    return;
   }
   var j = d.jobs[0], picked = j.status === 'picked_up';
   var hasPin = j.delivery_lat != null && j.delivery_lng != null;
   var dest = hasPin ? j.delivery_lat + ',' + j.delivery_lng : [j.delivery_address, j.delivery_area, 'Sierra Leone'].filter(Boolean).join(', ');
   var items = (j.items || []).map(function (i) { return '<li>' + esc(i.qty > 1 ? i.qty + ' × ' + i.title : i.title) + '</li>'; }).join('');
   el.innerHTML = '<div class="job"><div class="top"><span class="code">' + esc(j.code) + '</span><span class="pay">Le ' + fmt(j.payout_sll) + '</span></div>' +
    '<div class="notice notice-info" style="margin:6px 0 10px">You get Le ' + fmt(j.payout_sll) + ' once the buyer gives you their delivery code. ' + (j.paid_by_shop ? 'The shop' : 'SalonAutoZone') + ' sends it to your phone.</div>' +
    '<div class="leg' + (picked ? '' : ' go') + '"><small>1. Collect' + (picked ? 'ed' : '') + '</small><b>' + esc(j.pickup_area || '-') + '</b>' + (items ? '<ul class="items">' + items + '</ul>' : '') + (picked ? '' : person('Seller', j.seller_name, j.seller_phone)) + '</div>' +
    '<div class="leg' + (picked ? ' go' : '') + '"><small>2. Deliver to</small><b>' + esc(j.delivery_address || '-') + '</b>' + (j.delivery_area ? ', ' + esc(j.delivery_area) : '') + (hasPin ? ' <span class="pin">Pin on map</span>' : '') +
     person('Buyer', j.buyer_name, j.buyer_phone) +
     '<a class="btn btn-dark btn-block" style="margin-top:10px" href="https://www.google.com/maps/dir/?api=1&destination=' + encodeURIComponent(dest) + '" target="_blank" rel="noopener noreferrer">' + (hasPin ? 'Directions to the buyer\'s pin' : 'Find the address in Maps') + '</a></div>' +
    (picked
     ? '<label class="field"><span>Delivery code from the buyer</span><input class="input code-in" id="code" inputmode="numeric" maxlength="6" autocomplete="off" placeholder="••••••"></label><div class="acts"><button class="btn btn-primary btn-lg" id="deliver" type="button">Mark as delivered</button></div>'
     : '<div class="acts"><button class="btn btn-primary btn-lg" id="pickup" type="button">I\'ve collected the parts</button><button class="btn btn-ghost" id="release" type="button">I can\'t do this job</button></div>') +
    '<div id="jobmsg"></div></div>';
   var msg = document.getElementById('jobmsg');
   function step(path, body) {
    return api('/api/shop/driver/jobs/' + j.id + '/' + path, { method: 'POST', body: body ? JSON.stringify(body) : undefined }).then(refresh).catch(function (e) { say(msg, e.message); throw e; });
   }
   var pu = document.getElementById('pickup');
   if (pu) pu.addEventListener('click', function () { pu.disabled = true; step('pickup').catch(function () { pu.disabled = false; }); });
   var rel = document.getElementById('release');
   if (rel) rel.addEventListener('click', function () {
    if (rel.dataset.sure !== '1') { rel.dataset.sure = '1'; rel.textContent = 'Tap again to give the job back'; rel.classList.add('btn-dark'); return; }
    rel.disabled = true; step('release').catch(function () { rel.disabled = false; });
   });
   var del = document.getElementById('deliver');
   if (del) del.addEventListener('click', function () {
    var code = document.getElementById('code').value.replace(/\D/g, '');
    if (code.length !== 6) { say(msg, 'Ask the buyer for their 6-digit code.'); return; }
    del.disabled = true;
    flash = 'Delivered. Well done! Le ' + fmt(j.payout_sll) + ' is now due to you' + (j.paid_by_shop ? ' from the shop.' : ' from SalonAutoZone.');
    step('deliver', { code: code }).catch(function () { flash = ''; del.disabled = false; });
   });
  }).catch(function () { el.innerHTML = '<div class="box empty">We couldn\'t load your delivery.</div>'; });
 }

 function loadEarnings() {
  api('/api/shop/driver/earnings').then(function (d) {
   var a = document.getElementById('earned'), b = document.getElementById('count');
   if (a) a.textContent = fmt(d.earned_sll); if (b) b.textContent = d.deliveries || 0;
   var w = document.getElementById('waiting'), pl = document.getElementById('paylist');
   if (w) w.textContent = fmt(d.waiting_sll || 0);
   if (pl) pl.innerHTML = (d.recent || []).length ? '<h2 class="section-title" style="font-size:18px">Recent deliveries</h2>' + d.recent.map(function (r) {
    return '<div class="box" style="display:flex;justify-content:space-between;gap:10px;padding:10px 14px;margin-top:6px"><span><b>' + esc(r.code) + '</b><br><small>Le ' + fmt(r.payout_sll) + ' from ' + esc(r.paid_by) + '</small></span>' +
     '<span style="font-weight:800;color:' + (r.paid ? 'var(--ok)' : '#7a4b00') + '">' + (r.paid ? 'Paid' + (r.reference ? '<br><small>' + esc(r.reference) + '</small>' : '') : 'Waiting') + '</span></div>';
   }).join('') : '';
  }).catch(function () {});
 }

 // ---------- photos: shrink on the phone, then upload and read ----------
 function shrink(file, max) {
  return new Promise(function (ok, bad) {
   var url = URL.createObjectURL(file), img = new Image();
   img.onload = function () {
    var scale = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight)), c = document.createElement('canvas');
    c.width = Math.round(img.naturalWidth * scale); c.height = Math.round(img.naturalHeight * scale);
    c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
    URL.revokeObjectURL(url);
    c.toBlob(function (b) { ok({ blob: b, preview: c.toDataURL('image/jpeg', .6) }); }, 'image/jpeg', .85);
   };
   img.onerror = function () { bad(new Error('That file isn\'t a photo we can open.')); };
   img.src = url;
  });
 }
 var ID_TYPES = [['national_id', 'National ID card'], ['drivers_licence', 'Driver\'s licence'], ['voter_card', 'Voter ID card'], ['passport', 'Passport'], ['ecowas_id', 'ECOWAS ID card'], ['other', 'Other ID']];
 function accountName() { try { return (JSON.parse(localStorage.getItem('userInfo') || '{}').full_name || ''); } catch (e) { return ''; } }
 function namesMatch(a, b) {
  var A = (a || '').toLowerCase().match(/[a-z]{2,}/g) || [], B = (b || '').toLowerCase().match(/[a-z]{2,}/g) || [];
  if (!A.length || !B.length) return true;
  var n = A.filter(function (w) { return B.indexOf(w) !== -1; }).length;
  return n >= Math.min(2, A.length, B.length);
 }

 function showForm(prev) {
  prev = prev || {};
  clearInterval(timer);
  var vt = prev.vehicle_type || '', idUrl = prev.id_photo_url || '', plateUrl = prev.plate_photo_url || '', busy = 0;
  var cam = '<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="4"/></svg>';
  function scanCard(kind, title, help) {
   return '<div class="scan" id="sc-' + kind + '"><div class="scan-top"><div class="scan-ph" id="ph-' + kind + '"></div><div><b>' + title + '</b><small>' + help + '</small></div></div>' +
    '<label class="btn btn-dark btn-block scan-btn">' + cam + '<span id="bt-' + kind + '">Take a photo</span><input type="file" accept="image/*" capture="environment" id="in-' + kind + '" hidden></label>' +
    '<div class="scan-st" id="st-' + kind + '" aria-live="polite"></div></div>';
  }
  app.innerHTML = perks + '<form class="box" id="f" novalidate><h2>Apply to deliver</h2>' +
   '<span class="lbl" style="margin-top:12px">1. What do you ride?</span><div class="vt" id="vt">' +
   '<button type="button" data-v="bike" aria-pressed="false"><b>Okada</b><small>Small and medium parts</small></button>' +
   '<button type="button" data-v="van" aria-pressed="false"><b>Van</b><small>Bulky parts like engines and doors</small></button></div>' +
   '<span class="lbl" style="margin-top:18px">2. Your ID</span>' +
   scanCard('id', 'Front of your ID card', 'National ID, driver\'s licence, voter card or passport. Lay it flat, in good light.') +
   '<div class="row2"><label class="field"><span>Type of ID</span><select class="select" id="id_type"><option value="">Choose…</option>' + ID_TYPES.map(function (t) { return '<option value="' + t[0] + '">' + t[1] + '</option>'; }).join('') + '</select></label>' +
   '<label class="field"><span>ID number</span><input class="input" id="id_number" maxlength="40" autocomplete="off" style="text-transform:uppercase"></label></div>' +
   '<label class="field"><span>Name on the ID</span><input class="input" id="id_name" maxlength="100" autocomplete="off"></label>' +
   '<input type="hidden" id="id_expiry"><div id="namewarn"></div>' +
   '<span class="lbl" style="margin-top:18px">3. Your number plate</span>' +
   scanCard('plate', 'Your bike\'s number plate', 'Stand straight in front of the plate, close enough to fill the photo.') +
   '<label class="field"><span>Plate number</span><input class="input" id="plate" maxlength="20" autocomplete="off" style="text-transform:uppercase"></label>' +
   '<span class="lbl" style="margin-top:18px">4. Where and how to reach you</span>' +
   '<label class="field"><span>City</span><input class="input" id="city" maxlength="60" value="Freetown"></label>' +
   '<label class="field"><span>WhatsApp number</span><input class="input" id="phone" type="tel" maxlength="25" placeholder="076 123456"></label>' +
   '<p class="hint">Only our team sees your ID and photos. Buyers only see your name, phone and plate when you\'re delivering to them.</p>' +
   '<button class="btn btn-primary btn-block btn-lg" style="margin-top:16px" type="submit" id="go">Send application</button><div id="msg"></div></form>';
  var f = document.getElementById('f'), msg = document.getElementById('msg'), vtBox = document.getElementById('vt');
  function $id(x) { return document.getElementById(x); }
  function pick(v) { vt = v; vtBox.querySelectorAll('button').forEach(function (x) { x.setAttribute('aria-pressed', String(x.dataset.v === v)); }); $id('sc-plate').querySelector('b').textContent = v === 'van' ? 'Your van\'s number plate' : 'Your bike\'s number plate'; }
  if (vt) pick(vt);
  vtBox.addEventListener('click', function (e) { var b = e.target.closest('button'); if (b) pick(b.dataset.v); });
  $id('plate').value = prev.plate_number || '';
  $id('city').value = prev.city || 'Freetown';
  $id('phone').value = prev.phone || '';
  $id('id_type').value = prev.id_type || '';
  $id('id_number').value = prev.id_number || '';
  $id('id_name').value = prev.id_name || '';
  $id('id_expiry').value = prev.id_expiry || '';
  function photoDone(kind, preview) { $id('ph-' + kind).style.backgroundImage = 'url(' + preview + ')'; $id('sc-' + kind).classList.add('has'); $id('bt-' + kind).textContent = 'Take it again'; }
  if (prev.id_photo_url) photoDone('id', prev.id_photo_url);
  if (prev.plate_photo_url) photoDone('plate', prev.plate_photo_url);
  function status(kind, text, kindCls) { $id('st-' + kind).innerHTML = text ? '<div class="notice notice-' + (kindCls || 'ok') + '">' + text + '</div>' : ''; }
  function checkName() {
   var a = accountName(), b = $id('id_name').value.trim();
   $id('namewarn').innerHTML = (a && b && !namesMatch(a, b)) ? '<div class="notice notice-warn" style="margin-top:10px">The name on your ID (' + esc(b) + ') is different from your account name (' + esc(a) + '). That\'s fine if it\'s you; our team will check.</div>' : '';
  }
  $id('id_name').addEventListener('input', checkName);
  if (prev.id_name) checkName();

  function handle(kind, file) {
   if (!file) return;
   busy++; status(kind, '<span class="spin" aria-hidden="true"></span> Reading the photo…', 'info');
   shrink(file, 1600).then(function (img) {
    photoDone(kind, img.preview);
    var up = new FormData(); up.append('file', img.blob, kind + '.jpg');
    var scan = new FormData(); scan.append('file', img.blob, kind + '.jpg');
    var upload = api('/api/upload/', { method: 'POST', body: up }).then(function (u) { if (kind === 'id') idUrl = u.url; else plateUrl = u.url; });
    var read = api('/api/drivers/scan?kind=' + kind, { method: 'POST', body: scan }).then(function (d) {
     if (kind === 'id') {
      if (d.id_type) $id('id_type').value = d.id_type;
      if (d.id_number) $id('id_number').value = d.id_number;
      if (d.full_name) $id('id_name').value = d.full_name;
      $id('id_expiry').value = d.expiry_date || '';
      checkName();
      if (d.expired) return status(kind, 'This ID expired on ' + esc(d.expiry_date) + '. Please use an ID that is still valid.', 'bad');
      if (!d.ok) return status(kind, esc(d.problem || 'We couldn\'t read everything.') + ' Take the photo again, or type the details below.', 'warn');
      status(kind, '✓ Read your ID. Check the details below are right.');
     } else {
      if (d.plate_number) $id('plate').value = d.plate_number;
      if (!vt && d.vehicle_type && (d.vehicle_type === 'bike' || d.vehicle_type === 'van')) pick(d.vehicle_type);
      if (!d.ok) return status(kind, esc(d.problem || 'We couldn\'t read the plate.') + ' Take the photo again, or type the number below.', 'warn');
      status(kind, '✓ Read your plate' + (d.colour || d.make ? ' (' + esc([d.colour, d.make].filter(Boolean).join(' ')) + ')' : '') + '. Check the number below is right.');
     }
    }, function (e) {
     status(kind, (e.status === 503 || e.status === 429 || e.status === 502 ? esc(e.message) : 'We couldn\'t read the photo.') + ' Your photo is saved; type the details below.', 'warn');
    });
    return Promise.all([upload, read]);
   }).catch(function (e) {
    status(kind, esc(e.message) + ' Please try again.', 'bad');
    if (kind === 'id') idUrl = prev.id_photo_url || ''; else plateUrl = prev.plate_photo_url || '';
   }).then(function () { busy--; });
  }
  $id('in-id').addEventListener('change', function (e) { handle('id', e.target.files[0]); e.target.value = ''; });
  $id('in-plate').addEventListener('change', function (e) { handle('plate', e.target.files[0]); e.target.value = ''; });

  f.addEventListener('submit', function (ev) {
   ev.preventDefault(); say(msg, '');
   var plate = $id('plate').value.trim(), city = $id('city').value.trim(), phone = $id('phone').value.trim();
   if (busy) return say(msg, 'Wait a moment, your photos are still uploading.');
   if (!vt) return say(msg, 'Choose Okada or Van.');
   if (!idUrl) return say(msg, 'Take a photo of your ID.');
   if (!$id('id_type').value) return say(msg, 'Choose your type of ID.');
   if ($id('id_number').value.trim().length < 4) return say(msg, 'Enter the number on your ID.');
   if (!plateUrl) return say(msg, 'Take a photo of your number plate.');
   if (!plate) return say(msg, 'Enter your plate number.');
   if (city.length < 2) return say(msg, 'Enter your city.');
   if (phone.replace(/\D/g, '').length < 8) return say(msg, 'Enter your WhatsApp number.');
   var go = $id('go'); go.disabled = true; go.textContent = 'Sending…';
   api('/api/drivers/apply', { method: 'POST', body: JSON.stringify({
    vehicle_type: vt, plate_number: plate, city: city, phone: phone, id_photo_url: idUrl, plate_photo_url: plateUrl,
    id_type: $id('id_type').value, id_number: $id('id_number').value.trim(), id_name: $id('id_name').value.trim() || null,
    id_expiry: $id('id_expiry').value || null }) })
    .then(function () { return api('/api/drivers/me'); }).then(function (d) { window.scrollTo(0, 0); showStatus(d); })
    .catch(function (e) { say(msg, e.status === 409 ? 'You already have an application.' : e.message); go.disabled = false; go.textContent = 'Send application'; });
  });
 }
})();
</script>
</body>
</html>
