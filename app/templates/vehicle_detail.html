<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Car · SalonAutoZone</title>
<meta name="theme-color" content="#0e2a2b">
<link rel="icon" type="image/png" href="/static/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&display=swap" data-saz-font>
<link rel="stylesheet" href="/static/ui.css?v=5">
<link rel="stylesheet" href="/static/chrome.css?v=5">
<style>
.check-row { display: flex; gap: 8px; margin-top: 10px; }
.check-row .input { text-transform: uppercase; letter-spacing: .08em; font-weight: 700; }
.recalls { margin: 10px 0 0; padding: 0; list-style: none; display: grid; gap: 8px; }
.recalls li { padding: 10px 12px; border-radius: var(--r-sm); background: var(--warn-50); }
.recalls b { display: block; color: var(--ink); }
.seller { display: flex; gap: 12px; align-items: center; }
.seller .av { width: 44px; height: 44px; border-radius: 50%; background: var(--teal-50); color: var(--teal); font-weight: 800; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.tips { margin: 8px 0 0; padding-left: 18px; color: var(--muted); }
.tips li + li { margin-top: 4px; }
</style>
</head>
<body>
<svg style="display:none" xmlns="http://www.w3.org/2000/svg">
 <symbol id="i-car" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 17h14v-5l-2-5H7l-2 5v5z"/><path d="M5 12h14"/><circle cx="7.5" cy="17" r="2"/><circle cx="16.5" cy="17" r="2"/></symbol>
</svg>
<div id="site-header"></div>
<main class="wrap" id="app">
 <div class="detail"><div class="gallery lcard skeleton" style="border-radius:20px"></div><div class="lcard skeleton"></div></div>
</main>
<script src="/static/site.js?v=4"></script>
<script>
(function () {
 'use strict';
 var id = location.pathname.split('/').pop();
 var app = document.getElementById('app');
 function $(x) { return document.getElementById(x); }
 function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
 function fmt(n) { return Number(n || 0).toLocaleString('en-GB'); }
 function safeUrl(u) { u = String(u || '').trim(); return (/^https?:\/\//i.test(u) || /^\/(?!\/)/.test(u)) ? u : ''; }
 function token() { try { return localStorage.getItem('token') || localStorage.getItem('access_token') || ''; } catch (e) { return ''; } }
 function auth() { var t = token(); return t ? { Authorization: 'Bearer ' + t } : {}; }
 function cap(s) { s = String(s || ''); return s.charAt(0).toUpperCase() + s.slice(1).replace(/_/g, ' '); }
 function toast(msg, type) {
  var t = $('toast');
  if (!t) { t = document.createElement('div'); t.id = 'toast'; t.setAttribute('role', 'status'); document.body.appendChild(t); }
  t.className = 'toast ' + (type || ''); t.textContent = msg; void t.offsetWidth; t.classList.add('show');
  clearTimeout(t._t); t._t = setTimeout(function () { t.classList.remove('show'); }, 2600);
 }
 function notFound(msg) {
  app.innerHTML = '<div style="padding:64px 0;text-align:center"><h1 style="font-size:28px">' + esc(msg) + '</h1><p style="margin:8px 0 16px;color:var(--muted)">It may have been sold or removed.</p><a class="btn btn-primary" href="/?tab=cars">Browse cars</a></div>';
 }

 fetch('/api/vehicles/' + encodeURIComponent(id)).then(function (r) { return r.ok ? r.json() : null; }).then(function (v) {
  if (!v) return notFound('We couldn\'t find this car');
  var title = v.title || [v.year, v.make, v.model].filter(Boolean).join(' ');
  document.title = title + ' · SalonAutoZone';
  var img = safeUrl(v.image_url || v.photo_url);
  var phone = String(v.contact_phone || '').replace(/[^\d+]/g, '');
  var wa = phone ? 'https://wa.me/' + phone.replace(/^\+/, '') + '?text=' + encodeURIComponent('Hi, is your ' + title + ' still available? ' + location.href) : '';
  var facts = [
   ['Year', v.year], ['Mileage', v.mileage_km != null ? fmt(Math.round(v.mileage_km)) + ' km' : ''], ['Fuel', v.fuel_type], ['Gearbox', v.transmission],
   ['Condition', cap(v.condition)], ['Location', v.location], ['Status', v.availability && v.availability !== 'in_stock' ? cap(v.availability) : ''],
   ['Duty', v.duty_paid ? 'Paid' : ''], ['From', v.country_of_origin]
  ].filter(function (f) { return f[1]; });

  app.innerHTML =
   '<nav class="crumbs" aria-label="Breadcrumb"><a href="/?tab=cars">Cars</a><span>/</span>' + (v.make ? '<a href="/?tab=cars&make=' + encodeURIComponent(v.make) + '">' + esc(v.make) + '</a><span>/</span>' : '') + '<span>' + esc(title) + '</span></nav>' +
   '<div class="detail">' +
     '<div class="gallery">' + (img ? '<img src="' + esc(img) + '" alt="' + esc(title) + '">' : '<svg aria-hidden="true"><use href="#i-car"/></svg>') + '</div>' +
    '<aside class="buybox">' +
     '<h1>' + esc(title) + '</h1>' +
     '<div><div class="big-price"><small>SLL</small>' + fmt(v.price_sll) + '</div>' + (v.price_usd ? '<div class="sub-price">About $' + fmt(v.price_usd) + '</div>' : '') + '</div>' +
     '<dl class="facts">' + facts.map(function (f) { return '<div><dt>' + esc(f[0]) + '</dt><dd>' + esc(f[1]) + '</dd></div>'; }).join('') + '</dl>' +
     '<div class="cta-row">' +
      (wa ? '<a class="btn btn-wa btn-lg wide" href="' + esc(wa) + '" target="_blank" rel="noopener">Message the seller on WhatsApp</a>' : '') +
      (phone ? '<a class="btn btn-ghost btn-lg wide" href="tel:' + esc(phone) + '">Call ' + esc(v.contact_phone) + '</a>' : '') +
      '<button type="button" class="btn btn-ghost" id="btn-save">Save</button>' +
      '<button type="button" class="btn btn-ghost" id="btn-share">Share</button>' +
     '</div>' +
     '<div class="box"><h2>Before you pay</h2><ul class="tips"><li>See the car in person, in daylight.</li><li>Check the VIN on the car matches the papers.</li><li>Take a mechanic you trust for a test drive.</li><li>Never send money before you\'ve seen the car.</li></ul></div>' +
    '</aside>' +
    '<div class="more">' +
     (v.description ? '<section class="box"><h2>From the seller</h2><p style="white-space:pre-line">' + esc(v.description) + '</p></section>' : '') +
     '<section class="box" id="check"><h2>Free VIN and safety check</h2><div id="check-body"></div></section>' +
    '</div>' +
   '</div>';

  if (wa || phone) {
   document.body.insertAdjacentHTML('beforeend',
    '<div class="sticky-cta"><span class="price-mini">SLL ' + fmt(v.price_sll) + '</span>' +
    (phone ? '<a class="btn btn-ghost" href="tel:' + esc(phone) + '">Call</a>' : '') +
    (wa ? '<a class="btn btn-wa" href="' + esc(wa) + '" target="_blank" rel="noopener">WhatsApp</a>' : '') + '</div>');
   document.body.classList.add('has-sticky-cta');
  }

  // ---- VIN + recall check ----
  var body = $('check-body');
  function showRecalls(make, model, year) {
   var box = document.createElement('div');
   box.innerHTML = '<p class="hint">Checking safety recalls…</p>';
   body.appendChild(box);
   fetch('/api/vin/recalls?make=' + encodeURIComponent(make) + '&model=' + encodeURIComponent(model) + '&year=' + encodeURIComponent(year))
    .then(function (r) { return r.ok ? r.json() : null; })
    .then(function (d) {
     if (!d) { box.innerHTML = '<p class="hint">The recall service is unavailable right now.</p>'; return; }
     if (!d.count) { box.innerHTML = '<p style="margin-top:10px"><span class="fit-yes">No US safety recalls found</span> for the ' + esc(year + ' ' + make + ' ' + model) + '.</p><p class="hint">Recalls are only recorded for cars sold in the US.</p>'; return; }
     box.innerHTML = '<p style="margin-top:10px"><span class="fit-no">' + d.count + ' US safety recall' + (d.count > 1 ? 's' : '') + '</span> for this model. Ask the seller if the repairs were done.</p><ul class="recalls">' +
      d.recalls.slice(0, 4).map(function (r) { return '<li><b>' + esc(cap(String(r.component || 'Recall').toLowerCase())) + '</b>' + esc(String(r.summary || '').slice(0, 180)) + (String(r.summary || '').length > 180 ? '…' : '') + '</li>'; }).join('') + '</ul>' +
      (d.count > 4 ? '<p class="hint">and ' + (d.count - 4) + ' more.</p>' : '');
    }).catch(function () { box.innerHTML = '<p class="hint">The recall service is unavailable right now.</p>'; });
  }
  function runCheck(vin) {
   body.innerHTML = '<p class="hint">Checking ' + esc(vin) + '…</p>';
   fetch('/api/vin/decode/' + encodeURIComponent(vin)).then(function (r) { return r.json().then(function (d) { return { ok: r.ok, d: d }; }); }).then(function (x) {
    if (!x.ok) { body.innerHTML = '<p class="fit-no">' + esc(x.d.detail || 'We couldn\'t check this VIN.') + '</p>'; return; }
    var d = x.d, decoded = [d.year, d.make, d.model].filter(Boolean).join(' ');
    var makeMatch = !d.make || !v.make || String(d.make).toLowerCase().indexOf(String(v.make).toLowerCase().split('-')[0]) > -1 || String(v.make).toLowerCase().indexOf(String(d.make).toLowerCase()) > -1;
    var yearMatch = !d.year || !v.year || Math.abs(Number(d.year) - Number(v.year)) <= 1;
    var h = '<p>VIN <b>' + esc(d.vin) + '</b> belongs to a <b>' + esc(decoded || 'vehicle we can\'t identify') + '</b>.</p>';
    h += (makeMatch && yearMatch)
     ? '<p class="fit-yes" style="margin-top:6px">Matches this listing.</p>'
     : '<p class="fit-no" style="margin-top:6px">This doesn\'t match the listing (' + esc([v.year, v.make, v.model].join(' ')) + '). Ask the seller to explain before you go further.</p>';
    h += '<p class="hint"><a href="/vin-tool?vin=' + encodeURIComponent(d.vin) + '">See the full VIN report</a></p>';
    body.innerHTML = h;
    var mk = d.make || v.make, md = d.model || v.model, yr = d.year || v.year;
    if (mk && md && yr) showRecalls(mk, md, yr);
   }).catch(function () { body.innerHTML = '<p class="hint">We couldn\'t reach the VIN checker. Try again later.</p>'; });
  }
  if (v.vin && v.vin.length === 17) runCheck(v.vin);
  else {
   body.innerHTML = '<p class="muted" style="color:var(--muted)">The seller hasn\'t added the VIN. Ask them for it (it\'s on the windscreen and the papers), then check it here.</p>' +
    '<form class="check-row" id="vin-form"><label class="sr-only" for="vin-in">VIN</label><input class="input" id="vin-in" maxlength="17" placeholder="17-character VIN" autocomplete="off"><button class="btn btn-primary" type="submit">Check</button></form>';
   $('vin-form').addEventListener('submit', function (e) {
    e.preventDefault();
    var val = ($('vin-in').value || '').replace(/\s+/g, '').toUpperCase();
    if (val.length !== 17) { toast('A VIN has 17 characters', 'error'); return; }
    runCheck(val);
   });
   if (v.make && v.model && v.year) showRecalls(v.make, v.model, v.year);
  }

  // ---- actions ----
  $('btn-share').onclick = function () {
   var text = title + ' · SLL ' + fmt(v.price_sll);
   if (navigator.share) { navigator.share({ title: title, text: text, url: location.href }).catch(function () {}); return; }
   window.open('https://wa.me/?text=' + encodeURIComponent(text + '\n' + location.href), '_blank', 'noopener');
  };
  $('btn-save').onclick = function () {
   var b = this;
   if (!token()) { location.href = '/login?next=' + encodeURIComponent(location.pathname); return; }
   fetch('/api/my-account/saved', { method: 'POST', headers: Object.assign({ 'Content-Type': 'application/json' }, auth()), body: JSON.stringify({ listing_type: 'vehicle', listing_id: Number(id) }) })
    .then(function (r) {
     if (r.status === 401) { location.href = '/login?next=' + encodeURIComponent(location.pathname); return; }
     if (r.ok) { b.textContent = 'Saved'; toast('Saved', 'success'); } else toast('Could not save', 'error');
    });
  };
  fetch('/api/vehicles/' + encodeURIComponent(id) + '/view', { method: 'POST' }).catch(function () {});
 }).catch(function () { notFound('We couldn\'t load this car'); });
})();
</script>
</body>
</html>
