<style>
/* ============================================================
   DESIGN SYSTEM
   ============================================================ */
:root{
  /* Colors */
  --navy-900:#0a1729;
  --navy-800:#0b1e3a;
  --navy-700:#12294d;
  --navy-600:#1a3a6b;
  --blue-500:#0091d5;
  --blue-400:#00a8e8;
  --blue-300:#4dc3f0;
  --amber-500:#ffb800;
  --amber-600:#f59e0b;
  --orange-500:#ff6b00;
  --orange-600:#e55a00;
  --green-500:#16a34a;
  --green-400:#22c55e;
  --red-500:#dc2626;
  --red-400:#ef4444;
  --slate-50:#f8fafc;
  --slate-100:#f1f5f9;
  --slate-200:#e2e8f0;
  --slate-300:#cbd5e1;
  --slate-400:#94a3b8;
  --slate-500:#64748b;
  --slate-600:#475569;
  --slate-700:#334155;
  --slate-800:#1e293b;
  --slate-900:#0f172a;

  /* Spacing (8px scale) */
  --space-1:4px;
  --space-2:8px;
  --space-3:12px;
  --space-4:16px;
  --space-5:20px;
  --space-6:24px;
  --space-8:32px;
  --space-10:40px;
  --space-12:48px;
  --space-16:64px;

  /* Radius */
  --radius-sm:8px;
  --radius-md:12px;
  --radius-lg:16px;
  --radius-xl:20px;
  --radius-full:9999px;

  /* Shadows */
  --shadow-sm:0 1px 2px rgba(15,23,42,0.04), 0 1px 3px rgba(15,23,42,0.06);
  --shadow-md:0 2px 4px rgba(15,23,42,0.04), 0 4px 12px rgba(15,23,42,0.06);
  --shadow-lg:0 4px 8px rgba(15,23,42,0.06), 0 12px 28px rgba(15,23,42,0.10);
  --shadow-xl:0 8px 24px rgba(15,23,42,0.12), 0 24px 48px rgba(15,23,42,0.14);
}

/* ============================================================
   RESET & BASE
   ============================================================ */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

html{-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}

body{
  font-family:-apple-system,BlinkMacSystemFont,'Inter','Segoe UI',Roboto,sans-serif;
  font-size:15px;
  line-height:1.5;
  color:var(--slate-800);
  background:var(--slate-50);
  -webkit-font-smoothing:antialiased;
  -moz-osx-font-smoothing:grayscale;
  letter-spacing:-0.01em;
}

button,input,select,textarea{font-family:inherit;font-size:inherit}
button{cursor:pointer;border:none;background:none}
a{color:inherit;text-decoration:none}
img{max-width:100%;display:block}

/* ============================================================
   TOP BAR
   ============================================================ */
.top-bar{
  background:var(--navy-900);
  color:var(--slate-400);
  padding:10px 32px;
  font-size:12px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  flex-wrap:wrap;
  gap:var(--space-2);
  letter-spacing:0;
}
.top-bar strong{color:#fff;font-weight:600;letter-spacing:-0.01em}
.top-bar a{color:var(--slate-400);transition:color 0.15s}
.top-bar a:hover{color:#fff}
.top-bar .phone{color:var(--amber-500);font-weight:700}

/* ============================================================
   BRAND BAR
   ============================================================ */
.brand-bar{
  background:#fff;
  padding:14px 32px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  flex-wrap:wrap;
  gap:var(--space-4);
  border-bottom:1px solid var(--slate-200);
  position:sticky;
  top:0;
  z-index:100;
}
.brand-logo{
  font-size:20px;
  font-weight:800;
  color:var(--navy-800);
  letter-spacing:-0.03em;
}
.brand-logo span{color:var(--blue-400)}
.brand-logo .y{color:var(--amber-500)}

.brand-toggle{
  display:flex;
  background:var(--slate-100);
  border-radius:var(--radius-md);
  padding:4px;
  gap:4px;
}
.brand-toggle button{
  padding:10px 20px;
  border-radius:var(--radius-sm);
  font-weight:600;
  font-size:13px;
  color:var(--slate-500);
  transition:all 0.15s;
  white-space:nowrap;
}
.brand-toggle button:hover{color:var(--navy-800)}
.brand-toggle button.active{
  background:var(--orange-500);
  color:#fff;
  box-shadow:0 2px 8px rgba(255,107,0,0.25);
}
.brand-toggle button.active.cars{
  background:var(--blue-400);
  box-shadow:0 2px 8px rgba(0,168,232,0.25);
}

.brand-actions{display:flex;align-items:center;gap:var(--space-5);flex-wrap:wrap}
.brand-actions a{
  color:var(--slate-700);
  font-size:14px;
  font-weight:600;
  transition:color 0.15s;
}
.brand-actions a:hover{color:var(--blue-400)}

.list-btn{
  background:linear-gradient(135deg,var(--orange-500),var(--orange-600)) !important;
  color:#fff !important;
  padding:10px 20px !important;
  border-radius:var(--radius-sm) !important;
  font-weight:700 !important;
  box-shadow:0 4px 12px rgba(255,107,0,0.28);
  transition:transform 0.15s,box-shadow 0.15s;
}
.list-btn:hover{
  transform:translateY(-1px);
  box-shadow:0 6px 16px rgba(255,107,0,0.35);
}

/* ============================================================
   FITMENT BAR
   ============================================================ */
.fitment-bar{
  background:linear-gradient(90deg,var(--navy-800) 0%,var(--navy-600) 100%);
  color:#fff;
  padding:14px 32px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  flex-wrap:wrap;
  gap:var(--space-4);
  border-bottom:1px solid rgba(255,255,255,0.06);
}
.fitment-left{display:flex;align-items:center;gap:var(--space-4)}
.fitment-icon{
  background:var(--orange-500);
  width:44px;height:44px;
  border-radius:var(--radius-md);
  display:flex;align-items:center;justify-content:center;
  font-size:20px;
  box-shadow:0 4px 12px rgba(255,107,0,0.3);
  flex-shrink:0;
}
.fitment-label{
  font-size:10px;
  color:var(--slate-400);
  text-transform:uppercase;
  font-weight:700;
  letter-spacing:0.08em;
  margin-bottom:2px;
}
.fitment-value{font-size:14px;font-weight:700;line-height:1.3}

.fitment-controls{display:flex;gap:var(--space-2);flex-wrap:wrap;align-items:center}
.fitment-controls select{
  padding:9px 14px;
  border-radius:var(--radius-sm);
  border:1px solid rgba(255,255,255,0.1);
  font-size:13px;
  font-weight:600;
  background:rgba(255,255,255,0.08);
  color:#fff;
  transition:background 0.15s;
  font-family:inherit;
}
.fitment-controls select:hover{background:rgba(255,255,255,0.14)}
.fitment-controls select:focus{outline:none;background:rgba(255,255,255,0.18);border-color:var(--blue-400)}
.fitment-controls select option{color:var(--slate-800)}

.fitment-filter-label{
  display:none;
  align-items:center;
  gap:8px;
  color:#fff;
  font-size:13px;
  font-weight:600;
  cursor:pointer;
  padding:9px 14px;
  border-radius:var(--radius-sm);
  background:rgba(255,255,255,0.08);
  transition:background 0.15s;
  white-space:nowrap;
}
.fitment-filter-label:hover{background:rgba(255,255,255,0.14)}
.fitment-filter-label input[type=checkbox]{
  width:16px;height:16px;
  cursor:pointer;
  accent-color:var(--green-400);
}

.btn-save{
  background:var(--blue-400);
  color:#fff;
  padding:9px 18px;
  border-radius:var(--radius-sm);
  font-weight:700;
  font-size:13px;
  transition:background 0.15s;
}
.btn-save:hover{background:var(--blue-500)}

.btn-clear{
  background:rgba(255,255,255,0.1);
  color:#fff;
  border:1px solid rgba(255,255,255,0.2);
  padding:9px 18px;
  border-radius:var(--radius-sm);
  font-weight:700;
  font-size:13px;
  display:none;
  transition:background 0.15s;
}
.btn-clear:hover{background:rgba(255,255,255,0.18)}

/* ============================================================
   HERO
   ============================================================ */
.hero{
  background:linear-gradient(135deg,var(--navy-800) 0%,var(--navy-600) 100%);
  color:#fff;
  padding:56px 32px 96px;
  text-align:center;
  position:relative;
  z-index:1;
  overflow:hidden;
}
.hero::before{
  content:'';
  position:absolute;
  inset:0;
  background:radial-gradient(circle at 20% 20%,rgba(0,168,232,0.15) 0%,transparent 50%),
             radial-gradient(circle at 80% 80%,rgba(255,184,0,0.08) 0%,transparent 50%);
  pointer-events:none;
}
.hero > *{position:relative;z-index:1}

.hero-badge{
  display:inline-block;
  background:var(--green-400);
  color:#fff;
  padding:7px 18px;
  border-radius:var(--radius-full);
  font-size:11px;
  font-weight:800;
  margin-bottom:20px;
  letter-spacing:0.08em;
  box-shadow:0 4px 12px rgba(34,197,94,0.35);
}
.hero h1{
  font-size:clamp(28px,5vw,44px);
  font-weight:800;
  margin-bottom:12px;
  line-height:1.15;
  letter-spacing:-0.03em;
  max-width:800px;
  margin-left:auto;
  margin-right:auto;
}
.hero p{
  font-size:16px;
  opacity:0.82;
  margin-bottom:32px;
  max-width:600px;
  margin-left:auto;
  margin-right:auto;
  line-height:1.55;
}

/* ============================================================
   SEARCH
   ============================================================ */
.search-container{
  max-width:1100px;
  margin:0 auto;
  background:#fff;
  padding:var(--space-4);
  border-radius:var(--radius-lg);
  box-shadow:0 20px 60px rgba(10,23,41,0.35), 0 8px 24px rgba(10,23,41,0.2);
}
.search-row{
  display:grid;
  grid-template-columns:1.2fr 1fr 1fr 1fr 1fr auto;
  gap:var(--space-2);
}
.search-row select,
.search-row input{
  padding:13px 16px;
  border:1.5px solid var(--slate-200);
  border-radius:var(--radius-sm);
  font-size:14px;
  font-weight:500;
  color:var(--slate-800);
  background:#fff;
  width:100%;
  transition:border-color 0.15s,box-shadow 0.15s;
}
.search-row select:focus,
.search-row input:focus{
  outline:none;
  border-color:var(--blue-400);
  box-shadow:0 0 0 4px rgba(0,168,232,0.12);
}
.search-row button{
  background:linear-gradient(135deg,var(--orange-500),var(--orange-600));
  color:#fff;
  padding:13px 28px;
  border-radius:var(--radius-sm);
  font-weight:700;
  font-size:14px;
  white-space:nowrap;
  box-shadow:0 4px 12px rgba(255,107,0,0.28);
  transition:transform 0.15s,box-shadow 0.15s;
}
.search-row button:hover{
  transform:translateY(-1px);
  box-shadow:0 6px 18px rgba(255,107,0,0.35);
}

.search-text-row{position:relative;margin-top:var(--space-2)}
.search-text-row input{
  width:100%;
  padding:13px 16px;
  border:1.5px solid var(--slate-200);
  border-radius:var(--radius-sm);
  font-size:14px;
  transition:border-color 0.15s,box-shadow 0.15s;
}
.search-text-row input:focus{
  outline:none;
  border-color:var(--blue-400);
  box-shadow:0 0 0 4px rgba(0,168,232,0.12);
}

.suggestions-box{
  position:absolute;
  top:100%;left:0;right:0;
  background:#fff;
  border-radius:var(--radius-md);
  box-shadow:var(--shadow-xl);
  z-index:1000;
  margin-top:6px;
  max-height:420px;
  overflow-y:auto;
  display:none;
  border:1px solid var(--slate-200);
}
.suggestion-item{
  padding:14px 18px;
  cursor:pointer;
  border-bottom:1px solid var(--slate-100);
  display:flex;
  align-items:center;
  gap:14px;
  transition:background 0.1s;
}
.suggestion-item:last-child{border-bottom:none}
.suggestion-item:hover{background:var(--slate-50)}

/* ============================================================
   IDENTIFY CTA
   ============================================================ */
.identify-cta-wrap{
  max-width:800px;
  margin:16px auto 24px;
  padding:0 16px;
  position:relative;
  z-index:5;
}
.identify-cta{
  width:100%;
  background:linear-gradient(135deg,var(--blue-400),var(--blue-500));
  color:#fff;
  padding:16px 24px;
  border-radius:var(--radius-md);
  font-weight:700;
  font-size:15px;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:10px;
  box-shadow:0 8px 24px rgba(0,168,232,0.35);
  min-height:56px;
  transition:transform 0.15s,box-shadow 0.15s;
}
.identify-cta:hover{
  transform:translateY(-2px);
  box-shadow:0 12px 32px rgba(0,168,232,0.45);
}

/* ============================================================
   CATEGORIES
   ============================================================ */
.categories{
  max-width:1200px;
  margin:-24px auto 48px;
  padding:0 20px;
  display:grid;
  grid-template-columns:repeat(6,1fr);
  gap:var(--space-3);
  position:relative;
  z-index:20;
}
.category{
  background:#fff;
  border-radius:var(--radius-md);
  padding:24px 12px;
  text-align:center;
  cursor:pointer;
  box-shadow:var(--shadow-md);
  transition:transform 0.2s,box-shadow 0.2s;
  position:relative;
  z-index:21;
  border:1px solid rgba(226,232,240,0.6);
}
.category:hover{
  transform:translateY(-4px);
  box-shadow:var(--shadow-lg);
  border-color:var(--blue-300);
}
.cat-icon{
  width:32px;height:32px;
  margin-bottom:8px;
  color:var(--blue-400);
  stroke-width:2;
}
.category-label{
  font-size:13px;
  font-weight:700;
  color:var(--navy-800);
  letter-spacing:-0.01em;
}

/* ============================================================
   RESULTS
   ============================================================ */
.results-section{
  max-width:1300px;
  margin:32px auto 80px;
  padding:0 20px;
}
.results-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:24px;
  flex-wrap:wrap;
  gap:var(--space-3);
}
.results-title{
  font-size:26px;
  color:var(--navy-800);
  font-weight:800;
  letter-spacing:-0.02em;
}
.results-count{
  background:rgba(0,168,232,0.1);
  color:var(--blue-500);
  padding:7px 16px;
  border-radius:var(--radius-full);
  font-size:13px;
  font-weight:700;
}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(280px,1fr));
  gap:var(--space-5);
}

/* ============================================================
   CARD
   ============================================================ */
.card{
  background:#fff;
  border-radius:var(--radius-lg);
  overflow:hidden;
  box-shadow:var(--shadow-sm);
  transition:transform 0.25s,box-shadow 0.25s;
  cursor:pointer;
  border:1px solid rgba(226,232,240,0.7);
}
.card:hover{
  transform:translateY(-4px);
  box-shadow:var(--shadow-lg);
  border-color:rgba(0,168,232,0.3);
}
.card-img{
  height:190px;
  background:linear-gradient(135deg,var(--slate-100),var(--slate-200));
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:56px;
  color:var(--slate-300);
  background-size:cover;
  background-position:center;
  position:relative;
}
.card-badges{
  position:absolute;
  top:12px;left:12px;
  display:flex;
  gap:6px;
  flex-wrap:wrap;
  z-index:2;
}
.badge{
  padding:5px 11px;
  border-radius:var(--radius-full);
  font-size:11px;
  font-weight:700;
  color:#fff;
  letter-spacing:0.01em;
  backdrop-filter:blur(8px);
}
.badge-verified{background:var(--green-400);box-shadow:0 2px 6px rgba(34,197,94,0.3)}
.badge-new{background:var(--blue-400);box-shadow:0 2px 6px rgba(0,168,232,0.3)}
.badge-fits{background:var(--green-400);color:#fff;font-weight:800;box-shadow:0 2px 6px rgba(34,197,94,0.35)}
.badge-featured{background:var(--amber-500);color:var(--navy-900);font-weight:800;box-shadow:0 2px 6px rgba(255,184,0,0.4)}

.save-btn{
  position:absolute;
  bottom:12px;right:12px;
  background:rgba(255,255,255,0.96);
  color:var(--navy-800);
  padding:7px 14px;
  border-radius:var(--radius-full);
  font-weight:700;
  font-size:12px;
  box-shadow:0 2px 8px rgba(15,23,42,0.15);
  transition:all 0.15s;
  z-index:5;
  backdrop-filter:blur(8px);
}
.save-btn:hover{
  background:#fff;
  transform:translateY(-1px);
  box-shadow:0 4px 12px rgba(15,23,42,0.2);
}
.save-btn.saved{
  background:var(--green-400);
  color:#fff;
  box-shadow:0 2px 8px rgba(34,197,94,0.4);
}
.save-btn.saving{
  background:var(--amber-500);
  color:var(--navy-900);
  cursor:wait;
}

.card-body{padding:var(--space-4)}
.card-title{
  font-size:15px;
  font-weight:700;
  margin-bottom:8px;
  color:var(--navy-800);
  line-height:1.35;
  letter-spacing:-0.01em;
}
.card-price{
  color:var(--blue-500);
  font-size:21px;
  font-weight:800;
  margin-bottom:4px;
  letter-spacing:-0.02em;
}
.card-price-usd{color:var(--slate-400);font-size:12px;margin-bottom:12px;font-weight:500}
.card-meta{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.meta-tag{
  background:var(--slate-100);
  color:var(--slate-600);
  padding:4px 10px;
  border-radius:var(--radius-sm);
  font-size:11px;
  font-weight:600;
}
.meta-tag.loc{background:#fef3c7;color:#92400e}

/* ============================================================
   EMPTY / LOADING
   ============================================================ */
.empty,.loading{
  text-align:center;
  padding:80px 20px;
  color:var(--slate-400);
  font-size:15px;
  line-height:1.6;
  grid-column:1/-1;
}
.loading::before{
  content:'';
  display:block;
  width:32px;height:32px;
  border:3px solid var(--slate-200);
  border-top-color:var(--blue-400);
  border-radius:50%;
  margin:0 auto 16px;
  animation:spin 0.8s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}

/* ============================================================
   MOBILE MENU / HAMBURGER
   ============================================================ */
.hamburger{
  display:none;
  background:transparent;
  padding:10px;
  border-radius:var(--radius-sm);
  color:#fff;
}
.mobile-menu{
  display:none;
  background:var(--navy-800);
  padding:12px 20px;
  flex-direction:column;
  gap:4px;
  box-shadow:0 8px 24px rgba(10,23,41,0.3);
  border-top:1px solid rgba(255,255,255,0.06);
}
.mobile-menu.open{display:flex}
.mobile-menu a{
  color:#fff;
  padding:14px 12px;
  border-radius:var(--radius-sm);
  font-size:15px;
  font-weight:600;
  display:flex;
  align-items:center;
  gap:12px;
  transition:background 0.15s;
}
.mobile-menu a:hover{background:rgba(255,255,255,0.06)}

/* ============================================================
   RESPONSIVE
   ============================================================ */
@media (max-width:1100px){
  .search-row{grid-template-columns:1fr 1fr 1fr}
  .search-row button{grid-column:1/-1}
}

@media (max-width:900px){
  .categories{grid-template-columns:repeat(3,1fr)}
}

@media (max-width:768px){
  .top-bar{
    padding:10px 16px;
    font-size:11px;
    flex-direction:column;
    gap:6px;
    text-align:center;
  }
  .top-bar > div{justify-content:center !important;display:flex;flex-wrap:wrap;gap:14px}

  .brand-bar{
    padding:12px 16px;
    flex-direction:column;
    gap:12px;
  }
  .brand-logo{font-size:18px}
  .brand-toggle{width:100%}
  .brand-toggle button{padding:11px 8px;font-size:12px;flex:1;min-height:44px}
  .brand-actions{width:100%;justify-content:center;gap:10px}
  .brand-actions a{font-size:13px;padding:8px 12px;background:var(--slate-100);border-radius:var(--radius-sm);color:var(--navy-800)}
  .list-btn{background:linear-gradient(135deg,var(--orange-500),var(--orange-600)) !important;color:#fff !important}
  .hamburger{display:flex;align-items:center;justify-content:center;background:var(--navy-800);position:absolute;top:14px;right:16px;z-index:10}

  .fitment-bar{padding:14px 16px;flex-direction:column;gap:12px}
  .fitment-left{width:100%}
  .fitment-controls{width:100%;flex-direction:column;gap:8px}
  .fitment-controls select{width:100%;min-height:44px;font-size:14px}
  .fitment-controls button{min-height:44px;font-size:14px;width:100%}
  .fitment-filter-label{width:100%;justify-content:center}

  .hero{padding:40px 16px 80px}
  .hero h1{font-size:26px;line-height:1.2}
  .hero p{font-size:14px;padding:0 8px}
  .hero-badge{font-size:10px;padding:6px 14px}

  .search-container{padding:14px;border-radius:var(--radius-md)}
