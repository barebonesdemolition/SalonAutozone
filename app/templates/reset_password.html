<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Choose a new password · SalonAutoZone</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0e2a2b">
<link rel="icon" type="image/png" sizes="64x64" href="/static/icon-64.png">
<link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
<link rel="manifest" href="/static/manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&display=swap" data-saz-font media="print" onload="this.media='all'">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&display=swap"></noscript>
<link rel="stylesheet" href="/static/ui.css?v=7">
<link rel="stylesheet" href="/static/chrome.css?v=5">
<style>
.shell { display: flex; justify-content: center; padding: 28px 16px 56px; }
.card { width: 100%; max-width: 420px; }
.card h1 { font-size: 30px; font-variation-settings: "wdth" 78; }
.card .sub { color: var(--muted); margin-top: 6px; }
.steps { margin: 16px 0 0; padding-left: 20px; display: grid; gap: 6px; color: var(--text); }
.back { display: inline-block; margin-top: 18px; font-weight: 700; text-decoration: none; }
</style>
</head>
<body data-footer="off">
<div id="site-header"></div>
<main class="shell"><div class="card" id="app">
<h1>Choose a new password</h1>
<p class="sub" id="hello">Checking your link…</p>
<form id="f" novalidate hidden>
 <label class="field"><span>New password</span><input class="input" id="pw" type="password" required minlength="8" autocomplete="new-password"></label>
 <p class="hint">At least 8 characters.</p>
 <label class="field"><span>Type it again</span><input class="input" id="pw2" type="password" required minlength="8" autocomplete="new-password"></label>
 <button class="btn btn-primary btn-lg btn-block" style="margin-top:18px" type="submit" id="go">Save new password</button>
 <div id="msg" aria-live="polite"></div>
</form>
<div id="bad"></div>
</div></main>
<script src="/static/site.js?v=7"></script>
<script>
(function () {
 'use strict';

 function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
 function say(el, text, kind) { el.innerHTML = text ? '<div class="notice notice-' + (kind || 'bad') + '" style="margin-top:12px"></div>' : ''; if (text) el.firstChild.textContent = text; }
 function post(url, body, token) {
  var h = { 'Content-Type': 'application/json' }; if (token) h.Authorization = 'Bearer ' + token;
  return fetch(url, { method: 'POST', headers: h, body: JSON.stringify(body) }).then(function (r) {
   return r.json().catch(function () { return {}; }).then(function (d) {
    if (!r.ok) { var m = d.detail; if (Array.isArray(m)) m = 'Please check what you typed. Passwords need at least 8 characters.'; var e = new Error(typeof m === 'string' ? m : 'Something went wrong. Please try again.'); e.status = r.status; throw e; }
    return d;
   });
  }, function () { throw new Error('No connection. Check your internet and try again.'); });
 }
 function saveLogin(d) {
  try { localStorage.setItem('token', d.access_token); localStorage.setItem('access_token', d.access_token); if (d.user) localStorage.setItem('userInfo', JSON.stringify(d.user)); } catch (e) {}
 }

 var token = new URLSearchParams(location.search).get('token') || '';
 // Take the token out of the address bar so it isn't left in history or shared by accident.
 try { history.replaceState(null, '', '/reset-password'); } catch (e) {}
 var f = document.getElementById('f'), msg = document.getElementById('msg'), go = document.getElementById('go');
 function dead(text) {
  document.getElementById('hello').textContent = text;
  document.getElementById('bad').innerHTML = '<a class="btn btn-primary btn-block" style="margin-top:16px" href="/forgot-password">Ask for a new link</a><a class="back" href="/login">← Back to sign in</a>';
 }
 if (token.length < 20) { dead('This link isn\'t complete. Open the whole link from your WhatsApp message, or ask for a new one.'); return; }
 fetch('/api/auth/reset/' + encodeURIComponent(token)).then(function (r) { return r.json().then(function (d) { return { ok: r.ok, d: d }; }); }).then(function (x) {
  if (!x.ok) return dead(typeof x.d.detail === 'string' ? x.d.detail : 'This link has expired.');
  document.getElementById('hello').textContent = 'Hello' + (x.d.first_name ? ' ' + x.d.first_name : '') + '. Pick a password you haven\'t used here before.';
  f.hidden = false; document.getElementById('pw').focus();
 }).catch(function () { dead('No connection. Check your internet and open the link again.'); });
 f.addEventListener('submit', function (e) {
  e.preventDefault();
  var a = document.getElementById('pw').value, b = document.getElementById('pw2').value;
  if (a.length < 8) return say(msg, 'Your password needs at least 8 characters.');
  if (a !== b) return say(msg, 'The two passwords don\'t match.');
  go.disabled = true; say(msg, '');
  post('/api/auth/reset', { token: token, password: a }).then(function (d) {
   saveLogin(d);
   document.getElementById('app').innerHTML = '<h1>Password changed</h1><p class="sub">You\'re signed in. Use your new password next time.</p><a class="btn btn-primary btn-lg btn-block" style="margin-top:18px" href="/my-account">Go to my account</a>';
  }).catch(function (err) { say(msg, err.message); go.disabled = false; });
 });

})();
</script>
</body>
</html>
