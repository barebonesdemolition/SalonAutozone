<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>My Garage – SalonAutoZone</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--primary:#0f766e;--primary-hover:#0d9488;--primary-light:#ccfbf1;--navy:#0f172a;--muted:#64748b;--border:#e2e8f0;--bg:#f8fafc;--text:#1e293b;--sh:0 1px 2px rgba(15,23,42,.04),0 4px 12px rgba(15,23,42,.06)}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Inter,sans-serif;background:var(--bg);color:var(--text);padding-bottom:80px}
a{color:inherit;text-decoration:none}button,input{font:inherit}button{border:0;background:none;cursor:pointer}
.top{background:var(--navy);color:#94a3b8;padding:10px 20px;font-size:12px;display:flex;justify-content:space-between}
.top strong{color:#fff}
.brand{background:#fff;padding:14px 20px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px}
.logo{font-weight:800;font-size:18px}.logo span{color:var(--primary)}
.wrap{max-width:800px;margin:0 auto;padding:24px 16px}
h1{font-size:24px;font-weight:800;margin-bottom:6px}
.sub{color:var(--muted);margin-bottom:20px}
.panel{background:#fff;border:1px solid var(--border);border-radius:14px;padding:18px;box-shadow:var(--sh);margin-bottom:16px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:600px){.row{grid-template-columns:1fr}}
.lbl{font-size:13px;font-weight:600;color:#475569;display:block;margin-bottom:6px}
.inp{width:100%;padding:11px 12px;border:1.5px solid var(--border);border-radius:8px;min-height:44px}
.btn{display:inline-flex;padding:12px 18px;border-radius:8px;font-weight:700;min-height:44px}
.btn-primary{background:var(--primary);color:#fff}
.grid{display:grid;gap:12px}
.card{background:#fff;border:1px solid var(--border);border-radius:12px;padding:16px;box-shadow:var(--sh)}
.card h3{font-size:16px;font-weight:700}
.meta{font-size:13px;color:var(--muted);margin-top:4px}
.acts{display:flex;gap:8px;margin-top:12px}
.acts a,.acts button{flex:1;text-align:center;padding:10px;border-radius:8px;font-weight:700;font-size:13px;background:#f1f5f9;min-height:40px}
.badge{display:inline-block;padding:2px 8px;border-radius:99px;font-size:11px;font-weight:700;background:var(--primary-light);color:var(--primary)}
.empty{text-align:center;padding:32px;color:var(--muted)}
.bnav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--border);padding:6px 8px env(safe-area-inset-bottom,8px)}
.bnav nav{display:grid;grid-template-columns:repeat(4,1fr);max-width:500px;margin:0 auto}
.bnav a{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px;font-size:11px;font-weight:700;color:var(--muted);min-height:52px;justify-content:center}
.bnav a.active{color:var(--primary);background:var(--primary-light);border-radius:10px}
.bnav svg{width:22px;height:22px}
.toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--navy);color:#fff;padding:12px 18px;border-radius:10px;font-weight:600;transition:transform .25s;z-index:99}
.toast.show{transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>
<div class="top"><strong>Salon AutoZone</strong><span>Freetown</span></div>
<header class="brand">
  <a class="logo" href="/">Salon<span>AutoZone</span></a>
  <a href="/my-account" style="font-weight:600;color:#475569">Account</a>
</header>
<main class="wrap">
  <h1>My Garage</h1>
  <p class="sub">Save your cars so parts search shows what fits.</p>
  <div class="panel">
    <form id="f">
      <div class="row">
        <div><label class="lbl">Make *</label><input class="inp" name="make" required placeholder="Toyota"></div>
        <div><label class="lbl">Model *</label><input class="inp" name="model" required placeholder="Corolla"></div>
      </div>
      <div class="row" style="margin-top:10px">
        <div><label class="lbl">Year *</label><input class="inp" name="year" type="number" required min="1980" max="2030" placeholder="2015"></div>
        <div><label class="lbl">Nickname</label><input class="inp" name="nickname" placeholder="My daily"></div>
      </div>
      <label style="display:flex;gap:8px;align-items:center;margin:12px 0;font-weight:600;font-size:14px">
        <input type="checkbox" name="is_primary"> Primary vehicle
      </label>
      <button class="btn btn-primary" type="submit">Add to garage</button>
    </form>
  </div>
  <div class="grid" id="list"></div>
</main>
<div class="bnav"><nav>
  <a href="/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1v-9.5z"/></svg>Home</a>
  <a href="/garage" class="active"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 17h14v-5l-2-5H7l-2 5v5z"/><circle cx="7" cy="17" r="2"/><circle cx="17" cy="17" r="2"/></svg>Garage</a>
  <a href="/my-account"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21H5a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2h3l2-2h4l2 2h3a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2z"/><circle cx="12" cy="13" r="3"/></svg>Saved</a>
  <a href="/my-account"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21v-1a7 7 0 0 1 14 0v1"/></svg>Account</a>
</nav></div>
<div class="toast" id="toast"></div>
<script>
(function(){
  function token(){try{return localStorage.getItem('token')||localStorage.getItem('access_token')||''}catch(e){return ''}}
  function auth(){var t=token();return t?{Authorization:'Bearer '+t}:{}}
  function toast(m){var t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(function(){t.classList.remove('show')},2500)}
  function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;')}
  if(!token()){location.href='/login?next=/garage';return}
  function load(){
    fetch('/api/garage/',{headers:auth()}).then(function(r){if(r.status===401){location.href='/login';return[]}return r.ok?r.json():[]}).then(function(cars){
      var el=document.getElementById('list');
      cars=cars||[];
      if(!cars.length){el.innerHTML='<div class="empty">No vehicles yet. Add your car above.</div>';return}
      el.innerHTML=cars.map(function(c){
        return '<div class="card"><h3>'+esc(c.year+' '+c.make+' '+c.model)+'</h3><div class="meta">'+esc(c.nickname||'')+(c.is_primary?' · <span class="badge">Primary</span>':'')+'</div><div class="acts"><a href="/">Find parts</a><button type="button" data-id="'+c.id+'">Remove</button></div></div>'
      }).join('');
      el.querySelectorAll('[data-id]').forEach(function(b){b.onclick=function(){
        if(!confirm('Remove?'))return;
        fetch('/api/garage/'+b.dataset.id,{method:'DELETE',headers:auth()}).then(function(r){if(r.ok){toast('Removed');load()}else toast('Failed')})
      }})
    })
  }
  document.getElementById('f').onsubmit=function(e){
    e.preventDefault();
    var fd=new FormData(e.target);
    var body={make:fd.get('make'),model:fd.get('model'),year:parseInt(fd.get('year'),10),nickname:fd.get('nickname')||null,is_primary:!!fd.get('is_primary')};
    fetch('/api/garage/',{method:'POST',headers:Object.assign({'Content-Type':'application/json'},auth()),body:JSON.stringify(body)})
      .then(function(r){if(!r.ok)throw 0;toast('Saved');e.target.reset();load()}).catch(function(){toast('Could not save')})
  };
  load();
})();
</script>
</body>
</html>
