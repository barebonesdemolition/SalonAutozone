<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>My Garage · SalonAutoZone</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%230b1e3a'/><text x='50' y='68' font-size='60' font-weight='900' text-anchor='middle' fill='%2300a8e8' font-family='Arial'>S</text></svg>">
<style>
:root{
  --navy-900:#0a1729;--navy-800:#0b1e3a;--navy-700:#12294d;--navy-600:#1a3a6b;
  --blue-500:#0091d5;--blue-400:#00a8e8;--blue-300:#4dc3f0;
  --amber-500:#ffb800;--amber-600:#f59e0b;
  --orange-500:#ff6b00;--orange-600:#e55a00;
  --green-500:#16a34a;--green-400:#22c55e;
  --red-500:#dc2626;
  --slate-50:#f8fafc;--slate-100:#f1f5f9;--slate-200:#e2e8f0;--slate-300:#cbd5e1;
  --slate-400:#94a3b8;--slate-500:#64748b;--slate-600:#475569;--slate-700:#334155;
  --slate-800:#1e293b;--slate-900:#0f172a;
  --shadow-sm:0 1px 2px rgba(15,23,42,0.04),0 1px 3px rgba(15,23,42,0.06);
  --shadow-md:0 2px 4px rgba(15,23,42,0.04),0 4px 12px rgba(15,23,42,0.06);
  --shadow-lg:0 4px 8px rgba(15,23,42,0.06),0 12px 28px rgba(15,23,42,0.10);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;font-size:15px;line-height:1.5;color:var(--slate-800);background:var(--slate-50);-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;letter-spacing:-0.01em}
button,input,select,textarea{font-family:inherit;font-size:inherit}
button{cursor:pointer;border:none;background:none}
a{color:inherit;text-decoration:none}
.navbar{background:var(--navy-800);color:#fff;padding:14px 32px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px}
.logo{font-size:18px;font-weight:800;color:var(--blue-400);text-decoration:none;letter-spacing:-0.03em}
.logo span{color:var(--amber-500)}
.nav-links{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.navbar a{color:#fff;text-decoration:none;font-size:13px;font-weight:600;padding:9px 14px;border-radius:8px;background:rgba(255,255,255,0.08);transition:background 0.15s}
.navbar a:hover{background:rgba(255,255,255,0.18)}
.container{max-width:1000px;margin:24px auto;padding:0 20px}
.garage-hero{background:linear-gradient(135deg,var(--navy-800) 0%,var(--navy-600) 100%);color:#fff;padding:44px 32px;border-radius:20px;margin-bottom:28px;text-align:center;position:relative;overflow:hidden}
.garage-hero::before{content:'';position:absolute;inset:0;background:radial-gradient(circle at 20% 20%,rgba(0,168,232,0.2) 0%,transparent 50%),radial-gradient(circle at 80% 80%,rgba(255,184,0,0.1) 0%,transparent 50%);pointer-events:none}
.garage-hero > *{position:relative;z-index:1}
.garage-hero h1{font-size:32px;margin-bottom:8px;font-weight:800;letter-spacing:-0.03em}
.garage-hero p{opacity:0.85;font-size:15px}
.add-card{background:#fff;border-radius:16px;padding:28px;box-shadow:var(--shadow-sm);margin-bottom:28px;border:1px solid var(--slate-200)}
.add-card h2{color:var(--navy-800);font-size:18px;margin-bottom:20px;font-weight:800;letter-spacing:-0.02em}
.form-row{display:grid;grid-template-columns:1.2fr 1.2fr 0.8fr 1.2fr auto;gap:12px;align-items:end}
.form-field label{display:block;font-size:11px;font-weight:700;color:var(--slate-500);margin-bottom:6px;text-transform:uppercase;letter-spacing:0.06em}
.form-field select,.form-field input{width:100%;padding:13px 14px;border:1.5px solid var(--slate-200);border-radius:8px;font-size:15px;font-family:inherit;background:#fff;transition:border-color 0.15s,box-shadow 0.15s}
.form-field select:focus,.form-field input:focus{outline:none;border-color:var(--blue-400);box-shadow:0 0 0 4px rgba(0,168,232,0.12)}
.btn-primary{background:linear-gradient(135deg,var(--orange-500),var(--orange-600));color:#fff;border:none;padding:14px 28px;border-radius:8px;font-weight:700;cursor:pointer;font-size:15px;min-height:48px;white-space:nowrap;box-shadow:0 4px 12px rgba(255,107,0,0.28);transition:transform 0.15s,box-shadow 0.15s}
.btn-primary:hover{transform:translateY(-1px);box-shadow:0 6px 18px rgba(255,107,0,0.35)}
.btn-primary:disabled{opacity:0.6;cursor:not-allowed;transform:none}
.cars-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
.car-card{background:#fff;border-radius:16px;padding:24px;box-shadow:var(--shadow-sm);position:relative;border-left:4px solid var(--blue-400);transition:transform 0.15s,box-shadow 0.15s;border-top:1px solid var(--slate-200);border-right:1px solid var(--slate-200);border-bottom:1px solid var(--slate-200)}
.car-card:hover{transform:translateY(-3px);box-shadow:var(--shadow-lg)}
.car-card.primary{border-left-color:var(--green-400);background:linear-gradient(135deg,#ffffff,#f0fdf4)}
.car-card .primary-badge{position:absolute;top:14px;right:14px;background:var(--green-400);color:#fff;padding:5px 12px;border-radius:9999px;font-size:10px;font-weight:800;letter-spacing:0.06em}
.car-icon{font-size:36px;margin-bottom:10px}
.car-title{font-size:19px;font-weight:800;color:var(--navy-800);margin-bottom:6px;letter-spacing:-0.02em}
.car-nickname{font-size:13px;color:var(--slate-500);font-style:italic;margin-bottom:12px}
.car-meta{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:18px}
.car-meta .tag{background:var(--slate-100);color:var(--slate-600);padding:5px 11px;border-radius:6px;font-size:11px;font-weight:700}
.car-actions{display:flex;gap:6px;flex-wrap:wrap}
.car-actions button{flex:1;min-width:110px;padding:11px 14px;border:none;border-radius:8px;font-weight:700;cursor:pointer;font-size:12px;min-height:44px;transition:opacity 0.15s,transform 0.15s}
.car-actions button:hover:not(:disabled){opacity:0.9;transform:translateY(-1px)}
.btn-primary-action{background:var(--green-400);color:#fff}
.btn-remove{background:#fef2f2;color:var(--red-500)}
.empty-state{text-align:center;padding:64px 24px;background:#fff;border-radius:16px;box-shadow:var(--shadow-sm);border:1px solid var(--slate-200)}
.empty-icon{font-size:64px;margin-bottom:16px;opacity:0.4}
.empty-state h3{font-size:20px;color:var(--navy-800);margin-bottom:8px;font-weight:800;letter-spacing:-0.02em}
.empty-state p{color:var(--slate-500);font-size:14px;margin-bottom:24px}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(100px);background:var(--navy-800);color:#fff;padding:14px 24px;border-radius:10px;font-weight:600;font-size:14px;box-shadow:var(--shadow-lg);transition:transform 0.3s,opacity 0.3s;opacity:0;z-index:9999;pointer-events:none;max-width:90vw;text-align:center}
.toast.show{transform:translateX(-50%) translateY(0);opacity:1}
.toast.success{background:var(--green-500)}
.toast.error{background:var(--red-500)}
@media (max-width:768px){
  .navbar{padding:12px 16px;flex-direction:column}
  .nav-links{width:100%;justify-content:center}
  .container{padding:0 14px}
  .garage-hero{padding:32px 20px;border-radius:16px}
  .garage-hero h1{font-size:24px}
  .garage-hero p{font-size:14px}
  .add-card{padding:20px}
  .form-row{grid-template-columns:1fr;gap:10px}
  .btn-primary{width:100%}
  .cars-grid{grid-template-columns:1fr}
}
</style>
</head>
<body>

<div class="navbar">
  <a href="/" class="logo">Salon<span>AutoZone</span></a>
  <div class="nav-links">
    <a href="/">🏠 Home</a>
    <a href="/my-account">👤 My Account</a>
    <a href="/garage">🚗 My Garage</a>
  </div>
</div>

<div class="container">
  <div class="garage-hero">
    <h1>🚗 My Garage</h1>
    <p>Save your vehicles to get exact-fit parts and personalized recommendations</p>
  </div>

  <div class="add-card">
    <h2>➕ Add a Vehicle</h2>
    <form id="add-car-form">
      <div class="form-row">
        <div class="form-field">
          <label>Make</label>
          <select id="garage-make" required>
            <option value="">Select Make</option>
          </select>
        </div>
        <div class="form-field">
          <label>Model</label>
          <select id="garage-model" required>
            <option value="">Select Make First</option>
          </select>
        </div>
        <div class="form-field">
          <label>Year</label>
          <select id="garage-year" required>
            <option value="">Select Year</option>
          </select>
        </div>
        <div class="form-field">
          <label>Nickname (optional)</label>
          <input type="text" id="garage-nickname" placeholder="e.g. Daily Driver" maxlength="40">
        </div>
        <button type="submit" class="btn-primary" id="add-car-btn">Add Car</button>
      </div>
    </form>
  </div>

  <div id="garage-content">
    <div class="empty-state">
      <div class="empty-icon">⏳</div>
      <h3>Loading your cars…</h3>
    </div>
  </div>
</div>

<div id="toast" class="toast"></div>

<script>
(function () {
  'use strict';

  var MAKES = ["Toyota","Nissan","Honda","Mitsubishi","Mazda","Suzuki","Subaru","Isuzu","Daihatsu","Lexus","Hyundai","Kia","Genesis","Mercedes-Benz","BMW","Volkswagen","Audi","Porsche","Ford","Chevrolet","Jeep","Peugeot","Renault","Citroen","Land Rover","Jaguar","Volvo","Chery","Geely","Great Wall","BYD","MG","Other"];
  var MODELS = {
    "Toyota":["Corolla","Camry","Hilux","RAV4","Land Cruiser","Prado","Vitz","Yaris","Avensis","Prius","Highlander","Fortuner","Hiace"],
    "Nissan":["X-Trail","Altima","Sunny","Patrol","Navara","Qashqai","Juke","Note","Murano","Sentra"],
    "Honda":["Civic","Accord","CR-V","Fit","Jazz","City","Pilot","HR-V"],
    "Mitsubishi":["Pajero","Lancer","Outlander","L200","ASX"],
    "Mazda":["CX-5","CX-9","Mazda3","Mazda6","BT-50"],
    "Suzuki":["Swift","Vitara","Jimny","SX4","Alto"],
    "Subaru":["Forester","Outback","Impreza","Legacy"],
    "Isuzu":["D-Max","MU-X","Trooper"],
    "Daihatsu":["Terios","Sirion","Cuore"],
    "Lexus":["RX","NX","ES","IS","GX","LX"],
    "Hyundai":["Tucson","Santa Fe","Elantra","Sonata","i10","i20","Accent","Creta","Kona"],
    "Kia":["Sportage","Sorento","Rio","Cerato","Soul","Seltos","Picanto"],
    "Genesis":["G70","G80","G90"],
    "Mercedes-Benz":["C-Class","E-Class","S-Class","GLC","GLE","GLS","A-Class","ML","G-Class","Sprinter"],
    "BMW":["3 Series","5 Series","7 Series","X1","X3","X5","X6","X7"],
    "Volkswagen":["Golf","Passat","Tiguan","Polo","Jetta","Touareg"],
    "Audi":["A3","A4","A6","Q3","Q5","Q7"],
    "Porsche":["911","Cayenne","Macan","Panamera"],
    "Ford":["Focus","Fiesta","F-150","Ranger","Explorer","Escape","Mustang"],
    "Chevrolet":["Silverado","Cruze","Malibu","Equinox","Tahoe","Spark"],
    "Jeep":["Wrangler","Grand Cherokee","Cherokee","Compass"],
    "Peugeot":["208","308","3008","5008","Partner"],
    "Renault":["Clio","Megane","Duster","Captur","Logan"],
    "Citroen":["C3","C4","C5","Berlingo"],
    "Land Rover":["Defender","Discovery","Range Rover","Range Rover Sport","Evoque"],
    "Jaguar":["XE","XF","XJ","F-Pace","E-Pace"],
    "Volvo":["XC40","XC60","XC90","S60","S90"],
    "Chery":["Tiggo 4","Tiggo 7","Tiggo 8","Arrizo 5"],
    "Geely":["Coolray","Azkarra","Tugella","Emgrand"],
    "Great Wall":["Wingle","Poer","Haval H6","Haval Jolion"],
    "BYD":["Atto 3","Han","Tang","Song","Seal"],
    "MG":["ZS","HS","MG5","MG6"],
    "Other":["Other"]
  };
  var YEARS = (function () { var a = []; for (var y = 2026; y >= 1980; y--) a.push(y); return a; })();

  function esc(s) {
    if (s === null || s === undefined) return '';
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function getToken() { try { return localStorage.getItem('token') || ''; } catch (e) { return ''; } }
  function showToast(msg, type) {
    var t = document.getElementById('toast');
    t.innerText = msg;
    t.className = 'toast show ' + (type || '');
    clearTimeout(t._timer);
    t._timer = setTimeout(function () { t.className = 'toast'; }, 2600);
  }
  async function apiFetch(url, options) {
    var opts = options || {};
    opts.headers = Object.assign({}, opts.headers || {}, { 'Authorization': 'Bearer ' + getToken() });
    var res = await fetch(url, opts);
    if (res.status === 401) { window.location.href = '/login?next=/garage'; throw new Error('Unauthorized'); }
    if (!res.ok) {
      var err = await res.json().catch(function() { return {}; });
      throw new Error(err.detail || 'Request failed: ' + res.status);
    }
    return res.json();
  }

  function initSelects() {
    var makeSel = document.getElementById('garage-make');
    var modelSel = document.getElementById('garage-model');
    var yearSel = document.getElementById('garage-year');
    var mHtml = '<option value="">Select Make</option>';
    MAKES.forEach(function (m) { mHtml += '<option value="' + esc(m) + '">' + esc(m) + '</option>'; });
    makeSel.innerHTML = mHtml;
    var yHtml = '<option value="">Select Year</option>';
    YEARS.forEach(function (y) { yHtml += '<option value="' + y + '">' + y + '</option>'; });
    yearSel.innerHTML = yHtml;
    makeSel.addEventListener('change', function () {
      var make = this.value;
      if (!make) { modelSel.innerHTML = '<option value="">Select Make First</option>'; return; }
      var models = MODELS[make] || ['Other'];
      var html = '<option value="">Select Model</option>';
      models.forEach(function (m) { html += '<option value="' + esc(m) + '">' + esc(m) + '</option>'; });
      modelSel.innerHTML = html;
    });
  }

  function renderCars(cars) {
    var el = document.getElementById('garage-content');
    if (!cars || cars.length === 0) {
      el.innerHTML = '<div class="empty-state"><div class="empty-icon">🚗</div><h3>Your garage is empty</h3><p>Add your first vehicle above to start finding exact-fit parts.</p></div>';
      return;
    }
    var html = '<div class="cars-grid">';
    cars.forEach(function (c) {
      html += '<div class="car-card' + (c.is_primary ? ' primary' : '') + '">';
      if (c.is_primary) html += '<span class="primary-badge">PRIMARY</span>';
      html += '<div class="car-icon">🚗</div>';
      html += '<div class="car-title">' + esc(c.year + ' ' + c.make + ' ' + c.model) + '</div>';
      if (c.nickname) html += '<div class="car-nickname">"' + esc(c.nickname) + '"</div>';
      html += '<div class="car-meta">';
      html += '<span class="tag">' + esc(c.make) + '</span>';
      html += '<span class="tag">' + esc(c.model) + '</span>';
      html += '<span class="tag">' + c.year + '</span>';
      html += '</div>';
      html += '<div class="car-actions">';
      if (!c.is_primary) html += '<button class="btn-primary-action" data-action="set-primary" data-id="' + c.id + '">⭐ Set as Primary</button>';
      html += '<button class="btn-remove" data-action="delete" data-id="' + c.id + '">🗑 Remove</button>';
      html += '</div>';
      html += '</div>';
    });
    html += '</div>';
    el.innerHTML = html;
  }

  async function loadCars() {
    try {
      var cars = await apiFetch('/api/garage/');
      renderCars(cars);
      var primary = cars.find(function (c) { return c.is_primary; });
      if (primary) {
        try {
          localStorage.setItem('fitmentVehicle', JSON.stringify({ make: primary.make, model: primary.model, year: primary.year }));
        } catch (e) {}
      }
    } catch (err) {
      document.getElementById('garage-content').innerHTML =
        '<div class="empty-state"><div class="empty-icon">⚠️</div><h3>Could not load your garage</h3><p>' + esc(err.message) + '</p><button class="btn-primary" onclick="location.reload()">Retry</button></div>';
    }
  }

  document.getElementById('add-car-form').addEventListener('submit', async function (e) {
    e.preventDefault();
    var btn = document.getElementById('add-car-btn');
    var make = document.getElementById('garage-make').value;
    var model = document.getElementById('garage-model').value;
    var year = parseInt(document.getElementById('garage-year').value, 10);
    var nickname = document.getElementById('garage-nickname').value.trim();
    if (!make || !model || !year) { showToast('Please select make, model, and year', 'error'); return; }
    btn.disabled = true;
    btn.innerText = 'Adding…';
    try {
      await apiFetch('/api/garage/', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ make: make, model: model, year: year, nickname: nickname || null, is_primary: false })
      });
      document.getElementById('add-car-form').reset();
      document.getElementById('garage-model').innerHTML = '<option value="">Select Make First</option>';
      showToast('✅ Car added to your garage', 'success');
      await loadCars();
    } catch (err) { showToast('❌ ' + err.message, 'error'); }
    finally { btn.disabled = false; btn.innerText = 'Add Car'; }
  });

  document.addEventListener('click', async function (e) {
    var btn = e.target.closest('[data-action]');
    if (!btn) return;
    e.preventDefault();
    var action = btn.dataset.action;
    var id = btn.dataset.id;
    if (action === 'delete') {
      if (!confirm('Remove this car from your garage?')) return;
      btn.disabled = true;
      try {
        await apiFetch('/api/garage/' + encodeURIComponent(id), { method: 'DELETE' });
        showToast('🗑 Car removed', 'success');
        await loadCars();
      } catch (err) { showToast('❌ ' + err.message, 'error'); btn.disabled = false; }
    } else if (action === 'set-primary') {
      btn.disabled = true;
      try {
        await apiFetch('/api/garage/' + encodeURIComponent(id) + '/primary', { method: 'PUT' });
        showToast('⭐ Primary car updated', 'success');
        await loadCars();
      } catch (err) { showToast('❌ ' + err.message, 'error'); btn.disabled = false; }
    }
  });

  if (!getToken()) window.location.href = '/login?next=/garage';
  else { initSelects(); loadCars(); }
})();
</script>
</body>
</html>
