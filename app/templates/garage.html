<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>My garage · SalonAutoZone</title>
<meta name="theme-color" content="#0e2a2b">
<link rel="icon" type="image/png" href="/static/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&display=swap" data-saz-font>
<link rel="stylesheet" href="/static/ui.css?v=6">
<link rel="stylesheet" href="/static/chrome.css?v=5">
<style>
.page-head { padding: 22px 0 8px; display: flex; gap: 12px; align-items: flex-end; justify-content: space-between; flex-wrap: wrap; }
.page-head h1 { font-size: clamp(28px, 5vw, 40px); font-variation-settings: "wdth" 78; }
.page-head p { color: var(--muted); margin-top: 4px; max-width: 52ch; }
.cars { display: grid; gap: 12px; margin-top: 14px; }
@media (min-width: 760px) { .cars { grid-template-columns: 1fr 1fr; } }
.car { background: var(--card); border: 1px solid var(--line); border-radius: var(--r-md); padding: 16px; display: grid; gap: 12px; }
.car.primary { border-color: var(--gold); box-shadow: 0 0 0 1px var(--gold); }
.plate { display: inline-flex; align-items: stretch; border-radius: 9px; overflow: hidden; border: 2px solid var(--gold); background: var(--gold); color: var(--ink); max-width: 100%; }
.plate .tag { display: flex; align-items: center; padding: 0 9px; background: var(--ink); color: var(--gold); font-weight: 800; font-size: 11px; font-variation-settings: "wdth" 75; white-space: nowrap; }
.plate .val { padding: 6px 12px; font-weight: 800; font-size: 19px; font-variation-settings: "wdth" 80; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.plate.plain { background: var(--card); border-color: var(--line); }
.plate.plain .tag { background: var(--paper); color: var(--muted); }
.car .sub { color: var(--muted); font-size: 14px; }
.car .vin { font-weight: 700; letter-spacing: .08em; color: var(--ink); }
.car .ops { display: flex; gap: 6px; flex-wrap: wrap; }
.car .ops .btn { min-height: 38px; padding: 6px 12px; font-size: 14px; }
.add { margin-top: 22px; padding: 18px; }
.add h2 { font-size: 22px; }
.grid3 { display: grid; gap: 0 12px; grid-template-columns: 1fr; }
@media (min-width: 560px) { .grid3 { grid-template-columns: 1fr 1fr 1fr; } }
.vin-row { display: flex; gap: 8px; }
.vin-row .input { text-transform: uppercase; letter-spacing: .08em; font-weight: 700; }
.check { display: flex; gap: 10px; align-items: center; margin-top: 14px; font-weight: 600; }
.check input { width: 20px; height: 20px; accent-color: var(--teal); }
.status { margin-top: 10px; font-weight: 600; }
.status.err { color: var(--bad); }
.status.ok { color: var(--ok); }
.empty { text-align: center; padding: 36px 16px; background: var(--card); border: 1px solid var(--line); border-radius: var(--r-md); margin-top: 14px; }
.empty h2 { font-size: 22px; }
.empty p { color: var(--muted); margin-top: 6px; }
</style>
</head>
<body>
<div id="site-header"></div>
<main class="wrap">
 <div class="page-head">
  <div>
   <h1>My garage</h1>
   <p>Save the cars you look after. Your main car is used to mark the parts that fit across the site.</p>
  </div>
 </div>
 <div id="list"><div class="lcard skeleton" style="min-height:120px;margin-top:14px"></div></div>

 <section class="box add" id="add">
  <h2 id="form-title">Add a car</h2>
  <form id="car-form" novalidate>
   <label class="field"><span>VIN (optional)</span>
    <div class="vin-row"><input class="input" id="vin" maxlength="17" placeholder="17-character VIN" autocomplete="off"><button type="button" class="btn btn-ghost" id="fill">Fill in</button></div>
   </label>
   <div class="grid3">
    <label class="field"><span>Make</span><select class="select" id="make"></select></label>
    <label class="field"><span>Model</span><input class="input" id="model" list="models" placeholder="Corolla"></label>
    <label class="field"><span>Year</span><select class="select" id="year"></select></label>
   </div>
   <datalist id="models"></datalist>
   <label class="field"><span>Nickname (optional)</span><input class="input" id="nickname" maxlength="40" placeholder="Work car, Mum's Prado…"></label>
   <label class="check"><input type="checkbox" id="primary"> This is my main car</label>
   <div style="display:flex;gap:8px;margin-top:18px;flex-wrap:wrap">
    <button class="btn btn-primary btn-lg" type="submit" id="save">Save car</button>
    <button class="btn btn-ghost btn-lg" type="button" id="cancel" hidden>Cancel</button>
   </div>
   <div class="status" id="status" aria-live="polite"></div>
  </form>
 </section>
</main>
<script src="/static/site.js?v=4"></script>
<script>
(function () {
 'use strict';
 var token = '';
 try { token = localStorage.getItem('token') || localStorage.getItem('access_token') || ''; } catch (e) {}
 if (!token) { location.replace('/login?next=/garage'); return; }
 var $ = function (id) { return document.getElementById(id); };
 var RAW = 'Toyota:Corolla,Camry,Hilux,RAV4,Land Cruiser,Prado,Vitz,Yaris,Avensis,Prius,Highlander,Hiace;Nissan:X-Trail,Altima,Sunny,Patrol,Navara,Qashqai,Juke,Note,Murano;Honda:Civic,Accord,CR-V,Fit,Jazz,Pilot;Mitsubishi:Pajero,Lancer,Outlander,L200;Mazda:CX-5,Mazda3,Mazda6,BT-50;Suzuki:Swift,Vitara,Jimny,Alto;Subaru:Forester,Outback,Impreza;Isuzu:D-Max,MU-X,Trooper;Lexus:RX,NX,ES,GX,LX;Hyundai:Tucson,Santa Fe,Elantra,Sonata,i10,Accent,Creta;Kia:Sportage,Sorento,Rio,Cerato,Picanto;Mercedes-Benz:C-Class,E-Class,S-Class,GLC,GLE,ML,G-Class,Sprinter;BMW:3 Series,5 Series,X3,X5,X6;Volkswagen:Golf,Passat,Tiguan,Polo,Jetta;Audi:A3,A4,A6,Q5,Q7;Ford:Focus,Fiesta,Ranger,Explorer,Escape;Chevrolet:Cruze,Malibu,Equinox,Tahoe;Jeep:Wrangler,Grand Cherokee;Peugeot:208,308,3008,Partner;Renault:Clio,Duster,Logan;Land Rover:Defender,Discovery,Range Rover,Evoque;Volvo:XC60,XC90;Chery:Tiggo 4,Tiggo 7;Geely:Coolray,Emgrand;BYD:Atto 3,Han,Seal';
 var MAKES = [], MODELS = {};
 RAW.split(';').forEach(function (p) { var a = p.split(':'); MAKES.push(a[0]); MODELS[a[0]] = a[1].split(','); });
 MAKES.push('Other');
 var cars = [], editing = null;

 function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
 function opts(list, first) { return '<option value="">' + esc(first) + '</option>' + list.map(function (v) { return '<option value="' + esc(v) + '">' + esc(v) + '</option>'; }).join(''); }
 function setStatus(m, k) { $('status').textContent = m; $('status').className = 'status' + (k ? ' ' + k : ''); }
 function api(url, opts) {
  opts = opts || {};
  opts.headers = Object.assign({ Authorization: 'Bearer ' + token }, opts.body ? { 'Content-Type': 'application/json' } : {}, opts.headers || {});
  return fetch(url, opts).then(function (r) {
   if (r.status === 401) { location.href = '/login?next=/garage'; throw null; }
   return r.json().catch(function () { return {}; }).then(function (d) {
    if (!r.ok) throw new Error(typeof d.detail === 'string' ? d.detail : 'Please check the details and try again.');
    return d;
   });
  });
 }
 function syncFitment() {
  var main = cars.find(function (c) { return c.is_primary; }) || cars[0];
  try {
   if (main) localStorage.setItem('fitmentVehicle', JSON.stringify({ make: main.make, model: main.model, year: String(main.year) }));
   else localStorage.removeItem('fitmentVehicle');
  } catch (e) {}
 }
 function shopUrl(c) { var q = new URLSearchParams({ make: c.make, model: c.model, year: String(c.year) }); return '/?' + q.toString(); }

 function render() {
  if (!cars.length) {
   $('list').innerHTML = '<div class="empty"><h2>No cars yet</h2><p>Add your car below and we\'ll mark the parts that fit it.</p></div>';
   return;
  }
  $('list').innerHTML = '<div class="cars">' + cars.map(function (c) {
   var name = [c.year, c.make, c.model].join(' ');
   return '<article class="car' + (c.is_primary ? ' primary' : '') + '">' +
    '<div><span class="plate' + (c.is_primary ? '' : ' plain') + '"><span class="tag">' + (c.is_primary ? 'MAIN CAR' : 'CAR') + '</span><span class="val">' + esc(name) + '</span></span></div>' +
    '<div>' + (c.nickname ? '<div style="font-weight:700;color:var(--ink)">' + esc(c.nickname) + '</div>' : '') +
     (c.vin ? '<div class="sub">VIN <span class="vin">' + esc(c.vin) + '</span></div>' : '<div class="sub">No VIN saved</div>') + '</div>' +
    '<div class="ops">' +
     '<a class="btn btn-primary" href="' + shopUrl(c) + '">Shop parts</a>' +
     (c.vin ? '<a class="btn btn-ghost" href="/vin-tool?vin=' + encodeURIComponent(c.vin) + '">VIN report</a>' : '') +
     (c.is_primary ? '' : '<button class="btn btn-ghost" data-primary="' + c.id + '">Make main car</button>') +
     '<button class="btn btn-ghost" data-edit="' + c.id + '">Edit</button>' +
     '<button class="btn btn-ghost" data-del="' + c.id + '">Remove</button>' +
    '</div></article>';
  }).join('') + '</div>';
 }
 function load() {
  return api('/api/garage/').then(function (list) { cars = list || []; syncFitment(); render(); })
   .catch(function (e) { if (e) $('list').innerHTML = '<div class="notice notice-bad" style="margin-top:14px">We couldn\'t load your cars. Try again in a moment.</div>'; });
 }

 // ---- form ----
 $('make').innerHTML = opts(MAKES, 'Choose a make');
 var years = []; for (var y = new Date().getFullYear() + 1; y >= 1975; y--) years.push(y);
 $('year').innerHTML = opts(years, 'Choose a year');
 $('make').addEventListener('change', function () { $('models').innerHTML = (MODELS[this.value] || []).map(function (m) { return '<option value="' + esc(m) + '">'; }).join(''); });
 function setMake(make) {
  var match = MAKES.find(function (m) { return m.toLowerCase() === String(make || '').toLowerCase(); });
  if (!match && make) { match = make.charAt(0).toUpperCase() + make.slice(1).toLowerCase(); $('make').add(new Option(match, match)); }
  $('make').value = match || '';
  $('make').dispatchEvent(new Event('change'));
 }
 function resetForm() {
  editing = null;
  $('car-form').reset();
  $('form-title').textContent = 'Add a car';
  $('save').textContent = 'Save car';
  $('cancel').hidden = true;
  $('primary').checked = !cars.length;
 }
 $('cancel').addEventListener('click', function () { resetForm(); setStatus(''); });

 $('fill').addEventListener('click', function () {
  var vin = $('vin').value.replace(/\s+/g, '').toUpperCase();
  if (vin.length !== 17) { setStatus('A VIN has 17 characters.', 'err'); return; }
  setStatus('Reading the VIN…');
  fetch('/api/vin/decode/' + encodeURIComponent(vin)).then(function (r) { return r.json().then(function (d) { if (!r.ok) throw new Error(d.detail || 'We couldn\'t read this VIN.'); return d; }); })
   .then(function (d) {
    if (d.make) setMake(d.make);
    if (d.model) $('model').value = d.model;
    if (d.year) $('year').value = d.year;
    setStatus(d.model ? 'Filled in from the VIN. Check it\'s right.' : 'We found the make and year. Please add the model.', 'ok');
   }).catch(function (e) { setStatus(e.message, 'err'); });
 });

 $('car-form').addEventListener('submit', function (e) {
  e.preventDefault();
  var body = {
   make: $('make').value, model: $('model').value.trim(), year: parseInt($('year').value, 10),
   vin: $('vin').value.replace(/\s+/g, '').toUpperCase() || null, nickname: $('nickname').value.trim() || null,
   is_primary: $('primary').checked
  };
  if (!body.make || !body.model || !body.year) { setStatus('Choose the make, model and year.', 'err'); return; }
  if (body.vin && body.vin.length !== 17) { setStatus('A VIN has 17 characters. Leave it empty if you don\'t have it.', 'err'); return; }
  $('save').disabled = true; setStatus('Saving…');
  var req = editing ? api('/api/garage/' + editing, { method: 'PUT', body: JSON.stringify(body) }) : api('/api/garage/', { method: 'POST', body: JSON.stringify(body) });
  var wasEditing = editing;
  req.then(function () { return load(); }).then(function () { resetForm(); setStatus(wasEditing ? 'Saved.' : 'Car added.', 'ok'); })
   .catch(function (err) { if (err) setStatus(err.message, 'err'); })
   .finally(function () { $('save').disabled = false; });
 });

 $('list').addEventListener('click', function (e) {
  var p = e.target.closest('[data-primary]'), ed = e.target.closest('[data-edit]'), del = e.target.closest('[data-del]');
  if (p) { p.disabled = true; api('/api/garage/' + p.dataset.primary + '/primary', { method: 'PUT' }).then(load).catch(function (err) { p.disabled = false; if (err) alert(err.message); }); }
  if (del) {
   if (!confirm('Remove this car from your garage?')) return;
   del.disabled = true;
   api('/api/garage/' + del.dataset.del, { method: 'DELETE' }).then(load).catch(function (err) { del.disabled = false; if (err) alert(err.message); });
  }
  if (ed) {
   var c = cars.find(function (x) { return String(x.id) === ed.dataset.edit; });
   if (!c) return;
   editing = c.id;
   setMake(c.make); $('model').value = c.model; $('year').value = c.year; $('vin').value = c.vin || '';
   $('nickname').value = c.nickname || ''; $('primary').checked = !!c.is_primary;
   $('form-title').textContent = 'Edit ' + [c.year, c.make, c.model].join(' ');
   $('save').textContent = 'Save changes'; $('cancel').hidden = false; setStatus('');
   $('add').scrollIntoView({ behavior: 'smooth', block: 'start' });
  }
 });

 load().then(resetForm);
})();
</script>
</body>
</html>
